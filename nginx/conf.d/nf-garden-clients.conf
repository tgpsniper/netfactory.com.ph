# ============================================================
# nf-garden — who is allowed to see the captive-portal redirect
# ============================================================
# The walled garden was built to answer on 8081 so that port 80 could keep
# closing scanner connections with 444. That plan is dead: nothing upstream
# forwards 8081 to this host. Probed from an access router and from this box
# itself, 80 and 443 connect while 3001 and 8081 time out, so the garden has
# to live on a port that is actually reachable, and 80 is the port captive
# probes use anyway.
#
# Moving it onto 80 means the catchall server now has two audiences: restricted
# customers, who must get the redirect, and the open internet, which must keep
# getting 444. They are told apart by source address — the only thing that
# distinguishes them, since a captive probe carries whatever Host it likes.
#
# The ranges below are the customer pools read off the NAT and pppoe-pool
# address-lists of all 15 reachable routers, widened to their natural
# supernets. Deliberately NOT included: 10.0.98.0/24 (this server's own LAN),
# 10.69.69.0/24 and 172.30.0.0/19 (SmartOLT), 10.100.9.0/24, and
# 192.168.97.0/24 + 192.168.98.0/24 (router management). Those must keep
# getting 444, not a redirect.
#
# Being wrong in the inclusive direction costs a scanner one harmless 302 to a
# page that is already public. Being wrong in the exclusive direction leaves a
# paying customer staring at a dead browser with no way to pay, so where the
# two err, this errs wide.
geo $nf_garden_client {
    default           "";

    100.64.0.0/10     1;   # CGNAT: every 100.64-100.68 and 100.100 pool
    10.1.0.0/16       1;
    10.2.0.0/16       1;
    10.3.0.0/16       1;
    10.4.0.0/16       1;
    10.50.0.0/16      1;
    10.240.0.0/16     1;
    172.20.0.0/19     1;
    192.168.20.0/24   1;
    192.168.220.0/24  1;
    192.168.222.0/24  1;
}

# Inverse of the above, so the two audiences can be logged apart: nginx's
# access_log if= treats "" as false.
map $nf_garden_client $nf_garden_scanner {
    ""       1;
    default  "";
}
