<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netfactory — MikroTik Controller</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233b82f6'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='14' font-weight='800' font-family='sans-serif'>NF</text></svg>">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(function(){
  const _fetch = window.fetch;
  window.fetch = function(url, opts) {
    opts = opts || {};
    const urlStr = typeof url === 'string' ? url : (url.url || '');
    if (urlStr.startsWith('/api') || urlStr.includes('/api/')) {
      opts.credentials = 'include';
      const method = (opts.method || 'GET').toUpperCase();
      if (['POST','PUT','DELETE','PATCH'].includes(method)) {
        opts.headers = opts.headers || {};
        if (!opts.headers['X-CSRF-Token'] && !opts.headers['x-csrf-token']) {
          const m = document.cookie.match(/j2_csrf=([^;]+)/);
          if (m) opts.headers['X-CSRF-Token'] = m[1];
        }
      }
    }
    return _fetch.call(this, url, opts);
  };
})();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; background: #1e293b; color: #e2e8f0; overflow: hidden; }
  #root { height: 100vh; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: rgba(96,165,250,0.06); border-radius: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(96,165,250,0.25); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(96,165,250,0.4); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #60a5fa !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text-jsx-source" id="jsx-source">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const t = {
  bg: '#1e293b', bgCard: '#253347', text: '#e2e8f0', textSec: '#94a3b8', textMuted: '#64748b',
  border: '#334155', accent: '#60a5fa', accentDk: '#3b82f6',
  shadow: '0 1px 3px rgba(0,0,0,.15)', shadowLg: '0 10px 30px rgba(0,0,0,.2)',
  input: '#1e293b', inputBorder: '#334155', success: '#34d399', warning: '#fbbf24',
  danger: '#f87171', info: '#22d3ee', sidebar: '#111827',
};

const API = '/api/admin/mikrotik';
const getToken = () => document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith('j2_admin_token='))?.split('=')[1] || localStorage.getItem('j2_admin_token');
const authHeaders = () => ({'Content-Type':'application/json','Authorization':'Bearer '+getToken()});

const apiFetch = async (path, opts = {}) => {
  const res = await fetch(API + path, { ...opts, headers: { ...authHeaders(), ...(opts.headers||{}) } });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error || e.message || 'Request failed ('+res.status+')'); }
  return res.json();
};

const apiPost = (path, body) => apiFetch(path, { method:'POST', body: JSON.stringify(body) });
const apiPut = (path, body) => apiFetch(path, { method:'PUT', body: JSON.stringify(body) });
const apiDelete = (path) => apiFetch(path, { method:'DELETE' });

const fmtBytes = (b) => { if(!b||b===0) return '0 B'; const k=1024,s=['B','KB','MB','GB','TB']; const i=Math.floor(Math.log(b)/Math.log(k)); return (b/Math.pow(k,i)).toFixed(1)+' '+s[i]; };
const fmtUptime = (s) => { if(!s) return '—'; if(typeof s==='string') return s; const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60); return (d?d+'d ':'')+(h?h+'h ':'')+(m?m+'m':''); };

// ═══════════════════════════════════════
// SHARED COMPONENTS
// ═══════════════════════════════════════

const Icon = ({ name, style = {} }) => {
  if (!name) return null;
  if (name.startsWith('fa-')) return <i className={"fas " + name} style={style}></i>;
  if (name.startsWith('far ') || name.startsWith('fas ') || name.startsWith('fab ')) return <i className={name} style={style}></i>;
  return <span style={style}>{name}</span>;
};

const Card = ({ children, style = {} }) => (
  <div style={{ background: t.bgCard, borderRadius: 16, border: `1px solid ${t.border}`, boxShadow: t.shadow, padding: 24, transition: 'all .3s', ...style }}>{children}</div>
);

const Badge = ({ color, label }) => (
  <span style={{ display:'inline-flex', alignItems:'center', gap:5, padding:'4px 12px', borderRadius:20, fontSize:11, fontWeight:600, background:`${color}18`, color, textTransform:'capitalize' }}>
    <span style={{ width:6, height:6, borderRadius:'50%', background:color }} />{label}
  </span>
);

const Btn = ({ children, primary, danger, success, small, disabled, onClick, style = {} }) => (
  <button onClick={disabled?undefined:onClick} style={{
    padding: small ? '6px 14px' : '10px 20px', borderRadius:10,
    background: danger ? t.danger : success ? t.success : primary ? `linear-gradient(135deg,${t.accent},${t.accentDk})` : t.bgCard,
    color: primary||danger||success ? '#fff' : t.textSec,
    border: primary||danger||success ? 'none' : `1px solid ${t.border}`,
    fontSize: small ? 12 : 13, fontWeight:600, cursor: disabled?'not-allowed':'pointer', transition:'all .3s', fontFamily:'inherit',
    display:'inline-flex', alignItems:'center', gap:6, opacity: disabled?0.5:1, ...style,
  }}>{children}</button>
);

const StatCard = ({ icon, label, value, sub, color }) => (
  <Card style={{ display:'flex', gap:16, alignItems:'center' }}>
    <div style={{ width:52, height:52, borderRadius:14, background:`${color}15`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:24, color }}><Icon name={icon} /></div>
    <div style={{ flex:1 }}>
      <div style={{ fontSize:12, color:t.textMuted, fontWeight:500, marginBottom:2 }}>{label}</div>
      <div style={{ fontSize:24, fontWeight:800, color:t.text, fontFamily:"'Space Grotesk',monospace" }}>{value ?? '—'}</div>
      {sub && <div style={{ fontSize:11, color:t.textMuted, marginTop:2 }}>{sub}</div>}
    </div>
  </Card>
);

const TableHead = ({ children, style: s = {} }) => (
  <th style={{ padding:'12px 16px', textAlign:'left', fontSize:11, fontWeight:700, color:t.textMuted, textTransform:'uppercase', letterSpacing:.5, borderBottom:`2px solid ${t.border}`, background:t.bgCard, whiteSpace:'nowrap', position:'sticky', top:0, zIndex:1, ...s }}>{children}</th>
);

const TableCell = ({ children, style = {} }) => (
  <td style={{ padding:'14px 16px', fontSize:13, color:t.textSec, borderBottom:`1px solid ${t.border}`, ...style }}>{children}</td>
);

const InputField = ({ label, value, onChange, placeholder, type='text', options, disabled, style:s={} }) => (
  <div style={{ marginBottom:14, ...s }}>
    {label && <label style={{ fontSize:12, fontWeight:600, color:t.textSec, marginBottom:6, display:'block' }}>{label}</label>}
    {options ? (
      <select value={value} onChange={e => onChange(e.target.value)} disabled={disabled} style={{ width:'100%', padding:'12px 14px', border:`1px solid ${t.inputBorder}`, borderRadius:10, fontSize:13, background:t.input, color:t.text, fontFamily:'inherit', outline:'none' }}>
        {options.map(o => <option key={typeof o==='string'?o:o.value} value={typeof o==='string'?o:o.value}>{typeof o==='string'?o:o.label}</option>)}
      </select>
    ) : type === 'textarea' ? (
      <textarea value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} disabled={disabled}
        style={{ width:'100%', padding:'12px 14px', border:`1px solid ${t.inputBorder}`, borderRadius:10, fontSize:13, background:t.input, color:t.text, fontFamily:'inherit', outline:'none', minHeight:70, resize:'vertical' }} />
    ) : (
      <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} disabled={disabled}
        style={{ width:'100%', padding:'12px 14px', border:`1px solid ${t.inputBorder}`, borderRadius:10, fontSize:13, background:t.input, color:t.text, fontFamily:'inherit', outline:'none' }} />
    )}
  </div>
);

const Modal = ({ title, onClose, children, width = 560 }) => (
  <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.6)', backdropFilter:'blur(6px)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:16 }} onClick={onClose}>
    <div style={{ background:t.bgCard, borderRadius:20, maxWidth:width, width:'100%', boxShadow:'0 40px 80px rgba(0,0,0,.3)', border:`1px solid ${t.border}`, maxHeight:'90vh', display:'flex', flexDirection:'column', animation:'fadeIn .2s ease' }} onClick={e=>e.stopPropagation()}>
      <div style={{ padding:'20px 24px', borderBottom:`1px solid ${t.border}`, display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
        <h2 style={{ fontSize:18, fontWeight:700, color:t.text }}>{title}</h2>
        <div style={{ cursor:'pointer', fontSize:18, color:t.textMuted, padding:4 }} onClick={onClose}><i className="fas fa-xmark"></i></div>
      </div>
      <div style={{ padding:24, overflowY:'auto', flex:1 }}>{children}</div>
    </div>
  </div>
);

const Tabs = ({ tabs, active, onChange }) => (
  <div style={{ display:'flex', gap:4, borderBottom:`2px solid ${t.border}`, marginBottom:20, overflowX:'auto', flexShrink:0 }}>
    {tabs.map(tb => (
      <button key={tb.id} onClick={()=>onChange(tb.id)} style={{
        padding:'10px 20px', fontSize:13, fontWeight:600, cursor:'pointer', border:'none', fontFamily:'inherit',
        background:'transparent', color: active===tb.id ? t.accent : t.textMuted,
        borderBottom: active===tb.id ? `2px solid ${t.accent}` : '2px solid transparent',
        marginBottom:-2, transition:'all .2s', whiteSpace:'nowrap',
      }}>{tb.icon && <><Icon name={tb.icon} /> </>}{tb.label}</button>
    ))}
  </div>
);

const Gauge = ({ value = 0, max = 100, label, unit = '%', color = t.accent, size = 120 }) => {
  const pct = Math.min(100, Math.max(0, (value / max) * 100));
  const r = (size - 16) / 2, c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  return (
    <div style={{ textAlign:'center' }}>
      <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={t.border} strokeWidth={8} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={8}
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round" style={{ transition:'stroke-dashoffset .6s ease' }} />
      </svg>
      <div style={{ marginTop:-size/2-10, position:'relative', fontSize:22, fontWeight:800, color:t.text, fontFamily:"'Space Grotesk',monospace" }}>{Math.round(pct)}{unit}</div>
      <div style={{ fontSize:12, color:t.textMuted, marginTop: size/2-20, fontWeight:500 }}>{label}</div>
    </div>
  );
};

const Spinner = ({ size=32 }) => (
  <div style={{ display:'flex', justifyContent:'center', alignItems:'center', padding:40 }}>
    <div style={{ width:size, height:size, border:`3px solid ${t.border}`, borderTop:`3px solid ${t.accent}`, borderRadius:'50%', animation:'spin 1s linear infinite' }} />
  </div>
);

const Empty = ({ msg = 'No data available', icon = 'fa-inbox' }) => (
  <div style={{ textAlign:'center', padding:60, color:t.textMuted }}>
    <div style={{ fontSize:48, marginBottom:12, opacity:0.3 }}><Icon name={icon} /></div>
    <div style={{ fontSize:14 }}>{msg}</div>
  </div>
);

const ErrorBox = ({ msg }) => (
  <Card style={{ background:'#f8717115', borderColor:t.danger }}>
    <div style={{ display:'flex', gap:12, alignItems:'center', color:t.danger }}>
      <Icon name="fa-circle-exclamation" style={{ fontSize:20 }} />
      <div style={{ fontSize:13 }}>{msg}</div>
    </div>
  </Card>
);

const DataTable = ({ columns, data, actions, emptyMsg }) => (
  data && data.length > 0 ? (
    <div style={{ overflowX:'auto', borderRadius:12, border:`1px solid ${t.border}` }}>
      <table style={{ width:'100%', borderCollapse:'collapse' }}>
        <thead><tr>{columns.map(c=><TableHead key={c.key}>{c.label}</TableHead>)}{actions && <TableHead style={{textAlign:'right'}}>Actions</TableHead>}</tr></thead>
        <tbody>{data.map((row,i)=>(
          <tr key={row.id||row['.id']||i} style={{ transition:'background .2s' }} onMouseOver={e=>e.currentTarget.style.background=t.bg} onMouseOut={e=>e.currentTarget.style.background='transparent'}>
            {columns.map(c=><TableCell key={c.key} style={c.style}>{c.render ? c.render(row) : row[c.key] ?? '—'}</TableCell>)}
            {actions && <TableCell style={{textAlign:'right'}}>{actions(row)}</TableCell>}
          </tr>
        ))}</tbody>
      </table>
    </div>
  ) : <Empty msg={emptyMsg || 'No data available'} />
);

// ═══════════════════════════════════════
// MAIN APP COMPONENT
// ═══════════════════════════════════════

const MikroTikApp = () => {
  // Auth check
  useEffect(() => {
    const tok = document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith('j2_admin_token='))?.split('=')[1] || localStorage.getItem('j2_admin_token');
    if (!tok) window.location.href = '/crm/';
  }, []);

  const [activeTab, setActiveTab] = useState('overview');
  const [refreshKey, setRefreshKey] = useState(0);
  const [devices, setDevices] = useState([]);
  const [selectedDevice, setSelectedDevice] = useState('');
  const [showDeviceModal, setShowDeviceModal] = useState(false);
  const [loading, setLoading] = useState({});
  const [errors, setErrors] = useState({});
  const [data, setData] = useState({});

  const setLoad = (k,v) => setLoading(p=>({...p,[k]:v}));
  const setErr = (k,v) => setErrors(p=>({...p,[k]:v}));
  const setD = (k,v) => setData(p=>({...p,[k]:v}));

  // Fetch devices
  const fetchDevices = useCallback(async () => {
    try {
      const r = await apiFetch('/devices');
      setDevices(r.devices || r || []);
      if (!selectedDevice && (r.devices||r).length > 0) setSelectedDevice((r.devices||r)[0].id || (r.devices||r)[0].label);
    } catch(e) { setErr('devices', e.message); }
  }, []);

  useEffect(() => { fetchDevices(); }, [fetchDevices]);

  const devBase = selectedDevice ? `/devices/${encodeURIComponent(selectedDevice)}` : '';

  const fetchData = useCallback(async (key, path, quiet) => {
    if (!selectedDevice) return;
    if (!quiet) setLoad(key, true);
    setErr(key, null);
    try {
      const r = await apiFetch(devBase + path);
      setD(key, r);
    } catch(e) { setErr(key, e.message); }
    finally { setLoad(key, false); }
  }, [selectedDevice, devBase, refreshKey]);

  // ═══════════════════════════════════════
  // OVERVIEW TAB
  // ═══════════════════════════════════════
  const OverviewTab = () => {
    const [sysInfo, setSysInfo] = useState(null);
    const [ident, setIdent] = useState(null);
    const [health, setHealth] = useState(null);
    const [ifaces, setIfaces] = useState(null);
    const [pppoe, setPppoe] = useState(null);
    const [queues, setQueues] = useState(null);
    const [err, setOvErr] = useState(null);
    const [ovLoading, setOvLoading] = useState(true);

    const loadOverview = useCallback(async (quiet) => {
      if (!selectedDevice) return;
      if (!quiet) setOvLoading(true);
      setOvErr(null);
      try {
        const [sys, idn, hp, ifs, pp, qs] = await Promise.allSettled([
          apiFetch(devBase + '/system/resources'),
          apiFetch(devBase + '/system/identity'),
          apiFetch(devBase + '/system/health'),
          apiFetch(devBase + '/interfaces'),
          apiFetch(devBase + '/pppoe/active'),
          apiFetch(devBase + '/queues/simple'),
        ]);
        if (sys.status==='fulfilled') setSysInfo(sys.value);
        if (idn.status==='fulfilled') setIdent(idn.value);
        if (hp.status==='fulfilled') setHealth(hp.value);
        if (ifs.status==='fulfilled') setIfaces(ifs.value);
        if (pp.status==='fulfilled') setPppoe(pp.value);
        if (qs.status==='fulfilled') setQueues(qs.value);
      } catch(e) { setOvErr(e.message); }
      finally { setOvLoading(false); }
    }, [selectedDevice, devBase, refreshKey]);

    useEffect(() => { loadOverview(); }, [loadOverview]);
    useEffect(() => { const iv = setInterval(() => loadOverview(true), 30000); return () => clearInterval(iv); }, [loadOverview]);

    if (ovLoading) return <Spinner />;
    if (err) return <ErrorBox msg={err} />;

    const sys = Array.isArray(sysInfo) ? (sysInfo[0] || {}) : (sysInfo || {});
    const identityRow = Array.isArray(ident) ? (ident[0] || {}) : (ident || {});
    const identityName = identityRow.name || sys['identity'] || sys.name || '—';
    const hp = Array.isArray(health) ? health : (health?.data || []);
    const getHealth = (name) => { const h = hp.find(x=>x.name===name || x.type===name); return h ? (h.value||h.reading) : null; };
    const cpuLoad = Number(sys['cpu-load'] ?? sys.cpuLoad ?? 0) || 0;
    const totalMem = Number(sys['total-memory'] ?? sys.totalMemory ?? 1) || 1;
    const freeMem = Number(sys['free-memory'] ?? sys.freeMemory ?? 0) || 0;
    const usedMem = sys['used-memory'] != null ? Number(sys['used-memory']) : Math.max(0, totalMem - freeMem);
    const memPct = Math.round((usedMem / totalMem) * 100);
    const ifList = Array.isArray(ifaces) ? ifaces : (ifaces?.data || ifaces?.interfaces || []);
    const ppList = Array.isArray(pppoe) ? pppoe : (pppoe?.data || pppoe?.sessions || []);
    const qList = Array.isArray(queues) ? queues : (queues?.data || queues?.queues || []);

    return (
      <div style={{ animation:'fadeIn .3s ease' }}>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))', gap:16, marginBottom:24 }}>
          <StatCard icon="fa-server" label="Identity" value={identityName} color={t.accent} />
          <StatCard icon="fa-code-branch" label="RouterOS Version" value={sys['version'] || '—'} color={t.info} />
          <StatCard icon="fa-microchip" label="Board" value={sys['board-name'] || sys.boardName || '—'} color={t.warning} />
          <StatCard icon="fa-clock" label="Uptime" value={fmtUptime(sys['uptime'] || sys.uptime)} color={t.success} />
        </div>

        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))', gap:20, marginBottom:24, justifyItems:'center' }}>
          <Gauge value={cpuLoad} label="CPU Load" color={cpuLoad>80?t.danger:cpuLoad>50?t.warning:t.success} />
          <Gauge value={memPct} label="Memory" color={memPct>80?t.danger:memPct>50?t.warning:t.accent} />
        </div>

        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))', gap:16, marginBottom:24 }}>
          <StatCard icon="fa-temperature-half" label="Temperature" value={(getHealth('temperature')||getHealth('cpu-temperature')) ? (getHealth('temperature')||getHealth('cpu-temperature'))+'°C' : '—'} color={t.warning} />
          <StatCard icon="fa-bolt" label="Voltage" value={getHealth('voltage') ? getHealth('voltage')+'V' : '—'} color={t.info} />
          <StatCard icon="fa-fan" label="Fan Speed" value={getHealth('fan-speed') || getHealth('fan1-speed') || '—'} color={t.accent} />
        </div>

        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))', gap:16 }}>
          <StatCard icon="fa-network-wired" label="Interfaces" value={ifList.length} color={t.accent} />
          <StatCard icon="fa-users" label="PPPoE Sessions" value={ppList.length} color={t.success} />
          <StatCard icon="fa-gauge-high" label="Simple Queues" value={qList.length} color={t.warning} />
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════
  // INTERFACES TAB
  // ═══════════════════════════════════════
  const InterfacesTab = () => {
    const [ifaces, setIfaces] = useState([]);
    const [ifLoading, setIfLoading] = useState(true);
    const [ifErr, setIfErr] = useState(null);
    const [toggling, setToggling] = useState(null);

    const load = useCallback(async () => {
      if (!selectedDevice) return;
      setIfLoading(true); setIfErr(null);
      try {
        const r = await apiFetch(devBase + '/interfaces');
        setIfaces(Array.isArray(r) ? r : (r.data || r.interfaces || []));
      } catch(e) { setIfErr(e.message); }
      finally { setIfLoading(false); }
    }, [selectedDevice, devBase, refreshKey]);

    useEffect(() => { load(); }, [load]);

    const toggleIf = async (iface, enable) => {
      setToggling(iface['.id'] || iface.name);
      try {
        await apiPost(devBase + '/interfaces/' + encodeURIComponent(iface['.id'] || iface.name) + '/' + (enable ? 'enable' : 'disable'), {});
        await load();
      } catch(e) { setIfErr(e.message); }
      finally { setToggling(null); }
    };

    if (ifLoading) return <Spinner />;
    if (ifErr) return <ErrorBox msg={ifErr} />;

    return (
      <div style={{ animation:'fadeIn .3s ease' }}>
        <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16 }}>
          <h3 style={{ fontSize:16, fontWeight:700, color:t.text }}>Network Interfaces</h3>
          <Btn small onClick={load}><Icon name="fa-refresh" /> Refresh</Btn>
        </div>
        <DataTable
          columns={[
            { key:'name', label:'Name', render: r=> <span style={{fontWeight:600,color:t.text}}>{r.name}</span> },
            { key:'type', label:'Type' },
            { key:'running', label:'Status', render: r=> <Badge color={r.running==='true'||r.running===true?t.success:t.textMuted} label={r.running==='true'||r.running===true?'running':'disabled'} /> },
            { key:'mtu', label:'MTU' },
            { key:'rx-byte', label:'Rx', render: r=> fmtBytes(r['rx-byte']||r.rxByte||0) },
            { key:'tx-byte', label:'Tx', render: r=> fmtBytes(r['tx-byte']||r.txByte||0) },
            { key:'rx-packet', label:'Rx Pkts', render: r=> (r['rx-packet']||r.rxPacket||0).toLocaleString() },
            { key:'tx-packet', label:'Tx Pkts', render: r=> (r['tx-packet']||r.txPacket||0).toLocaleString() },
          ]}
          data={ifaces}
          actions={row => (
            <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
              {(row.running==='true'||row.running===true) ?

  const PPPoETab = () => {
    const [subTab, setSubTab] = useState('active');
    const [active, setActive] = useState([]);
    const [secrets, setSecrets] = useState([]);
    const [profiles, setProfiles] = useState([]);
    const [servers, setServers] = useState([]);
    const [pLoading, setPLoading] = useState(true);
    const [pErr, setPErr] = useState(null);
    const [searchTerm, setSearchTerm] = useState('');
    const [disconnecting, setDisconnecting] = useState(null);

    const load = useCallback(async () => {
      if (!selectedDevice) return;
      setPLoading(true); setPErr(null);
      try {
        const endpoints = { active: '/pppoe/active', secrets: '/pppoe/secrets', profiles: '/pppoe/profiles', servers: '/pppoe/servers' };
        const r = await apiFetch(devBase + endpoints[subTab]);
        const d = Array.isArray(r) ? r : (r.data || []);
        if (subTab==='active') setActive(d);
        else if (subTab==='secrets') setSecrets(d);
        else if (subTab==='profiles') setProfiles(d);
        else setServers(d);
      } catch(e) { setPErr(e.message); }
      finally { setPLoading(false); }
    }, [selectedDevice, devBase, subTab, refreshKey]);

    useEffect(() => { load(); }, [load]);

    const disconnect = async (session) => {
      setDisconnecting(session['.id']||session.name);
      try {
        await apiPost(devBase + '/pppoe/disconnect', { id: session['.id'] || session.name });
        await load();
      } catch(e) { setPErr(e.message); }
      finally { setDisconnecting(null); }
    };

    const filteredActive = active.filter(s => {
      if (!searchTerm) return true;
      const q = searchTerm.toLowerCase();
      return (s.name||'').toLowerCase().includes(q) || (s.service||'').toLowerCase().includes(q) || (s['caller-id']||s.callerId||'').toLowerCase().includes(q) || (s.address||'').toLowerCase().includes(q);
    });

    return (
      <div style={{ animation:'fadeIn .3s ease' }}>
        <Tabs tabs={[
          {id:'active',label:'Active Sessions',icon:'fa-signal'},
          {id:'secrets',label:'Secrets',icon:'fa-key'},
          {id:'profiles',label:'Profiles',icon:'fa-id-badge'},
          {id:'servers',label:'Servers',icon:'fa-server'},

        <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16, flexWrap:'wrap', gap:8 }}>

            <input value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} placeholder="Search sessions..."

          )}
          <Btn small onClick={load}><Icon name="fa-refresh" /> Refresh</Btn>
        </div>

        {pLoading ? <Spinner /> : pErr ? <ErrorBox msg={pErr} /> : (
          <>
            {subTab==='active' && (
              <DataTable columns={[
                {key:'name',label:'Username',render:r=><span style={{fontWeight:600,color:t.text}}>{r.name}</span>},
                {key:'service',label:'Service'},{key:'caller-id',label:'Caller ID',render:r=>r['caller-id']||r.callerId||'—'},
                {key:'address',label:'Address'},{key:'uptime',label:'Uptime'},
                {key:'encoding',label:'Encoding'},
              ]} data={filteredActive} actions={row=>(
                <Btn small danger disabled={disconnecting===(row['.id']||row.name)} onClick={()=>disconnect(row)}>
                  {disconnecting===(row['.id']||row.name)?'...':'Disconnect'}
                </Btn>
              )} emptyMsg="No active PPPoE sessions" />
            )}
            {subTab==='secrets' && (
              <DataTable columns={[
                {key:'name',label:'Name',render:r=><span style={{fontWeight:600,color:t.text}}>{r.name}</span>},
                {key:'service',label:'Service'},{key:'profile',label:'Profile'},
                {key:'remote-address',label:'Remote Address',render:r=>r['remote-address']||r.remoteAddress||'—'},
              ]} data={secrets} emptyMsg="No PPPoE secrets" />
            )}
            {subTab==='profiles' && (
              <DataTable columns={[
                {key:'name',label:'Name',render:r=><span style={{fontWeight:600,color:t.text}}>{r.name}</span>},
                {key:'local-address',label:'Local Address',render:r=>r['local-address']||r.localAddress||'—'},
                {key:'remote-address',label:'Remote Address',render:r=>r['remote-address']||r.remoteAddress||'—'},
                {key:'rate-limit',label:'Rate Limit',render:r=>r['rate-limit']||r.rateLimit||'—'},
              ]} data={profiles} emptyMsg="No PPPoE profiles" />
            )}
            {subTab==='servers' && (
              <DataTable columns={[
                {key:'service-name',label:'Service Name',render:r=><span style={{fontWeight:600,color:t.text}}>{r['service-name']||r.serviceName||r.name||'—'}</span>},
                {key:'interface',label:'Interface'},{key:'max-mtu',label:'Max MTU',render:r=>r['max-mtu']||r.maxMtu||'—'},
                {key:'max-mru',label:'Max MRU',render:r=>r['max-mru']||r.maxMru||'—'},
                {key:'authentication',label:'Authentication'},
                {key:'disabled',label:'Status',render:r=><Badge color={r.disabled==='true'||r.disabled===true?t.textMuted:t.success} label={r.disabled==='true'||r.disabled===true?'disabled':'enabled'} />},
              ]} data={servers} emptyMsg="No PPPoE servers" />
            )}
          </>
        )}
      </div>
    );
  };

      try {
        const endpoints = { simple: '/queues/simple', tree: '/queues/tree', types: '/queues/types' };
        const r = await apiFetch(devBase + endpoints[subTab]);

      setSaving(true);
      try {
        if (editModal === 'add') {

      } catch(e) { setQErr(e.message); }

      setDeleting(q['.id']||q.id);

        await apiDelete(devBase + '/queues/simple/' + encodeURIComponent(q['.id']||q.id));

          </Modal>

      </div>
    );
  };

  // ═══════════════════════════════════════
  const LogsTab = () => {
    const [logs, setLogs] = useState([]);
    const [logLoading, setLogLoading] = useState(true);
    const [logErr, setLogErr] = useState(null);
    const [logLimit, setLogLimit] = useState(100);
    const [paused, setPaused] = useState(false);
    const intervalRef = useRef(null);

    const load = useCallback(async (quiet) => {
      if (!selectedDevice) return;
      if (!quiet) setLogLoading(true);
      setLogErr(null);
      try {
        const r = await apiFetch(devBase + '/logs?limit=' + logLimit);
        setLogs(Array.isArray(r) ? r : (r.data || r.logs || []));
      } catch(e) { setLogErr(e.message); }
      finally { setLogLoading(false); }
    }, [selectedDevice, devBase, logLimit, refreshKey]);

    useEffect(() => { load(); }, [load]);

    useEffect(() => {
      if (paused) { if(intervalRef.current) clearInterval(intervalRef.current); return; }
      intervalRef.current = setInterval(() => load(true), 10000);
      return () => { if(intervalRef.current) clearInterval(intervalRef.current); };
    }, [load, paused]);

    return (
      <div style={{ animation:'fadeIn .3s ease' }}>
        <div style={{ display:'flex', justifyContent:'space-between', marginBottom:16, flexWrap:'wrap', gap:8, alignItems:'center' }}>
          <h3 style={{ fontSize:16, fontWeight:700, color:t.text }}>System Logs</h3>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <select value={logLimit} onChange={e=>setLogLimit(Number(e.target.value))} style={{ padding:'6px 12px', border:`1px solid ${t.inputBorder}`, borderRadius:8, fontSize:12, background:t.input, color:t.text, outline:'none' }}>
              <option value={50}>50 entries</option>
              <option value={100}>100 entries</option>
              <option value={200}>200 entries</option>
              <option value={500}>500 entries</option>
            </select>
            <Btn small onClick={()=>setPaused(!paused)} style={{background:paused?t.warning+'20':undefined,color:paused?t.warning:undefined}}>
              <Icon name={paused?'fa-play':'fa-pause'} /> {paused?'Resume':'Pause'}
            </Btn>
            <Btn small onClick={()=>load()}><Icon name="fa-refresh" /> Refresh</Btn>
          </div>
        </div>

        {!paused && <div style={{fontSize:11,color:t.textMuted,marginBottom:12}}>Auto-refreshing every 10s {!paused && <span style={{display:'inline-block',width:6,height:6,borderRadius:'50%',background:t.success,marginLeft:6,animation:'spin 2s linear infinite'}} />}</div>}

        {logLoading ? <Spinner /> : logErr ? <ErrorBox msg={logErr} /> : (
          <DataTable columns={[
            {key:'time',label:'Time',render:r=><span style={{fontFamily:'monospace',fontSize:12,color:t.textMuted}}>{r.time||'—'}</span>},
            {key:'topics',label:'Topics',render:r=><span style={{fontSize:12}}>{r.topics||r.topic||'—'}</span>},
            {key:'message',label:'Message',render:r=><span style={{color:t.text,fontSize:12}}>{r.message||'—'}</span>},
          ]} data={logs} emptyMsg="No log entries" />
        )}
      </div>
    );
  };

  // ═══════════════════════════════════════
  // TOOLS TAB
  // ═══════════════════════════════════════
  const ToolsTab = () => {
    const [tool, setTool] = useState('ping');
    const [form, setForm] = useState({ address:'', count:'4', size:'64', interface:'', srcAddress:'', dstAddress:'', protocol:'udp', direction:'both' });
    const [results, setResults] = useState(null);
    const [running, setRunning] = useState(false);
    const [toolErr, setToolErr] = useState(null);
    const [ifaces, setIfaces] = useState([]);

    useEffect(() => {
      if (!selectedDevice) return;
      apiFetch(devBase + '/interfaces').then(r => {
        const list = Array.isArray(r) ? r : (r.data || r.interfaces || []);
        setIfaces(list.map(i=>({value:i.name,label:i.name})));
      }).catch(()=>{});
    }, [selectedDevice, devBase, refreshKey]);

    const runTool = async () => {
      setRunning(true); setToolErr(null); setResults(null);
      try {
        const payload = { ...form };
        const r = await apiPost(devBase + '/tools/' + tool, payload);
        setResults(r);
      } catch(e) { setToolErr(e.message); }
      finally { setRunning(false); }
    };

    return (
      <div style={{ animation:'fadeIn .3s ease' }}>
        <Tabs tabs={[
          {id:'ping',label:'Ping',icon:'fa-satellite-dish'},
          {id:'traceroute',label:'Traceroute',icon:'fa-route'},
          {id:'torch',label:'Torch',icon:'fa-fire'},
          {id:'bandwidth',label:'Bandwidth Test',icon:'fa-gauge-high'},
        ]} active={tool} onChange={v=>{setTool(v);setResults(null);setToolErr(null);}} />

        <div style={{ display:'grid', gridTemplateColumns:'350px 1fr', gap:24, minHeight:300 }}>
          {/* Input Form */}
          <Card>
            <h4 style={{ fontSize:14, fontWeight:700, color:t.text, marginBottom:16 }}>
              {tool==='ping'?'Ping':tool==='traceroute'?'Traceroute':tool==='torch'?'Torch':'Bandwidth Test'} Configuration
            </h4>

            {(tool==='ping'||tool==='traceroute') && (
              <>
                <InputField label="Address" value={form.address} onChange={v=>setForm(p=>({...p,address:v}))} placeholder="8.8.8.8 or example.com" />

                    <InputField label="Count" value={form.count} onChange={v=>setForm(p=>({...p,count:v}))} placeholder="4" />
                    <InputField label="Size (bytes)" value={form.size} onChange={v=>setForm(p=>({...p,size:v}))} placeholder="64" />
                  </div>
                )}
              </>
            )}

            {tool==='torch' && (
              <>
                <InputField label="Interface" value={form.interface} onChange={v=>setForm(p=>({...p,interface:v}))}
                  options={[{value:'',label:'Select interface...'},...ifaces]} />
                <InputField label="Source Address (optional)" value={form.srcAddress} onChange={v=>setForm(p=>({...p,srcAddress:v}))} placeholder="0.0.0.0/0" />
                <InputField label="Destination Address (optional)" value={form.dstAddress} onChange={v=>setForm(p=>({...p,dstAddress:v}))} placeholder="0.0.0.0/0" />
              </>
            )}

            {tool==='bandwidth' && (
              <>
                <InputField label="Address" value={form.address} onChange={v=>setForm(p=>({...p,address:v}))} placeholder="192.168.1.1" />
                <InputField label="Direction" value={form.direction} onChange={v=>setForm(p=>({...p,direction:v}))}
                  options={[{value:'both',label:'Both'},{value:'send',label:'Send'},{value:'receive',label:'Receive'}]} />

                  options={[{value:'udp',label:'UDP'},{value:'tcp',label:'TCP'}]} />

              <div style={{ overflowX:'auto' }}>

                {tool==='ping' && (
                  <>
                    {Array.isArray(results.results||results) ? (
                      <DataTable columns={[
                        {key:'seq',label:'#'},
                        {key:'host',label:'Host'},
                        {key:'size',label:'Size'},
                        {key:'ttl',label:'TTL'},
                        {key:'time',label:'Time',render:r=><span style={{fontFamily:'monospace',color:r.status==='timeout'?t.danger:t.success}}>{r.time||r.status||'—'}</span>},

                      {key:'avg',label:'Avg',render:r=><span style={{fontFamily:'monospace'}}>{r.avg||'—'}</span>},
                      {key:'best',label:'Best',render:r=><span style={{fontFamily:'monospace'}}>{r.best||'—'}</span>},
                      {key:'worst',label:'Worst',render:r=><span style={{fontFamily:'monospace'}}>{r.worst||'—'}</span>},
                    ]} data={results.hops||results.results||results} emptyMsg="No traceroute results" />

                    <pre style={{fontSize:12,color:t.textSec,whiteSpace:'pre-wrap',fontFamily:'monospace',background:t.bg,padding:16,borderRadius:10,maxHeight:400,overflowY:'auto'}}>{typeof results==='string'?results:JSON.stringify(results,null,2)}</pre>

                    <DataTable columns={[
                      {key:'src-address',label:'Source',render:r=><span style={{fontWeight:600,color:t.text}}>{r['src-address']||r.srcAddress||'—'}</span>},
                      {key:'dst-address',label:'Destination',render:r=>r['dst-address']||r.dstAddress||'—'},

                      {key:'rx',label:'Rx',render:r=>fmtBytes(r.rx||r['rx-rate']||0)},
                      {key:'tx',label:'Tx',render:r=>fmtBytes(r.tx||r['tx-rate']||0)},
                    ]} data={results.traffic||results.results||results} emptyMsg="No torch results" />
                  ) : (
                    <pre style={{fontSize:12,color:t.textSec,whiteSpace:'pre-wrap',fontFamily:'monospace',background:t.bg,padding:16,borderRadius:10,maxHeight:400,overflowY:'auto'}}>{typeof results==='string'?results:JSON.stringify(results,null,2)}</pre>
                  )
                )}
                {/* Bandwidth results */}
                {tool==='bandwidth' && (
                  <div>
                    {results.status && <div style={{padding:12,background:t.bg,borderRadius:10,marginBottom:12}}><strong style={{color:t.text}}>Status:</strong> <span style={{color:t.success}}>{results.status}</span></div>}
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                      {results['tx-total-average'] || results.txAvg ? <StatCard icon="fa-arrow-up" label="Tx Average" value={fmtBytes(results['tx-total-average']||results.txAvg||0)+'/s'} color={t.accent} /> : null}
                      {results['rx-total-average'] || results.rxAvg ? <StatCard icon="fa-arrow-down" label="Rx Average" value={fmtBytes(results['rx-total-average']||results.rxAvg||0)+'/s'} color={t.success} /> : null}
                    </div>
                    {!results.status && !results['tx-total-average'] && !results.txAvg && (
                      <pre style={{fontSize:12,color:t.textSec,whiteSpace:'pre-wrap',fontFamily:'monospace',background:t.bg,padding:16,borderRadius:10,maxHeight:400,overflowY:'auto'}}>{typeof results==='string'?results:JSON.stringify(results,null,2)}</pre>
                    )}
                  </div>
                )}
              </div>
            )}
          </Card>
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════
  // DEVICE MANAGEMENT MODAL
  // ═══════════════════════════════════════
  const DeviceModal = () => {
    const [devList, setDevList] = useState([]);
    const [devLoading, setDevLoading] = useState(true);
    const [devErr, setDevErr] = useState(null);
    const [editDev, setEditDev] = useState(null); // null | 'add' | device object
    const [devForm, setDevForm] = useState({ label:'', host:'', port:'8728', username:'admin', password:'', use_tls:false });
    const [devSaving, setDevSaving] = useState(false);
    const [devDeleting, setDevDeleting] = useState(null);
    const [devTesting, setDevTesting] = useState(null);
    const [testResult, setTestResult] = useState(null);
    const [pwChanged, setPwChanged] = useState(false);

    const loadDevices = async () => {
      setDevLoading(true); setDevErr(null);
      try {
        const r = await apiFetch('/devices');
        setDevList(r.devices || r || []);
      } catch(e) { setDevErr(e.message); }
      finally { setDevLoading(false); }
    };

    useEffect(() => { loadDevices(); }, []);

    const openAdd = () => {
      setDevForm({ label:'', host:'', port:'8728', username:'admin', password:'', use_tls:false });
      setPwChanged(true);
      setEditDev('add');
      setTestResult(null);
    };

    const openEdit = (dev) => {
      setDevForm({ label:dev.label||'', host:dev.host||'', port:dev.port||'8728', username:dev.username||'admin', password:'', use_tls:dev.use_tls||false });
      setPwChanged(false);
      setEditDev(dev);
      setTestResult(null);
    };

    const handleSave = async () => {
      setDevSaving(true); setDevErr(null);
      try {
        const payload = { ...devForm };
        // Focusing the password box clears it, so an untouched-but-focused field
        // arrives here as ''. Sending that would blank the stored credential.
        if (editDev !== 'add' && (!pwChanged || !payload.password)) delete payload.password;
        if (editDev === 'add') {
          await apiPost('/devices', payload);
        } else {
          await apiPut('/devices/' + encodeURIComponent(editDev.id || editDev.label), payload);
        }
        setEditDev(null);
        await loadDevices();
        await fetchDevices();
      } catch(e) { setDevErr(e.message); }
      finally { setDevSaving(false); }
    };

    const handleDelete = async (dev) => {
      if (!confirm('Delete device "' + dev.label + '"? This cannot be undone.')) return;
      setDevDeleting(dev.id || dev.label);
      try {
        await apiDelete('/devices/' + encodeURIComponent(dev.id || dev.label));
        await loadDevices();
        await fetchDevices();
      } catch(e) { setDevErr(e.message); }
      finally { setDevDeleting(null); }
    };

    const handleTest = async (dev) => {
      setDevTesting(dev.id || dev.label);
      setTestResult(null);
      try {
        const r = await apiPost('/devices/' + encodeURIComponent(dev.id || dev.label) + '/test', {});
        setTestResult({ id: dev.id||dev.label, ok: true, msg: r.message || 'Connection successful' });
      } catch(e) {
        setTestResult({ id: dev.id||dev.label, ok: false, msg: e.message });
      }
      finally { setDevTesting(null); }
    };

    return (
      <Modal title="Manage MikroTik Devices" onClose={()=>setShowDeviceModal(false)} width={700}>
        {devErr && <div style={{marginBottom:16}}><ErrorBox msg={devErr} /></div>}

        {!editDev ? (
          <>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <div style={{fontSize:13,color:t.textMuted}}>{devList.length} device(s) configured</div>
              <Btn small primary onClick={openAdd}><Icon name="fa-plus" /> Add Device</Btn>
            </div>
            {devLoading ? <Spinner /> : devList.length === 0 ? <Empty msg="No devices configured" icon="fa-server" /> : (
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {devList.map(dev => (
                  <Card key={dev.id||dev.label} style={{padding:16,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <div style={{fontWeight:700,color:t.text,fontSize:15}}>{dev.label}</div>
                      <div style={{fontSize:12,color:t.textMuted,marginTop:2}}>{dev.host}:{dev.port} ({dev.username}){dev.use_tls?' [SSL]':''}</div>
                      {testResult && testResult.id===(dev.id||dev.label) && (
                        <div style={{fontSize:12,marginTop:6,color:testResult.ok?t.success:t.danger,fontWeight:600}}>
                          <Icon name={testResult.ok?'fa-check-circle':'fa-times-circle'} /> {testResult.msg}
                        </div>
                      )}
                    </div>
                    <div style={{display:'flex',gap:6}}>
                      <Btn small disabled={devTesting===(dev.id||dev.label)} onClick={()=>handleTest(dev)}>
                        {devTesting===(dev.id||dev.label)?'Testing...':'Test'}
                      </Btn>
                      <Btn small onClick={()=>openEdit(dev)}><Icon name="fa-pen" /></Btn>
                      <Btn small danger disabled={devDeleting===(dev.id||dev.label)} onClick={()=>handleDelete(dev)}>
                        <Icon name="fa-trash" />
                      </Btn>
                    </div>
                  </Card>
                ))}
              </div>
            )}
          </>
        ) : (
          <>
            <h4 style={{fontSize:14,fontWeight:700,color:t.text,marginBottom:16}}>{editDev==='add'?'Add New Device':'Edit: '+editDev.label}</h4>
            <InputField label="Device Name" value={devForm.label} onChange={v=>setDevForm(p=>({...p,label:v}))} placeholder="Main Router" />
            <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:12}}>
              <InputField label="Host / IP" value={devForm.host} onChange={v=>setDevForm(p=>({...p,host:v}))} placeholder="192.168.88.1" />
              <InputField label="API Port" value={devForm.port} onChange={v=>setDevForm(p=>({...p,port:v}))} placeholder="8728" />
            </div>
            <InputField label="Username" value={devForm.username} onChange={v=>setDevForm(p=>({...p,username:v}))} placeholder="admin" />
            <div style={{marginBottom:14}}>
              <label style={{ fontSize:12, fontWeight:600, color:t.textSec, marginBottom:6, display:'block' }}>
                Password {editDev!=='add' && <span style={{color:t.textMuted,fontWeight:400}}>(leave empty to keep current)</span>}
              </label>
              <input
                type="password"
                value={pwChanged ? devForm.password : '••••••••'}
                onFocus={()=>{if(!pwChanged){setPwChanged(true);setDevForm(p=>({...p,password:''}));}}}
                onChange={e=>{setPwChanged(true);setDevForm(p=>({...p,password:e.target.value}));}}
                placeholder="Device password"
                style={{ width:'100%', padding:'12px 14px', border:`1px solid ${t.inputBorder}`, borderRadius:10, fontSize:13, background:t.input, color:t.text, fontFamily:'inherit', outline:'none' }}
              />
            </div>
            <div style={{marginBottom:14,display:'flex',alignItems:'center',gap:8}}>
              <input type="checkbox" checked={devForm.use_tls} onChange={e=>setDevForm(p=>({...p,use_tls:e.target.checked}))} id="ssl-check" />
              <label htmlFor="ssl-check" style={{fontSize:13,color:t.textSec,cursor:'pointer'}}>Use SSL/TLS (port 8729)</label>
            </div>
            <div style={{display:'flex',gap:12,justifyContent:'flex-end',paddingTop:14,borderTop:`1px solid ${t.border}`}}>
              <Btn onClick={()=>setEditDev(null)}>Cancel</Btn>
              <Btn primary disabled={devSaving||!devForm.label||!devForm.host} onClick={handleSave}>
                {devSaving?'Saving...':(editDev==='add'?'Add Device':'Save Changes')}
              </Btn>
            </div>
          </>
        )}
      </Modal>
    );
  };

  // ═══════════════════════════════════════
  // MAIN RENDER
  // ═══════════════════════════════════════
  const tabDefs = [
    { id:'overview', label:'Overview', icon:'fa-chart-line' },
    { id:'interfaces', label:'Interfaces', icon:'fa-network-wired' },
    { id:'pppoe', label:'PPPoE', icon:'fa-users' },
    { id:'queues', label:'Queues', icon:'fa-gauge-high' },
    { id:'firewall', label:'Firewall', icon:'fa-shield-halved' },
    { id:'ip', label:'IP', icon:'fa-location-dot' },
    { id:'hotspot', label:'Hotspot', icon:'fa-wifi' },
    { id:'logs', label:'Logs', icon:'fa-file-lines' },
    { id:'tools', label:'Tools', icon:'fa-screwdriver-wrench' },
  ];

  const renderTab = () => {
    switch(activeTab) {
      case 'overview': return <OverviewTab />;
      case 'interfaces': return <InterfacesTab />;
      case 'pppoe': return <PPPoETab />;
      case 'queues': return <QueuesTab />;
      case 'firewall': return <FirewallTab />;
      case 'ip': return <IPTab />;
      case 'hotspot': return <HotspotTab />;
      case 'logs': return <LogsTab />;
      case 'tools': return <ToolsTab />;
      default: return <OverviewTab />;
    }
  };

  return (
    <div style={{ height:'100vh', display:'flex', flexDirection:'column', background:t.bg }}>
      {/* ── TOP BAR ── */}
      <div style={{ background:t.bgCard, borderBottom:`1px solid ${t.border}`, padding:'0 24px', height:60, display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0, boxShadow:t.shadow }}>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          {/* Logo */}
          <div style={{ width:36, height:36, borderRadius:10, background:`linear-gradient(135deg,${t.accent},${t.accentDk})`, display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, fontSize:14, color:'#fff', fontFamily:"'Space Grotesk',sans-serif" }}>NF</div>
          <div>
            <div style={{ fontSize:16, fontWeight:700, color:t.text, fontFamily:"'Space Grotesk',sans-serif", lineHeight:1.2 }}>MikroTik Controller</div>
            <div style={{ fontSize:11, color:t.textMuted }}>Network Device Management</div>
          </div>
        </div>

        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          {/* Device selector */}
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <Icon name="fa-server" style={{ color:t.textMuted, fontSize:14 }} />
            <select value={selectedDevice} onChange={e=>setSelectedDevice(e.target.value)}
              style={{ padding:'8px 14px', border:`1px solid ${t.inputBorder}`, borderRadius:10, fontSize:13, background:t.input, color:t.text, outline:'none', minWidth:180 }}>
              {devices.length===0 && <option value="">No devices</option>}
              {devices.map(d => <option key={d.id||d.label} value={d.id||d.label}>{d.label} ({d.host})</option>)}
            </select>
          </div>

          {/* Gear icon */}
          <button onClick={()=>setShowDeviceModal(true)} style={{ background:'transparent', border:'none', color:t.textMuted, fontSize:18, cursor:'pointer', padding:8, borderRadius:8, transition:'all .2s' }}
            onMouseOver={e=>e.currentTarget.style.color=t.accent} onMouseOut={e=>e.currentTarget.style.color=t.textMuted}>
            <Icon name="fa-gear" />
          </button>

          {/* Back to CRM */}
          <a href="/crm/" style={{ display:'flex', alignItems:'center', gap:6, color:t.textMuted, textDecoration:'none', fontSize:13, fontWeight:600, padding:'8px 14px', borderRadius:10, border:`1px solid ${t.border}`, transition:'all .2s' }}
            onMouseOver={e=>{e.currentTarget.style.borderColor=t.accent;e.currentTarget.style.color=t.accent;}}
            onMouseOut={e=>{e.currentTarget.style.borderColor=t.border;e.currentTarget.style.color=t.textMuted;}}>
            <Icon name="fa-arrow-left" /> Back to CRM
          </a>
        </div>
      </div>

      {/* ── TAB NAVIGATION ── */}
      <div style={{ background:t.bgCard, borderBottom:`1px solid ${t.border}`, padding:'0 24px', display:'flex', gap:2, overflowX:'auto', flexShrink:0 }}>
        {tabDefs.map(tab => (
          <button key={tab.id} onClick={()=>{setActiveTab(tab.id);setRefreshKey(k=>k+1);}} style={{
            padding:'12px 18px', fontSize:13, fontWeight:600, cursor:'pointer', border:'none', fontFamily:'inherit',
            background: activeTab===tab.id ? `${t.accent}12` : 'transparent',
            color: activeTab===tab.id ? t.accent : t.textMuted,
            borderBottom: activeTab===tab.id ? `2px solid ${t.accent}` : '2px solid transparent',
            transition:'all .2s', whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:8,
          }}
            onMouseOver={e=>{if(activeTab!==tab.id)e.currentTarget.style.color=t.textSec;}}
            onMouseOut={e=>{if(activeTab!==tab.id)e.currentTarget.style.color=t.textMuted;}}>
            <Icon name={tab.icon} style={{fontSize:14}} /> {tab.label}
          </button>
        ))}
      </div>

      {/* ── CONTENT AREA ── */}
      <div style={{ flex:1, overflowY:'auto', padding:24 }}>
        {!selectedDevice ? (
          <div style={{ textAlign:'center', paddingTop:80 }}>
            <div style={{ fontSize:64, marginBottom:20, opacity:0.2 }}><Icon name="fa-server" /></div>
            <h2 style={{ fontSize:22, fontWeight:700, color:t.text, marginBottom:8 }}>No Device Selected</h2>
            <p style={{ color:t.textMuted, fontSize:14, marginBottom:24 }}>Add a MikroTik device to get started.</p>
            <Btn primary onClick={()=>setShowDeviceModal(true)}><Icon name="fa-plus" /> Add Device</Btn>
          </div>
        ) : renderTab()}
      </div>

      {/* ── DEVICE MODAL ── */}
      {showDeviceModal && <DeviceModal />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(MikroTikApp));
</script>

<!-- Boot Script: localStorage cache for transpiled JSX -->
<script>
(function() {
  var CACHE_KEY = 'j2mt_compiled_v4';
  var src = document.getElementById('jsx-source').textContent;
  function fastHash(s) { for(var h=5381,i=0;i<s.length;i++) h=((h<<5)+h)^s.charCodeAt(i); return (h>>>0).toString(36); }
  var hash = fastHash(src);
  try { var cached = localStorage.getItem(CACHE_KEY); if(cached) { var sep=cached.indexOf('|'); if(sep>0&&cached.substring(0,sep)===hash) { var s=document.createElement('script'); s.textContent=cached.substring(sep+1); document.body.appendChild(s); console.log('[MT] Loaded from cache ('+hash+')'); return; } } } catch(e){}
  console.log('[MT] Cache miss — loading Babel...');
  var babel = document.createElement('script');
  babel.src = 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js';
  babel.onload = function() { try { var t0=performance.now(); var result = Babel.transform(src, {presets:['react']}).code; console.log('[MT] Transpiled in '+Math.round(performance.now()-t0)+'ms'); try{localStorage.setItem(CACHE_KEY, hash+'|'+result);}catch(e){console.warn('[MT] Cache write failed:',e);} var s=document.createElement('script'); s.textContent=result; document.body.appendChild(s); }catch(e){console.error('[MT] Transpile error:',e);} };
  document.head.appendChild(babel);
})();
</script>
</body>
</html>
