<script>
// ── Secure Fetch Interceptor ─────────────────────────────
(function(){
  const _fetch = window.fetch;
  window.fetch = function(url, opts) {
    opts = opts || {};
    const urlStr = typeof url === 'string' ? url : (url.url || '');
    if (urlStr.startsWith('/api') || urlStr.includes('/api/')) {
      opts.credentials = 'include';
      const method = (opts.method || 'GET').toUpperCase();
      if (['POST','PUT','DELETE','PATCH'].includes(method)) {
        opts.headers = opts.headers || {};
        if (!opts.headers['X-CSRF-Token'] && !opts.headers['x-csrf-token']) {
          const m = document.cookie.match(/j2_csrf=([^;]+)/);
          if (m) opts.headers['X-CSRF-Token'] = m[1];
        }
      }
    }
    return _fetch.call(this, url, opts);
  };
})();
</script>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Website — Netfactory CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;display:flex;}

/* ── Sidebar ── */
.sidebar{width:220px;background:#0f172a;color:#fff;display:flex;flex-direction:column;flex-shrink:0;min-height:100vh;}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;}
.sidebar-logo .icon{width:36px;height:36px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;}
.sidebar-logo .text h2{font-size:13px;font-weight:700;}
.sidebar-logo .text span{font-size:10px;color:#64748b;letter-spacing:.5px;}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto;}
.nav-section{font-size:10px;font-weight:700;color:#475569;letter-spacing:.8px;padding:12px 8px 6px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:#94a3b8;margin-bottom:2px;transition:all .15s;text-decoration:none;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#e2e8f0;}
.nav-item.active{background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(139,92,246,.2));color:#fff;border:1px solid rgba(59,130,246,.3);}
.nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
.back-btn{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;color:#64748b;cursor:pointer;text-decoration:none;transition:color .15s;}
.back-btn:hover{color:#94a3b8;}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:58px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0;}
.topbar-title{font-size:18px;font-weight:800;font-family:'Space Grotesk',sans-serif;}
.topbar-subtitle{font-size:12px;color:#94a3b8;margin-top:2px;}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.content{flex:1;padding:24px;overflow-y:auto;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-secondary{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;}
.btn-secondary:hover{background:#e2e8f0;}
.btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
.btn-danger:hover{background:#fee2e2;}
.btn-success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
.btn-success:hover{background:#dcfce7;}
.btn-sm{padding:6px 14px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* ── Card ── */
.card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:24px;margin-bottom:20px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.card-title{font-size:15px;font-weight:700;}
.card-subtitle{font-size:12px;color:#94a3b8;margin-top:3px;}

/* ── Form ── */
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px;}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;font-family:inherit;color:#0f172a;background:#f8fafc;outline:none;transition:border-color .15s;}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#3b82f6;background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1);}
.form-group textarea{resize:vertical;min-height:90px;line-height:1.6;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.form-hint{font-size:11px;color:#94a3b8;margin-top:4px;}

/* ── Section divider ── */
.section-divider{display:flex;align-items:center;gap:12px;margin:24px 0 20px;}
.section-divider span{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;}
.section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:#e2e8f0;}

/* ── Service cards grid ── */
.services-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.service-card{border:1.5px solid #e2e8f0;border-radius:12px;padding:16px;background:#f8fafc;}
.service-card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.service-num{width:28px;height:28px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;}

/* ── FAQ list ── */
.faq-list{display:flex;flex-direction:column;gap:10px;}
.faq-item{border:1.5px solid #e2e8f0;border-radius:12px;background:#f8fafc;overflow:hidden;transition:border-color .15s;}
.faq-item:hover{border-color:#3b82f6;}
.faq-item-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;}
.faq-drag{color:#94a3b8;cursor:grab;font-size:16px;flex-shrink:0;}
.faq-question-text{flex:1;font-size:13px;font-weight:600;color:#0f172a;}
.faq-status{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;flex-shrink:0;}
.faq-status.active{background:#dcfce7;color:#16a34a;}
.faq-status.inactive{background:#f1f5f9;color:#64748b;}
.faq-actions{display:flex;gap:6px;flex-shrink:0;}
.faq-edit-area{padding:0 16px 16px;display:none;}
.faq-edit-area.open{display:block;}

/* ── Badge / Status ── */
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-blue{background:#dbeafe;color:#1d4ed8;}
.badge-green{background:#dcfce7;color:#15803d;}

/* ── Toast ── */
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{padding:13px 18px;border-radius:12px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:slideIn .25s ease;display:flex;align-items:center;gap:9px;min-width:260px;}
.toast-success{background:#16a34a;}
.toast-error{background:#dc2626;}
@keyframes slideIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}

/* ── Preview Link ── */
.preview-bar{background:linear-gradient(135deg,#1e3a5f,#1e1b4b);border-radius:12px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.preview-bar span{color:#93c5fd;font-size:13px;}
.preview-bar a{color:#fff;font-size:12px;font-weight:600;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:8px;text-decoration:none;transition:background .15s;}
.preview-bar a:hover{background:rgba(255,255,255,.25);}

/* ── Loading ── */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:#94a3b8;font-size:14px;}
.spinner{width:24px;height:24px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.active{opacity:1;pointer-events:auto;}
.modal{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 30px 60px rgba(0,0,0,.25);transform:translateY(16px);transition:transform .2s;}
.modal-overlay.active .modal{transform:translateY(0);}
.modal-header{padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{font-size:16px;font-weight:700;}
.modal-close{cursor:pointer;font-size:20px;color:#94a3b8;background:none;border:none;line-height:1;}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid #e2e8f0;display:flex;gap:10px;justify-content:flex-end;}
</style>
</head>

<script>
// ============================================================
// State
// ============================================================
const API = '/api';
const token = localStorage.getItem('j2_admin_token');
const headers = { 'Content-Type':'application/json', 'Authorization':'Bearer '+token };

let currentTab = 'home';
let content = {};       // website settings key/value
let faqs = [];          // FAQ items
let promotions = [];    // Promotions list
let careers = [];       // Careers list
let toggles = {};       // System toggles

// ============================================================
// Bootstrap
// ============================================================
async function init() {
  await loadContent();
  var startTab = new URLSearchParams(window.location.search).get('tab') || 'home';
  showTab(startTab);
}

async function loadContent() {
  try {
    const [contentRes, faqsRes, promosRes, careersRes, togglesRes] = await Promise.all([
      fetch(`${API}/admin/website/content`, {headers}).then(r=>r.json()),
      fetch(`${API}/admin/website/faqs`,    {headers}).then(r=>r.json()),
      fetch(`${API}/admin/promotions`,      {headers}).then(r=>r.json()),
      fetch(`${API}/admin/careers`,         {headers}).then(r=>r.json()),
      fetch(`${API}/admin/system/toggles`,  {headers}).then(r=>r.json()),
    ]);
    content    = contentRes.content    || {};
    faqs       = faqsRes.faqs          || [];
    promotions = promosRes.promotions  || [];
    careers    = careersRes.careers     || [];
    toggles    = togglesRes.toggles    || {};
  } catch(e) {
    toast('Failed to load content', 'error');
  }
}

// ============================================================
// Tab Navigation
// ============================================================
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-'+tab)?.classList.add('active');

  const renders = {
    home:       renderHomeTab,
    about:      renderAboutTab,
    services:   renderServicesTab,
    faq:        renderFaqTab,
    social:     renderSocialTab,
    promotions: renderPromotionsTab,
    careers:    renderCareersTab,
  };
  (renders[tab] || renderHomeTab)();
}

function saveCurrentTab() {
  const saves = {
    home:       saveHomeTab,
    about:      saveAboutTab,
    services:   saveServicesTab,
    faq:        () => toast('Use the individual FAQ save buttons', 'error'),
    social:     saveSocialTab,
    promotions: () => toast('Use the individual promotion actions', 'error'),
    careers:    () => toast('Use the individual career actions', 'error'),
  };
  (saves[currentTab] || saveHomeTab)();
}

// ============================================================
// Home / Hero Tab
// ============================================================
function renderHomeTab() {
  const c = document.getElementById('mainContent');
  c.innerHTML = `
  <div class="preview-bar">
    <span><i class="fas fa-pen-to-square"></i> Editing: <strong>Home / Hero Section</strong></span>
    <a href="https://netfactory.com.ph/#home" target="_blank">View on Site ↗</a>
  </div>

  <div class="card">
    <div class="card-header">
      <div><div class="card-title">Hero Section</div><div class="card-subtitle">The first thing visitors see</div></div>
    </div>
    <div class="form-group">
      <label>Hero Badge Text</label>
      <input type="text" id="f_hero_badge" value="${esc(content.website_hero_badge)}" placeholder="e.g. Now Serving Balanga City, Bataan"/>
      <div class="form-hint">Small pill badge shown above the headline</div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Headline Line 1</label>
        <input type="text" id="f_hero_h1" value="${esc(content.website_hero_headline1)}" placeholder="e.g. Fast. Reliable."/>
      </div>
      <div class="form-group">
        <label>Headline Line 2</label>
        <input type="text" id="f_hero_h2" value="${esc(content.website_hero_headline2)}" placeholder="e.g. Finally Here."/>
      </div>
    </div>
    <div class="form-group">
      <label>Sub Text / Description</label>
      <textarea id="f_hero_sub">${esc(content.website_hero_subtext)}</textarea>
    </div>
    <div class="form-row">

function openAddFaq() {
  document.getElementById('faqModalTitle').textContent = 'Add FAQ';
  document.getElementById('faqModalId').value = '';
  document.getElementById('faqModalQuestion').value = '';
  document.getElementById('faqModalAnswer').value = '';
  document.getElementById('faqModalOrder').value = faqs.length + 1;
  document.getElementById('faqModalActive').value = 'true';
  document.getElementById('faqModal').classList.add('active');
}

function editFaq(id) {
  const f = faqs.find(x => x.id === id);
  if (!f) return;
  document.getElementById('faqModalTitle').textContent = 'Edit FAQ';
  document.getElementById('faqModalId').value = f.id;
  document.getElementById('faqModalQuestion').value = f.question;
  document.getElementById('faqModalAnswer').value = f.answer;
  document.getElementById('faqModalOrder').value = f.sort_order;
  document.getElementById('faqModalActive').value = String(f.is_active);
  document.getElementById('faqModal').classList.add('active');
}

function closeFaqModal() {
  document.getElementById('faqModal').classList.remove('active');
}

async function saveFaqModal() {
  const id       = document.getElementById('faqModalId').value;
  const question = document.getElementById('faqModalQuestion').value.trim();
  const answer   = document.getElementById('faqModalAnswer').value.trim();
  const sort_order = parseInt(document.getElementById('faqModalOrder').value) || 0;
  const is_active  = document.getElementById('faqModalActive').value === 'true';

  if (!question || !answer) { toast('Question and answer are required', 'error'); return; }

  try {
    if (id) {
      await fetch(`${API}/admin/website/faqs/${id}`, {
        method: 'PUT', headers,
        body: JSON.stringify({ question, answer, sort_order, is_active })
      });
      toast('FAQ updated!', 'success');
    } else {
      await fetch(`${API}/admin/website/faqs`, {
        method: 'POST', headers,
        body: JSON.stringify({ question, answer, sort_order, is_active })
      });
      toast('FAQ added!', 'success');
    }
    closeFaqModal();
    await loadContent();
    renderFaqTab();
  } catch(e) { toast('Save failed', 'error'); }
}

async function deleteFaq(id) {
  const f = faqs.find(x => x.id === id);
  if (!confirm(`Delete FAQ:\n"${f?.question}"?\n\nThis cannot be undone.`)) return;
  try {
    await fetch(`${API}/admin/website/faqs/${id}`, { method: 'DELETE', headers });
    toast('FAQ deleted', 'success');
    await loadContent();
    renderFaqTab();
  } catch(e) { toast('Delete failed', 'error'); }
}

      <input type="checkbox" id="tgl_careers_enabled" ${careersEnabled?'checked':''} onchange="setToggle('careers_enabled',this.checked)" style="width:18px;height:18px;accent-color:#10b981;"/>
      Show Careers on Website
    </label>
  </div>

  <div class="card">
    <div class="card-header">
      <div><div class="card-title">Job Postings</div><div class="card-subtitle">Career opportunities shown on the website hero section</div></div>
      <button class="btn btn-primary btn-sm" onclick="openAddCareer()"><i class="fas fa-plus"></i> Add Job Posting</button>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr style="background:#f8fafc;text-align:left;"><th style="padding:10px 12px;">Title</th><th style="padding:10px 12px;">Department</th><th style="padding:10px 12px;">Type</th><th style="padding:10px 12px;">Location</th><th style="padding:10px 12px;">Status</th><th style="padding:10px 12px;width:100px;">Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function openAddCareer() {
  document.getElementById('careerModalTitle').textContent = 'Add Job Posting';
  document.getElementById('careerId').value = '';
  document.getElementById('careerTitle').value = '';
  document.getElementById('careerDept').value = '';
  document.getElementById('careerType').value = 'Full-time';
  document.getElementById('careerLocation').value = 'Balanga City, Bataan';
  document.getElementById('careerActive').value = 'true';
  document.getElementById('careerDesc').value = '';
  document.getElementById('careerReqs').value = '';
  document.getElementById('careerModal').classList.add('active');
}

function editCareer(id) {
  const j = careers.find(x => x.id === id);
  if (!j) return;
  document.getElementById('careerModalTitle').textContent = 'Edit Job Posting';
  document.getElementById('careerId').value = j.id;
  document.getElementById('careerTitle').value = j.title || '';
  document.getElementById('careerDept').value = j.department || '';
  document.getElementById('careerType').value = j.type || 'Full-time';
  document.getElementById('careerLocation').value = j.location || '';
  document.getElementById('careerActive').value = String(!!j.is_active);
  document.getElementById('careerDesc').value = j.description || '';
  document.getElementById('careerReqs').value = j.requirements || '';
  document.getElementById('careerModal').classList.add('active');
}

function closeCareerModal() { document.getElementById('careerModal').classList.remove('active'); }

async function saveCareerModal() {
  const id = document.getElementById('careerId').value;
  const data = {
    title:        val('careerTitle'),
    department:   val('careerDept'),
    type:         document.getElementById('careerType').value,
    location:     val('careerLocation'),
    is_active:    document.getElementById('careerActive').value === 'true',
    description:  val('careerDesc'),
    requirements: val('careerReqs'),
  };
  if (!data.title) { toast('Job title is required', 'error'); return; }
  try {
    if (id) {
      await fetch(`${API}/admin/careers/${id}`, { method: 'PUT', headers, body: JSON.stringify(data) });
      toast('Job posting updated!', 'success');
    } else {
      await fetch(`${API}/admin/careers`, { method: 'POST', headers, body: JSON.stringify(data) });
      toast('Job posting created!', 'success');
    }
    closeCareerModal();
    await loadContent();
    renderCareersTab();
  } catch(e) { toast('Save failed', 'error'); }
}

async function deleteCareer(id) {
  const j = careers.find(x => x.id === id);
  if (!confirm(`Delete job posting:\n"${j?.title}"?\n\nThis cannot be undone.`)) return;
  try {
    await fetch(`${API}/admin/careers/${id}`, { method: 'DELETE', headers });
    toast('Job posting deleted', 'success');
    await loadContent();
    renderCareersTab();
  } catch(e) { toast('Delete failed', 'error'); }
}

// Toggle helper for promotions/careers display settings
async function setToggle(key, value) {
  try {
    const res = await fetch(`${API}/admin/system/toggles`, {
      method: 'PUT', headers,
      body: JSON.stringify({ key, value })
    });
    if (!res.ok) throw new Error();
    toggles[key] = value;
    toast(`${key.replace(/_/g,' ')} ${value ? 'enabled' : 'disabled'}`, 'success');
  } catch(e) { toast('Failed to update toggle', 'error'); }
}

// ============================================================
// Helpers
// ============================================================
async function saveSettings(data) {
  // Update local cache
  Object.entries(data).forEach(([k,v]) => { content[k] = v; });
  const res = await fetch(`${API}/admin/website/content`, {
    method: 'PUT', headers,
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error('Save failed');
}

function val(id) {
  return document.getElementById(id)?.value ?? '';
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toast(msg, type='success') {
  const tc = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.innerHTML = (type==='success' ? '<i class="fas fa-circle-check"></i>' : '<i class="fas fa-circle-xmark"></i>') + ' ' + msg;
  tc.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ── Auth Guard ───────────────────────────────────────────────
if (!token) { window.location.href = '/crm/'; }
else { init(); }


// ============================================================
</script>
