const AlarmsTab = ({ deviceId }) => {
  const [alarms, setAlarms] = useState([]);
  const [loading, setLoading] = useState(true);
  const [lastRefresh, setLastRefresh] = useState(null);
  const [severityFilter, setSeverityFilter] = useState('all');

  const loadAlarms = useCallback(async () => {
    if (!deviceId) return;
    setLoading(true);
    try {
      const res = await fetch(`${API}/devices/${deviceId}/alarms`);
      const data = await res.json();
      if (res.ok) setAlarms(data.alarms || []);
      setLastRefresh(new Date());
    } catch (err) { console.error(err); }
    finally { setLoading(false); }
  }, [deviceId]);

  useEffect(() => { loadAlarms(); }, [loadAlarms]);

  useEffect(() => {
    if (!deviceId) return;
    const iv = setInterval(loadAlarms, 30000);
    return () => clearInterval(iv);
  }, [deviceId, loadAlarms]);

  const getSeverity = (alarm) => {
    const val = String(alarm.value || '').toLowerCase();
    const oid = String(alarm.oid || '').toLowerCase();
    if (val.includes('critical') || val.includes('major') || oid.includes('critical')) return { label:'Critical', color:t.danger, icon:'fa-exclamation-circle', level:3 };
    if (val.includes('minor') || val.includes('warning') || oid.includes('warning')) return { label:'Warning', color:t.warning, icon:'fa-exclamation-triangle', level:2 };
    if (val.includes('info') || val.includes('clear') || oid.includes('info')) return { label:'Info', color:t.info, icon:'fa-info-circle', level:1 };
    return { label:'Minor', color:t.textMuted, icon:'fa-question-circle', level:0 };
  };

  const alarmsWithSev = alarms.map(a => ({ ...a, _sev: getSeverity(a) }));
  const filteredAlarms = severityFilter === 'all' ? alarmsWithSev : alarmsWithSev.filter(a => a._sev.label.toLowerCase() === severityFilter);
  const critCount = alarmsWithSev.filter(a => a._sev.level === 3).length;
  const warnCount = alarmsWithSev.filter(a => a._sev.level === 2).length;
  const infoCount = alarmsWithSev.filter(a => a._sev.level <= 1).length;

  if (!deviceId) return <EmptyState icon="fa-server" title="No Device Selected" sub="Select an OLT device from the dropdown above" />;
  if (loading && alarms.length === 0) return <LoadingSpinner text="Loading alarms..." />;

  return (
    <div style={{ padding:24 }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
        <div>
          <h2 style={{ fontSize:20, fontWeight:700, color:t.text }}>Active Alarms</h2>
          {lastRefresh && (
            <div style={{ fontSize:11, color:t.textMuted, marginTop:4 }}>
              <Icon name="fa-clock" style={{ marginRight:4, fontSize:10 }} />
              Last checked: {lastRefresh.toLocaleTimeString()} (auto-refresh every 30s)
            </div>
          )}
        </div>
        <Btn small onClick={loadAlarms}><Icon name="fa-sync-alt" /> Refresh</Btn>
      </div>

      {/* Alarm severity summary */}
      {alarms.length > 0 && (
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))', gap:12, marginBottom:20 }}>
          <Card style={{ padding:14, cursor:'pointer', borderColor: severityFilter === 'all' ? t.accent : t.border, transition:'border .2s' }} onClick={() => setSeverityFilter('all')}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <div style={{ width:36, height:36, borderRadius:10, background:`${t.accent}15`, display:'flex', alignItems:'center', justifyContent:'center', color:t.accent }}><Icon name="fa-bell" /></div>
              <div>
                <div style={{ fontSize:11, color:t.textMuted }}>All</div>
                <div style={{ fontSize:18, fontWeight:800, color:t.text }}>{alarms.length}</div>
              </div>
            </div>
          </Card>
          <Card style={{ padding:14, cursor:'pointer', borderColor: severityFilter === 'critical' ? t.danger : t.border, transition:'border .2s' }} onClick={() => setSeverityFilter('critical')}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <div style={{ width:36, height:36, borderRadius:10, background:`${t.danger}15`, display:'flex', alignItems:'center', justifyContent:'center', color:t.danger }}><Icon name="fa-exclamation-circle" /></div>
              <div>
                <div style={{ fontSize:11, color:t.textMuted }}>Critical</div>
                <div style={{ fontSize:18, fontWeight:800, color:t.danger }}>{critCount}</div>
              </div>
            </div>
          </Card>
          <Card style={{ padding:14, cursor:'pointer', borderColor: severityFilter === 'warning' ? t.warning : t.border, transition:'border .2s' }} onClick={() => setSeverityFilter('warning')}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <div style={{ width:36, height:36, borderRadius:10, background:`${t.warning}15`, display:'flex', alignItems:'center', justifyContent:'center', color:t.warning }}><Icon name="fa-exclamation-triangle" /></div>
              <div>
                <div style={{ fontSize:11, color:t.textMuted }}>Warning</div>
                <div style={{ fontSize:18, fontWeight:800, color:t.warning }}>{warnCount}</div>
              </div>
            </div>
          </Card>
          <Card style={{ padding:14, cursor:'pointer', borderColor: severityFilter === 'info' || severityFilter === 'minor' ? t.info : t.border, transition:'border .2s' }} onClick={() => setSeverityFilter('info')}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <div style={{ width:36, height:36, borderRadius:10, background:`${t.info}15`, display:'flex', alignItems:'center', justifyContent:'center', color:t.info }}><Icon name="fa-info-circle" /></div>
              <div>
                <div style={{ fontSize:11, color:t.textMuted }}>Info/Minor</div>
                <div style={{ fontSize:18, fontWeight:800, color:t.info }}>{infoCount}</div>
              </div>
            </div>
          </Card>
        </div>
      )}

      {alarms.length === 0 ? (
        <Card style={{ textAlign:'center', padding:'80px 20px' }}>
          <div style={{ width:80, height:80, borderRadius:'50%', background:`${t.success}15`, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 20px', fontSize:36, color:t.success }}>
            <Icon name="fa-check-circle" />
          </div>
          <h3 style={{ fontSize:20, fontWeight:700, color:t.text, marginBottom:8 }}>No Active Alarms</h3>
          <p style={{ fontSize:14, color:t.textMuted, maxWidth:400, margin:'0 auto', lineHeight:1.6 }}>
            All systems are operating normally. The alarm monitor checks for new alarms every 30 seconds automatically.
          </p>
          <div style={{ marginTop:24, display:'inline-flex', alignItems:'center', gap:8, padding:'8px 16px', background:t.bg, borderRadius:8, fontSize:12, color:t.textMuted }}>
            <Icon name="fa-shield-alt" style={{ color:t.success }} /> System healthy
          </div>
        </Card>
      ) : (
        <Card style={{ padding:0, overflow:'hidden' }}>
          <div style={{ overflow:'auto', maxHeight:'calc(100vh - 360px)' }}>
            <table style={{ width:'100%', borderCollapse:'collapse' }}>
              <thead><tr>
                <TableHead style={{ width:120 }}>Severity</TableHead>
                <TableHead>Source (OID)</TableHead>
                <TableHead>Description / Value</TableHead>
                <TableHead>Type</TableHead>
                <TableHead style={{ width:140 }}>Time</TableHead>
              </tr></thead>
              <tbody>
                {filteredAlarms.map((alarm, i) => {
                  const sev = alarm._sev;
                  return (
                    <tr key={i} style={{ transition:'background .15s' }}
                      onMouseEnter={e => e.currentTarget.style.background = `${sev.color}08`}
                      onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                      <TableCell>
                        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                          <div style={{ width:28, height:28, borderRadius:8, background:`${sev.color}20`, display:'flex', alignItems:'center', justifyContent:'center' }}>
                            <Icon name={sev.icon} style={{ color:sev.color, fontSize:13 }} />
                          </div>
                          <Badge color={sev.color} label={sev.label} />
                        </div>
                      </TableCell>
                      <TableCell>
                        <span style={{ fontFamily:'monospace', fontSize:11, color:t.textSec, wordBreak:'break-all' }}>{alarm.oid || 'N/A'}</span>
                      </TableCell>
                      <TableCell>
                        <span style={{ fontSize:13, color:t.text }}>{String(alarm.value || 'N/A')}</span>
                      </TableCell>
                      <TableCell>
                        <span style={{ fontSize:11, color:t.textMuted, fontFamily:'monospace' }}>{alarm.type || 'N/A'}</span>
                      </TableCell>
                      <TableCell>
                        <span style={{ fontSize:12, color:t.textMuted }}>
                          <Icon name="fa-clock" style={{ marginRight:4, fontSize:10 }} />
                          {alarm.timestamp || new Date().toLocaleString()}
                        </span>
                      </TableCell>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      <div style={{ marginTop:12, display:'flex', justifyContent:'space-between', fontSize:12, color:t.textMuted }}>
        <span>
          {filteredAlarms.length} alarm(s) shown
          {severityFilter !== 'all' && <span> (filtered by {severityFilter})</span>}
        </span>
        <span>Auto-refreshing every 30 seconds</span>
      </div>
    </div>
  );
};


// ============================================================

// ============================================================

const DiagnosticsTab = ({ deviceId, device }) => {
  const [ponPort, setPonPort] = useState('1');
  const [onuId, setOnuId] = useState('');
  const [serialSearch, setSerialSearch] = useState('');
  const [diagnostics, setDiagnostics] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const ponCount = device?.pon_port_count || 8;
  const ponOptions = Array.from({ length:ponCount }, (_, i) => ({ value: String(i+1), label: `PON Port ${i+1}` }));

  const runDiagnostics = async () => {
    if (!onuId && !serialSearch) return;
    setLoading(true);
    setDiagnostics(null);
    setError(null);

    try {
      let detail, optical;

      if (serialSearch.trim()) {
        // Search by serial first
        const searchRes = await fetch(`${API}/devices/${deviceId}/onus?search=${encodeURIComponent(serialSearch)}`);
        const searchData = await searchRes.json();
        if (searchRes.ok && searchData.onus && searchData.onus.length > 0) {
          const onu = searchData.onus[0];
          const [dRes, oRes] = await Promise.all([
            fetch(`${API}/devices/${deviceId}/onus/${onu.ponPort}/${onu.onuId}`),
            fetch(`${API}/devices/${deviceId}/onus/${onu.ponPort}/${onu.onuId}/optical`),
          ]);
          detail = await dRes.json();
          optical = await oRes.json();
        } else {
          setError('No ONU found matching that serial number');
          setLoading(false);
          return;
        }
      } else {
        const [dRes, oRes] = await Promise.all([
          fetch(`${API}/devices/${deviceId}/onus/${ponPort}/${onuId}`),
          fetch(`${API}/devices/${deviceId}/onus/${ponPort}/${onuId}/optical`),
        ]);
        detail = await dRes.json();
        optical = await oRes.json();
      }

      setDiagnostics({ ...detail, ...optical });
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  if (!deviceId) return <EmptyState icon="fa-server" title="No Device Selected" sub="Select an OLT device from the dropdown above" />;

  const rxVal = diagnostics?.rxPower != null ? parseFloat(diagnostics.rxPower) : null;
  const txVal = diagnostics?.txPower != null ? parseFloat(diagnostics.txPower) : null;

  return (
    <div style={{ padding:24 }}>
      <h2 style={{ fontSize:20, fontWeight:700, color:t.text, marginBottom:24 }}>ONU Diagnostics</h2>

      <Card style={{ marginBottom:24 }}>
        <h3 style={{ fontSize:14, fontWeight:700, color:t.text, marginBottom:16 }}>
          <Icon name="fa-stethoscope" style={{ marginRight:8, color:t.accent }} /> Select ONU
        </h3>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr auto', gap:12, alignItems:'end' }}>
          <InputField label="PON Port" value={ponPort} onChange={v => setPonPort(v)} options={ponOptions} style={{ marginBottom:0 }} />
          <InputField label="ONU ID" value={onuId} onChange={v => { setOnuId(v); setSerialSearch(''); }} placeholder="e.g. 1" type="number" style={{ marginBottom:0 }} />
          <InputField label="Or Search by Serial" value={serialSearch} onChange={v => { setSerialSearch(v); setOnuId(''); }} placeholder="e.g. VSOL12345678" style={{ marginBottom:0 }} />
          <Btn primary onClick={runDiagnostics} disabled={loading || (!onuId && !serialSearch.trim())}>
            {loading ? <><Icon name="fa-spinner fa-spin" /> Running...</> : <><Icon name="fa-play" /> Run Diagnostics</>}
          </Btn>
        </div>
      </Card>

      {error && (
        <Card style={{ marginBottom:24, borderColor:t.danger }}>
          <div style={{ display:'flex', alignItems:'center', gap:12, color:t.danger }}>
            <Icon name="fa-exclamation-circle" style={{ fontSize:20 }} />
            <span style={{ fontSize:14, fontWeight:600 }}>{error}</span>
          </div>
        </Card>
      )}

      {diagnostics && (
        <div>
          {/* Header banner */}
          <Card style={{ marginBottom:24, padding:20 }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <div style={{ display:'flex', alignItems:'center', gap:16 }}>
                <div style={{ width:52, height:52, borderRadius:14, background:`${t.accent}15`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22, color:t.accent }}>
                  <Icon name="fa-stethoscope" />
                </div>
                <div>
                  <div style={{ fontSize:18, fontWeight:700, color:t.text }}>
                    {diagnostics.serial || 'ONU Diagnostics'}
                  </div>
                  <div style={{ fontSize:12, color:t.textMuted, marginTop:2 }}>
                    {diagnostics.description || 'Diagnostic results'}
                  </div>
                </div>
              </div>
              <StatusBadge status={diagnostics.status} />
            </div>
          </Card>

          {/* Basic info */}
          <h3 style={{ fontSize:14, fontWeight:700, color:t.text, marginBottom:12 }}>
            <Icon name="fa-id-card" style={{ marginRight:8, color:t.info }} />
            ONU Information
          </h3>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:12, marginBottom:24 }}>
            <Card style={{ padding:14 }}>
              <div style={{ fontSize:11, color:t.textMuted, marginBottom:6 }}>Status</div>
              <StatusBadge status={diagnostics.status} />
            </Card>
            <Card style={{ padding:14 }}>
              <div style={{ fontSize:11, color:t.textMuted, marginBottom:6 }}>Serial Number</div>
              <div style={{ fontSize:13, fontWeight:600, color:t.text, fontFamily:'monospace' }}>{diagnostics.serial || 'N/A'}</div>
            </Card>
            <Card style={{ padding:14 }}>
              <div style={{ fontSize:11, color:t.textMuted, marginBottom:6 }}>Description</div>
              <div style={{ fontSize:13, color:t.text }}>{diagnostics.description || '-'}</div>
            </Card>
            <Card style={{ padding:14 }}>
              <div style={{ fontSize:11, color:t.textMuted, marginBottom:6 }}>MAC Address</div>
              <div style={{ fontSize:13, color:t.text, fontFamily:'monospace' }}>{diagnostics.mac || 'N/A'}</div>
            </Card>
          </div>

          {/* Optical levels */}
          <h3 style={{ fontSize:16, fontWeight:700, color:t.text, marginBottom:16 }}>Optical Signal Levels</h3>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:16, marginBottom:24 }}>
            <Card style={{ padding:20, textAlign:'center' }}>
              <div style={{ fontSize:12, color:t.textMuted, marginBottom:12, fontWeight:600 }}>Rx Power</div>
              {rxVal != null ? (
                <div>
                  {/* Gauge visualization */}
                  <div style={{ position:'relative', width:120, height:60, margin:'0 auto 12px', overflow:'hidden' }}>
                    <div style={{ width:120, height:120, borderRadius:'50%', border:`8px solid ${t.border}`, borderBottomColor:'transparent', borderLeftColor:'transparent', position:'absolute', top:0, transform:'rotate(0deg)' }} />
                    <div style={{
                      width:120, height:120, borderRadius:'50%',
                      border:`8px solid ${rxVal > -25 ? t.success : rxVal > -28 ? t.warning : t.danger}`,
                      borderBottomColor:'transparent', borderLeftColor:'transparent',
                      position:'absolute', top:0,
                      transform:`rotate(${Math.max(0, Math.min(180, ((rxVal + 40) / 30) * 180))}deg)`,
                      transition:'transform .5s'
                    }} />
                    <div style={{ position:'absolute', bottom:0, left:'50%', transform:'translateX(-50%)', fontSize:20, fontWeight:800, color: rxVal > -25 ? t.success : rxVal > -28 ? t.warning : t.danger }}>
                      {rxVal.toFixed(2)}
                    </div>
                  </div>
                  <div style={{ fontSize:12, color:t.textMuted }}>dBm</div>
                  <SignalMeter value={rxVal} />
                </div>
              ) : <span style={{ color:t.textMuted }}>N/A</span>}
            </Card>

            <Card style={{ padding:20, textAlign:'center' }}>
              <div style={{ fontSize:12, color:t.textMuted, marginBottom:12, fontWeight:600 }}>Tx Power</div>
              {txVal != null ? (
                <div>
                  <div style={{ fontSize:32, fontWeight:800, color:t.text, marginBottom:8 }}>{txVal.toFixed(2)}</div>
                  <div style={{ fontSize:12, color:t.textMuted }}>dBm</div>
                  <div style={{ marginTop:12, height:8, borderRadius:4, background:t.border, overflow:'hidden' }}>
                    <div style={{ width:`${Math.max(0, Math.min(100, ((txVal + 10) / 15) * 100))}%`, height:'100%', borderRadius:4, background:t.info }} />
                  </div>
                </div>
              ) : <span style={{ color:t.textMuted }}>N/A</span>}
            </Card>

            <Card style={{ padding:20, textAlign:'center' }}>
              <div style={{ fontSize:12, color:t.textMuted, marginBottom:12, fontWeight:600 }}>Distance</div>
              {diagnostics.distance != null ? (
                <div>
                  <div style={{ fontSize:32, fontWeight:800, color:t.text, marginBottom:8 }}>{diagnostics.distance}</div>
                  <div style={{ fontSize:12, color:t.textMuted }}>meters</div>
                  <div style={{ marginTop:12, display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
                    <Icon name="fa-ruler-horizontal" style={{ color:t.accent }} />
                    <span style={{ fontSize:13, color:t.textSec }}>{(diagnostics.distance / 1000).toFixed(2)} km</span>
                  </div>
                </div>
              ) : <span style={{ color:t.textMuted }}>N/A</span>}
            </Card>
          </div>

          {/* Signal quality visualization */}
          <h3 style={{ fontSize:14, fontWeight:700, color:t.text, marginBottom:16 }}>
            <Icon name="fa-chart-bar" style={{ marginRight:8, color:t.accent }} />
            Signal Quality Visualization
          </h3>
          <Card style={{ marginBottom:24 }}>
            <div style={{ display:'flex', alignItems:'flex-end', gap:32, height:160, padding:'16px 24px' }}>
              {[
                { label:'Rx Power', value:rxVal, max:-10, min:-40, unit:'dBm', color: rxVal != null ? (rxVal > -25 ? t.success : rxVal > -28 ? t.warning : t.danger) : t.textMuted, threshold:true },
                { label:'Tx Power', value:txVal, max:5, min:-10, unit:'dBm', color:t.info, threshold:false },
              ].map((bar, i) => {
                const pct = bar.value != null ? Math.max(5, Math.min(100, ((bar.value - bar.min) / (bar.max - bar.min)) * 100)) : 0;
                return (
                  <div key={i} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:8 }}>
                    <div style={{ fontSize:14, fontWeight:700, color:bar.color }}>{bar.value != null ? `${bar.value.toFixed(2)} ${bar.unit}` : 'N/A'}</div>
                    {bar.threshold && bar.value != null && (
                      <Badge color={bar.color} label={bar.value > -25 ? 'Good' : bar.value > -28 ? 'Warning' : 'Critical'} />
                    )}
                    <div style={{ width:'100%', maxWidth:100, height:120, background:t.border, borderRadius:10, overflow:'hidden', display:'flex', alignItems:'flex-end', position:'relative' }}>
                      {/* Threshold lines for Rx */}
                      {bar.threshold && (
                        <div>
                          <div style={{ position:'absolute', bottom:`${((-25 - bar.min) / (bar.max - bar.min)) * 100}%`, left:0, right:0, borderTop:`1px dashed ${t.warning}`, zIndex:1 }} />
                          <div style={{ position:'absolute', bottom:`${((-28 - bar.min) / (bar.max - bar.min)) * 100}%`, left:0, right:0, borderTop:`1px dashed ${t.danger}`, zIndex:1 }} />
                        </div>
                      )}
                      <div style={{ width:'100%', height:`${pct}%`, background:`linear-gradient(to top, ${bar.color}40, ${bar.color})`, borderRadius:10, transition:'height .6s ease-out' }} />
                    </div>
                    <div style={{ fontSize:12, color:t.textMuted, fontWeight:600 }}>{bar.label}</div>
                  </div>
                );
              })}
              {/* Distance as a separate visual */}
              <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:8 }}>
                <div style={{ fontSize:14, fontWeight:700, color:t.text }}>{diagnostics.distance != null ? `${diagnostics.distance} m` : 'N/A'}</div>
                {diagnostics.distance != null && (
                  <div style={{ fontSize:12, color:t.textSec }}>({(diagnostics.distance / 1000).toFixed(2)} km)</div>
                )}
                <div style={{ width:'100%', maxWidth:100, height:120, background:t.border, borderRadius:10, overflow:'hidden', display:'flex', alignItems:'flex-end' }}>
                  <div style={{ width:'100%', height:`${diagnostics.distance != null ? Math.max(5, Math.min(100, (diagnostics.distance / 20000) * 100)) : 0}%`, background:`linear-gradient(to top, ${t.accent}40, ${t.accent})`, borderRadius:10, transition:'height .6s ease-out' }} />
                </div>
                <div style={{ fontSize:12, color:t.textMuted, fontWeight:600 }}>Distance</div>
              </div>
            </div>
          </Card>

          {/* Detailed signal readings table */}
          <h3 style={{ fontSize:14, fontWeight:700, color:t.text, marginBottom:12 }}>
            <Icon name="fa-table" style={{ marginRight:8, color:t.info }} />
            Detailed Readings
          </h3>
          <Card style={{ padding:0, overflow:'hidden', marginBottom:24 }}>
            <table style={{ width:'100%', borderCollapse:'collapse' }}>
              <thead><tr>
                <TableHead>Parameter</TableHead>
                <TableHead>Value</TableHead>
                <TableHead>Status</TableHead>
                <TableHead>Notes</TableHead>
              </tr></thead>
              <tbody>
                <tr>
                  <TableCell><strong style={{ color:t.text }}>Rx Power (ONU)</strong></TableCell>
                  <TableCell>{rxVal != null ? <span style={{ fontFamily:'monospace', fontWeight:600 }}>{rxVal.toFixed(2)} dBm</span> : 'N/A'}</TableCell>
                  <TableCell>{rxVal != null ? <Badge color={rxVal > -25 ? t.success : rxVal > -28 ? t.warning : t.danger} label={rxVal > -25 ? 'Good' : rxVal > -28 ? 'Warning' : 'Critical'} /> : '-'}</TableCell>
                  <TableCell><span style={{ fontSize:12, color:t.textMuted }}>{rxVal != null ? (rxVal > -25 ? 'Within normal range' : rxVal > -28 ? 'Signal degradation detected' : 'Signal loss risk - check fiber') : 'No data available'}</span></TableCell>
                </tr>
                <tr>
                  <TableCell><strong style={{ color:t.text }}>Tx Power (ONU)</strong></TableCell>
                  <TableCell>{txVal != null ? <span style={{ fontFamily:'monospace', fontWeight:600 }}>{txVal.toFixed(2)} dBm</span> : 'N/A'}</TableCell>
                  <TableCell>{txVal != null ? <Badge color={txVal > 0 ? t.success : txVal > -3 ? t.warning : t.danger} label={txVal > 0 ? 'Normal' : 'Low'} /> : '-'}</TableCell>
                  <TableCell><span style={{ fontSize:12, color:t.textMuted }}>ONU transmit power level</span></TableCell>
                </tr>
                <tr>
                  <TableCell><strong style={{ color:t.text }}>Distance</strong></TableCell>
                  <TableCell>{diagnostics.distance != null ? <span style={{ fontFamily:'monospace', fontWeight:600 }}>{diagnostics.distance} m ({(diagnostics.distance / 1000).toFixed(2)} km)</span> : 'N/A'}</TableCell>
                  <TableCell>{diagnostics.distance != null ? <Badge color={diagnostics.distance < 15000 ? t.success : t.warning} label={diagnostics.distance < 15000 ? 'Normal' : 'Long'} /> : '-'}</TableCell>
                  <TableCell><span style={{ fontSize:12, color:t.textMuted }}>Estimated fiber distance from OLT</span></TableCell>
                </tr>
                <tr>
                  <TableCell><strong style={{ color:t.text }}>ONU Status</strong></TableCell>
                  <TableCell><StatusBadge status={diagnostics.status} /></TableCell>
                  <TableCell>-</TableCell>
                  <TableCell><span style={{ fontSize:12, color:t.textMuted }}>Current registration/link status</span></TableCell>
                </tr>
              </tbody>
            </table>
          </Card>

          {/* Threshold reference chart */}
          <h3 style={{ fontSize:14, fontWeight:700, color:t.text, marginBottom:16 }}>
            <Icon name="fa-ruler-combined" style={{ marginRight:8, color:t.warning }} />
            Rx Power Threshold Reference
          </h3>
          <Card style={{ marginBottom:24 }}>
            <div style={{ display:'flex', alignItems:'center', gap:0, height:36, borderRadius:8, overflow:'hidden', marginBottom:16 }}>
              <div style={{ flex:1, background:`${t.danger}30`, height:'100%', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:600, color:t.danger }}>
                <Icon name="fa-exclamation-circle" style={{ marginRight:4, fontSize:10 }} /> Critical
              </div>
              <div style={{ flex:1, background:`${t.warning}30`, height:'100%', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:600, color:t.warning }}>
                <Icon name="fa-exclamation-triangle" style={{ marginRight:4, fontSize:10 }} /> Warning
              </div>
              <div style={{ flex:2, background:`${t.success}30`, height:'100%', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:600, color:t.success }}>
                <Icon name="fa-check-circle" style={{ marginRight:4, fontSize:10 }} /> Good
              </div>
            </div>
            <div style={{ display:'flex', justifyContent:'space-between', fontSize:11, color:t.textMuted, marginBottom:12 }}>
              <span>-40 dBm</span>
              <span>-28 dBm</span>
              <span>-25 dBm</span>
              <span>-10 dBm</span>
            </div>
            {rxVal != null && (
              <div>
                {/* Current value indicator on the bar */}
                <div style={{ position:'relative', height:20, background:t.border, borderRadius:4, overflow:'hidden', marginBottom:12 }}>
                  <div style={{ position:'absolute', left:0, width:'40%', height:'100%', background:`${t.danger}20` }} />
                  <div style={{ position:'absolute', left:'40%', width:'10%', height:'100%', background:`${t.warning}20` }} />
                  <div style={{ position:'absolute', left:'50%', width:'50%', height:'100%', background:`${t.success}20` }} />
                  {/* Marker for current value */}
                  <div style={{
                    position:'absolute',
                    left:`${Math.max(2, Math.min(98, ((rxVal + 40) / 30) * 100))}%`,
                    top:0, width:4, height:'100%',
                    background:rxVal > -25 ? t.success : rxVal > -28 ? t.warning : t.danger,
                    borderRadius:2, transform:'translateX(-50%)',
                    boxShadow:`0 0 6px ${rxVal > -25 ? t.success : rxVal > -28 ? t.warning : t.danger}`,
                  }} />
                </div>
                <div style={{ display:'flex', alignItems:'center', gap:12, padding:10, background:t.bg, borderRadius:8 }}>
                  <Icon name="fa-arrow-right" style={{ color:t.accent }} />
                  <span style={{ fontSize:13, color:t.text }}>Current: <strong style={{ color: rxVal > -25 ? t.success : rxVal > -28 ? t.warning : t.danger }}>{rxVal.toFixed(2)} dBm</strong></span>
                  <Badge color={rxVal > -25 ? t.success : rxVal > -28 ? t.warning : t.danger} label={rxVal > -25 ? 'Good' : rxVal > -28 ? 'Warning' : 'Critical'} />
                  <span style={{ marginLeft:'auto', fontSize:11, color:t.textMuted }}>
                    {rxVal > -25 ? 'No action needed' : rxVal > -28 ? 'Monitor closely - consider fiber inspection' : 'Immediate attention required - check fiber and connectors'}
                  </span>
                </div>
              </div>
            )}
          </Card>

          {/* Recommendations */}
          <h3 style={{ fontSize:14, fontWeight:700, color:t.text, marginBottom:12 }}>
            <Icon name="fa-clipboard-check" style={{ marginRight:8, color:t.success }} />
            Diagnostic Summary
          </h3>
          <Card>
            <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
              {rxVal != null && rxVal < -28 && (
                <div style={{ display:'flex', alignItems:'flex-start', gap:12, padding:12, background:`${t.danger}10`, borderRadius:8, borderLeft:`3px solid ${t.danger}` }}>
                  <Icon name="fa-exclamation-circle" style={{ color:t.danger, fontSize:16, marginTop:2 }} />
                  <div>
                    <div style={{ fontSize:13, fontWeight:600, color:t.danger }}>Critical Signal Level</div>
                    <div style={{ fontSize:12, color:t.textSec, marginTop:4 }}>Rx power is below -28 dBm. This may cause intermittent connectivity or packet loss. Check fiber connectors, splitters, and cable integrity.</div>
                  </div>
                </div>
              )}
              {rxVal != null && rxVal >= -28 && rxVal < -25 && (
                <div style={{ display:'flex', alignItems:'flex-start', gap:12, padding:12, background:`${t.warning}10`, borderRadius:8, borderLeft:`3px solid ${t.warning}` }}>
                  <Icon name="fa-exclamation-triangle" style={{ color:t.warning, fontSize:16, marginTop:2 }} />
                  <div>
                    <div style={{ fontSize:13, fontWeight:600, color:t.warning }}>Marginal Signal Level</div>
                    <div style={{ fontSize:12, color:t.textSec, marginTop:4 }}>Rx power is between -25 and -28 dBm. The connection is functional but approaching threshold. Schedule fiber inspection if possible.</div>
                  </div>
                </div>
              )}
              {rxVal != null && rxVal >= -25 && (
                <div style={{ display:'flex', alignItems:'flex-start', gap:12, padding:12, background:`${t.success}10`, borderRadius:8, borderLeft:`3px solid ${t.success}` }}>
                  <Icon name="fa-check-circle" style={{ color:t.success, fontSize:16, marginTop:2 }} />
                  <div>
                    <div style={{ fontSize:13, fontWeight:600, color:t.success }}>Signal Level Normal</div>
                    <div style={{ fontSize:12, color:t.textSec, marginTop:4 }}>Rx power is above -25 dBm, which is within the acceptable range. No action needed.</div>
                  </div>
                </div>
              )}
              {diagnostics.distance != null && diagnostics.distance > 15000 && (
                <div style={{ display:'flex', alignItems:'flex-start', gap:12, padding:12, background:`${t.info}10`, borderRadius:8, borderLeft:`3px solid ${t.info}` }}>
                  <Icon name="fa-info-circle" style={{ color:t.info, fontSize:16, marginTop:2 }} />
                  <div>
                    <div style={{ fontSize:13, fontWeight:600, color:t.info }}>Long Distance ONU</div>
                    <div style={{ fontSize:12, color:t.textSec, marginTop:4 }}>This ONU is {(diagnostics.distance / 1000).toFixed(1)} km away, which is relatively far. Signal degradation is expected at longer distances.</div>
                  </div>
                </div>
              )}
              {(rxVal == null && txVal == null) && (
                <div style={{ display:'flex', alignItems:'flex-start', gap:12, padding:12, background:`${t.textMuted}10`, borderRadius:8, borderLeft:`3px solid ${t.textMuted}` }}>
                  <Icon name="fa-question-circle" style={{ color:t.textMuted, fontSize:16, marginTop:2 }} />
                  <div>
                    <div style={{ fontSize:13, fontWeight:600, color:t.text }}>No Optical Data Available</div>
                    <div style={{ fontSize:12, color:t.textSec, marginTop:4 }}>Optical level readings are not available. The ONU may be offline or the OLT may not support SNMP optical level queries for this ONU.</div>
                  </div>
                </div>
              )}
            </div>
          </Card>
        </div>
      )}
    </div>
  );
};


// ============================================================
//  DEVICE MANAGEMENT MODAL
// ============================================================

const DeviceManagerModal = ({ onClose, onDeviceChange, showToast }) => {
  const [devices, setDevices] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editDevice, setEditDevice] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [testing, setTesting] = useState(null);
  const [testResult, setTestResult] = useState(null);

  const emptyForm = {
    label:'', host:'', olt_model:'V1600G', snmp_community:'public', snmp_version:'2c', snmp_port:'161',
    ssh_username:'', ssh_password:'', enable_password:'', ssh_port:'22', telnet_port:'23', use_ssh:true, pon_port_count:'8', notes:''
  };
  const [form, setForm] = useState(emptyForm);
  const [submitting, setSubmitting] = useState(false);

  const modelOptions = [
    { value:'V1600G', label:'V1600G' },
    { value:'V1600D', label:'V1600D' },
    { value:'V1600G4', label:'V1600G4' },
    { value:'V1600D8', label:'V1600D8' },
  ];

  const snmpVersionOptions = [
    { value:'1', label:'v1' },
    { value:'2c', label:'v2c' },
    { value:'3', label:'v3' },
  ];

  const loadDevices = async () => {
    setLoading(true);
    try {
      const res = await fetch(`${API}/devices`);
      const data = await res.json();
      if (res.ok) setDevices(data.devices || []);
    } catch (err) { console.error(err); }
    finally { setLoading(false); }
  };

  useEffect(() => { loadDevices(); }, []);

  const openAdd = () => {
    setForm(emptyForm);
    setEditDevice(null);
    setShowForm(true);
    setTestResult(null);
  };

  const openEdit = (d) => {
    setForm({
      label: d.label || '',
      host: d.host || '',
      olt_model: d.olt_model || 'V1600G',
      snmp_community: d.snmp_community || 'public',
      snmp_version: d.snmp_version || '2c',
      snmp_port: String(d.snmp_port || 161),
      ssh_username: d.ssh_username || '',
      ssh_password: d.ssh_password || '', enable_password: d.enable_password || '',
      ssh_port: String(d.ssh_port || 22),
      telnet_port: String(d.telnet_port || 23),
      use_ssh: d.use_ssh !== false,
      pon_port_count: String(d.pon_port_count || 8),
      notes: d.notes || '',
    });
    setEditDevice(d);
    setShowForm(true);
    setTestResult(null);
  };

  const handleSave = async () => {
    if (!form.label || !form.host) { showToast('Label and Host are required', 'error'); return; }
    setSubmitting(true);
    try {
      const body = {
        label: form.label,
        host: form.host,
        olt_model: form.olt_model,
        snmp_community: form.snmp_community,
        snmp_version: form.snmp_version,
        snmp_port: parseInt(form.snmp_port, 10),
        ssh_username: form.ssh_username || null,
        ssh_password: form.ssh_password || null,
        enable_password: form.enable_password || null,
        ssh_port: parseInt(form.ssh_port, 10),
        telnet_port: parseInt(form.telnet_port, 10),
        use_ssh: form.use_ssh,
        pon_port_count: parseInt(form.pon_port_count, 10),
        notes: form.notes || null,
      };

      let res;
      if (editDevice) {
        res = await fetch(`${API}/devices/${editDevice.id}`, {
          method: 'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body),
        });
      } else {
        res = await fetch(`${API}/devices`, {
          method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body),
        });
      }

      const data = await res.json();
      if (res.ok) {
        showToast(editDevice ? 'Device updated' : 'Device created', 'success');
        setShowForm(false);
        loadDevices();
        onDeviceChange();
      } else {
        showToast(data.error || 'Save failed', 'error');
      }
    } catch (err) { showToast(err.message, 'error'); }
    finally { setSubmitting(false); }
  };

  const deleteDevice = async (id) => {
    if (!window.confirm('Are you sure you want to delete this device?')) return;
    try {
      const res = await fetch(`${API}/devices/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok) { showToast('Device deleted', 'success'); loadDevices(); onDeviceChange(); }
      else showToast(data.error || 'Delete failed', 'error');
    } catch (err) { showToast(err.message, 'error'); }
  };

  const testDevice = async (id) => {
    setTesting(id);
    setTestResult(null);
    try {
      const res = await fetch(`${API}/devices/${id}/test`, { method: 'POST', headers:{'Content-Type':'application/json'} });
      const data = await res.json();
      setTestResult({ id, ...data });
      if (res.ok) showToast('Connection test complete', 'success');
      else showToast(data.error || 'Test failed', 'error');
    } catch (err) { showToast(err.message, 'error'); setTestResult({ id, error:err.message }); }
    finally { setTesting(null); }
  };

  return (
    <Modal title="Device Management" onClose={onClose} wide>
      {showForm ? (
        <div>
          <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:20 }}>
            <button onClick={() => setShowForm(false)} style={{ background:'none', border:'none', color:t.textMuted, cursor:'pointer', fontSize:14 }}>
              <Icon name="fa-arrow-left" /> Back to list
            </button>
            <h3 style={{ fontSize:15, fontWeight:700, color:t.text }}>{editDevice ? 'Edit Device' : 'Add New Device'}</h3>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
            <InputField label="Label *" value={form.label} onChange={v => setForm({...form, label:v})} placeholder="e.g. Main OLT" />
            <InputField label="Host/IP *" value={form.host} onChange={v => setForm({...form, host:v})} placeholder="e.g. 192.168.1.1" />
            <InputField label="Model" value={form.olt_model} onChange={v => setForm({...form, olt_model:v})} options={modelOptions} />
            <InputField label="PON Port Count" value={form.pon_port_count} onChange={v => setForm({...form, pon_port_count:v})} type="number" />
            <InputField label="SNMP Community" value={form.snmp_community} onChange={v => setForm({...form, snmp_community:v})} placeholder="public" />
            <InputField label="SNMP Version" value={form.snmp_version} onChange={v => setForm({...form, snmp_version:v})} options={snmpVersionOptions} />
            <InputField label="SNMP Port" value={form.snmp_port} onChange={v => setForm({...form, snmp_port:v})} type="number" />
            <InputField label="SSH Username" value={form.ssh_username} onChange={v => setForm({...form, ssh_username:v})} placeholder="admin" />
            <InputField label="SSH Password" value={form.ssh_password} onChange={v => setForm({...form, ssh_password:v})} placeholder="password" type="password" />
            <InputField label="Enable Password" value={form.enable_password} onChange={v => setForm({...form, enable_password:v})} placeholder="privileged mode (enable)" type="password" />
            <InputField label="SSH Port" value={form.ssh_port} onChange={v => setForm({...form, ssh_port:v})} type="number" />
            <InputField label="Telnet Port" value={form.telnet_port} onChange={v => setForm({...form, telnet_port:v})} type="number" />
            <div style={{ marginBottom:14 }}>
              <label style={{ fontSize:12, fontWeight:600, color:t.textSec, marginBottom:6, display:'block' }}>Use SSH</label>
              <label style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer' }}>
                <input type="checkbox" checked={form.use_ssh} onChange={e => setForm({...form, use_ssh:e.target.checked})} />
                <span style={{ fontSize:13, color:t.text }}>{form.use_ssh ? 'Enabled' : 'Disabled'}</span>
              </label>
            </div>
          </div>

          <InputField label="Notes" value={form.notes} onChange={v => setForm({...form, notes:v})} placeholder="Optional notes" />

          <div style={{ display:'flex', gap:12, marginTop:16 }}>
            <Btn onClick={() => setShowForm(false)}>Cancel</Btn>
            <Btn primary onClick={handleSave} disabled={submitting}>
              {submitting ? <><Icon name="fa-spinner fa-spin" /> Saving...</> : <><Icon name="fa-save" /> {editDevice ? 'Update' : 'Create'}</>}
            </Btn>
          </div>
        </div>
      ) : (
        <div>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:20 }}>
            <span style={{ fontSize:13, color:t.textMuted }}>{devices.length} device(s)</span>
            <Btn small primary onClick={openAdd}><Icon name="fa-plus" /> Add Device</Btn>
          </div>

          {loading ? <LoadingSpinner text="Loading devices..." /> : devices.length === 0 ? (
            <Card style={{ textAlign:'center', padding:'60px 20px' }}>
              <div style={{ width:72, height:72, borderRadius:'50%', background:`${t.accent}15`, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 20px', fontSize:32, color:t.accent }}>
                <Icon name="fa-server" />
              </div>
              <h3 style={{ fontSize:18, fontWeight:700, color:t.text, marginBottom:8 }}>No Devices Configured</h3>
              <p style={{ fontSize:13, color:t.textMuted, marginBottom:20 }}>Add your first VSOL OLT device to start monitoring</p>
              <Btn primary onClick={openAdd}><Icon name="fa-plus" /> Add First Device</Btn>
            </Card>
          ) : (
            <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
              {devices.map(d => (
                <Card key={d.id} style={{ padding:16 }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:12 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:16 }}>
                      <div style={{ width:48, height:48, borderRadius:12, background:`${d.is_active !== false ? t.accent : t.textMuted}15`, display:'flex', alignItems:'center', justifyContent:'center', color:d.is_active !== false ? t.accent : t.textMuted, fontSize:22 }}>
                        <Icon name="fa-server" />
                      </div>
                      <div>
                        <div style={{ fontSize:15, fontWeight:700, color:t.text }}>{d.label}</div>
                        <div style={{ display:'flex', gap:12, fontSize:12, color:t.textMuted, marginTop:4, flexWrap:'wrap' }}>
                          <span><Icon name="fa-globe" style={{ marginRight:4, fontSize:10 }} />{d.host}</span>
                          <span><Icon name="fa-microchip" style={{ marginRight:4, fontSize:10 }} />{d.olt_model || 'Unknown model'}</span>
                          <span><Icon name="fa-ethernet" style={{ marginRight:4, fontSize:10 }} />{d.pon_port_count || 8} PON ports</span>
                          <span><Icon name="fa-network-wired" style={{ marginRight:4, fontSize:10 }} />SNMP {d.snmp_version || '2c'}</span>
                          {d.use_ssh && <span><Icon name="fa-terminal" style={{ marginRight:4, fontSize:10 }} />SSH:{d.ssh_port || 22}</span>}
                        </div>
                        {d.notes && <div style={{ fontSize:11, color:t.textMuted, marginTop:4, fontStyle:'italic' }}>{d.notes}</div>}
                      </div>
                    </div>
                    <div style={{ display:'flex', gap:8, alignItems:'center' }}>
                      <Badge color={d.is_active !== false ? t.success : t.danger} label={d.is_active !== false ? 'Active' : 'Inactive'} />
                      <Btn small onClick={() => testDevice(d.id)} disabled={testing === d.id}>
                        {testing === d.id ? <><Icon name="fa-spinner fa-spin" /> Testing...</> : <><Icon name="fa-plug" /> Test</>}
                      </Btn>
                      <Btn small onClick={() => openEdit(d)}><Icon name="fa-edit" /> Edit</Btn>
                      <Btn small onClick={() => deleteDevice(d.id)} style={{ color:t.danger }}><Icon name="fa-trash" /></Btn>
                    </div>
                  </div>

                  {testResult && testResult.id === d.id && (
                    <div style={{ marginTop:16, padding:16, background:t.bg, borderRadius:10, fontSize:12 }}>
                      <div style={{ fontSize:13, fontWeight:700, color:t.text, marginBottom:10 }}>Connection Test Results</div>
                      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                        <div style={{ padding:12, background:t.bgCard, borderRadius:8, border:`1px solid ${t.border}` }}>
                          <div style={{ fontSize:11, color:t.textMuted, marginBottom:6 }}>SNMP Connection</div>
                          {testResult.results?.snmp ? (
                            <div>
                              <div style={{ display:'flex', alignItems:'center', gap:6, color:t.success, fontWeight:600, marginBottom:4 }}>
                                <Icon name="fa-check-circle" /> Connected
                              </div>
                              {testResult.results.snmp.sysName && <div style={{ fontSize:11, color:t.textSec }}>Name: {testResult.results.snmp.sysName}</div>}
                              {testResult.results.snmp.uptime && <div style={{ fontSize:11, color:t.textSec }}>Uptime: {testResult.results.snmp.uptime}</div>}
                            </div>
                          ) : testResult.error ? (
                            <div style={{ color:t.danger, fontWeight:600 }}><Icon name="fa-times-circle" /> {testResult.error}</div>
                          ) : (
                            <div style={{ color:t.danger, fontWeight:600 }}><Icon name="fa-times-circle" /> Failed</div>
                          )}
                        </div>
                        <div style={{ padding:12, background:t.bgCard, borderRadius:8, border:`1px solid ${t.border}` }}>
                          <div style={{ fontSize:11, color:t.textMuted, marginBottom:6 }}>SSH Connection</div>
                          {testResult.results?.ssh?.connected ? (
                            <div style={{ display:'flex', alignItems:'center', gap:6, color:t.success, fontWeight:600 }}>
                              <Icon name="fa-check-circle" /> Connected
                            </div>
                          ) : (
                            <div style={{ color:t.warning, fontWeight:600 }}>
                              <Icon name="fa-minus-circle" /> {testResult.results?.ssh?.message || testResult.results?.ssh?.error || 'Not tested'}
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </Card>
              ))}
            </div>
          )}
        </div>
      )}
    </Modal>
  );
};


// ============================================================
//  MAIN APP
// ============================================================

const OLTApp = () => {
  const [devices, setDevices] = useState([]);
  const [selectedDeviceId, setSelectedDeviceId] = useState(null);
  const [activeTab, setActiveTab] = useState('overview');
  const [showDeviceModal, setShowDeviceModal] = useState(false);
  const [toast, setToast] = useState(null);
  const [loadingDevices, setLoadingDevices] = useState(true);

  const showToast = (message, type = 'info') => setToast({ message, type });

  const loadDevices = async () => {
    setLoadingDevices(true);
    try {
      const res = await fetch(`${API}/devices`);
      const data = await res.json();
      if (res.ok) {
        const devs = data.devices || [];
        setDevices(devs);
        if (!selectedDeviceId && devs.length > 0) setSelectedDeviceId(devs[0].id);
        else if (selectedDeviceId && !devs.find(d => d.id === selectedDeviceId) && devs.length > 0) setSelectedDeviceId(devs[0].id);
      }
    } catch (err) { console.error(err); }
    finally { setLoadingDevices(false); }
  };

  useEffect(() => { loadDevices(); }, []);

  const selectedDevice = devices.find(d => d.id === selectedDeviceId) || null;

  const tabs = [
    { id:'overview',    label:'Overview',       icon:'fa-tachometer-alt' },
    { id:'pon-ports',   label:'PON Ports',      icon:'fa-ethernet' },
    { id:'onus',        label:'ONUs',           icon:'fa-cube' },
    { id:'register',    label:'Registration',   icon:'fa-plus-circle' },
    { id:'mappings',    label:'Mappings',       icon:'fa-link' },
    { id:'alarms',      label:'Alarms',         icon:'fa-bell' },
    { id:'diagnostics', label:'Diagnostics',    icon:'fa-stethoscope' },
  ];

  return (
    <div style={{ height:'100vh', display:'flex', flexDirection:'column', background:t.bg, color:t.text }}>
      {/* Top bar */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 24px', background:t.bgCard, borderBottom:`1px solid ${t.border}`, flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <div style={{ width:36, height:36, borderRadius:9, background:`linear-gradient(135deg,${t.accent},${t.accentDk})`, display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontWeight:800, fontSize:14, letterSpacing:-0.5 }}>NF</div>
          <div>
            <h1 style={{ fontSize:17, fontWeight:700, color:t.text, lineHeight:1.2 }}>OLT Manager</h1>
            <div style={{ fontSize:10, color:t.textMuted, marginTop:1 }}>VSOL OLT Management Console</div>
          </div>

          {/* Separator */}
          <div style={{ width:1, height:32, background:t.border, margin:'0 4px' }} />

          {/* Device selector */}
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ fontSize:12, color:t.textMuted, fontWeight:600, whiteSpace:'nowrap' }}>
              <Icon name="fa-server" style={{ marginRight:4 }} /> Device:
            </div>
            <select value={selectedDeviceId || ''} onChange={e => setSelectedDeviceId(parseInt(e.target.value, 10) || null)}
              style={{ padding:'8px 14px', border:`1px solid ${t.inputBorder}`, borderRadius:8, fontSize:13, background:t.input, color:t.text, fontFamily:'inherit', outline:'none', minWidth:220 }}>
              {devices.length === 0 && <option value="">No devices configured</option>}
              {devices.map(d => <option key={d.id} value={d.id}>{d.label} ({d.host})</option>)}
            </select>
            {selectedDevice && (
              <div style={{ display:'flex', alignItems:'center', gap:6, fontSize:11 }}>
                <span style={{ width:8, height:8, borderRadius:'50%', background: selectedDevice.is_active !== false ? t.success : t.danger }} />
                <span style={{ color:t.textMuted }}>{selectedDevice.olt_model || 'OLT'}</span>
                <span style={{ color:t.textMuted }}>|</span>
                <span style={{ color:t.textMuted }}>{selectedDevice.pon_port_count || 8} ports</span>
              </div>
            )}
          </div>
        </div>

        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={() => setShowDeviceModal(true)} title="Device Settings"
            style={{ width:36, height:36, borderRadius:8, background:t.bg, border:`1px solid ${t.border}`, color:t.textMuted, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, transition:'all .2s' }}>
            <Icon name="fa-cog" />
          </button>
          <a href="/crm/" style={{ padding:'8px 16px', borderRadius:8, border:`1px solid ${t.border}`, background:t.bg, color:t.textSec, fontSize:13, fontWeight:600, textDecoration:'none', display:'flex', alignItems:'center', gap:6, transition:'all .2s' }}>
            <Icon name="fa-arrow-left" /> Back to CRM
          </a>
        </div>
      </div>

      {/* Tabs */}
      <Tabs tabs={tabs} active={activeTab} onChange={setActiveTab} />

      {/* Content */}
      <div style={{ flex:1, overflow:'auto' }}>
        {loadingDevices ? (
          <LoadingSpinner text="Loading OLT devices..." />
        ) : devices.length === 0 ? (
          <div style={{ padding:40 }}>
            <Card style={{ textAlign:'center', padding:'80px 40px', maxWidth:500, margin:'0 auto' }}>
              <div style={{ width:80, height:80, borderRadius:'50%', background:`${t.accent}15`, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 24px', fontSize:36, color:t.accent }}>
                <Icon name="fa-server" />
              </div>
              <h2 style={{ fontSize:22, fontWeight:700, color:t.text, marginBottom:12 }}>Welcome to OLT Manager</h2>
              <p style={{ fontSize:14, color:t.textMuted, marginBottom:24, lineHeight:1.6 }}>
                No OLT devices have been configured yet. Add your first VSOL OLT device to begin monitoring PON ports, ONUs, and optical signal levels.
              </p>
              <Btn primary onClick={() => setShowDeviceModal(true)}>
                <Icon name="fa-plus" /> Add Your First Device
              </Btn>
              <div style={{ marginTop:24, display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:16 }}>
                <div style={{ padding:12, background:t.bg, borderRadius:8 }}>
                  <Icon name="fa-ethernet" style={{ color:t.accent, fontSize:20, marginBottom:8 }} />
                  <div style={{ fontSize:11, color:t.textMuted }}>PON Port Monitoring</div>
                </div>
                <div style={{ padding:12, background:t.bg, borderRadius:8 }}>
                  <Icon name="fa-cube" style={{ color:t.success, fontSize:20, marginBottom:8 }} />
                  <div style={{ fontSize:11, color:t.textMuted }}>ONU Management</div>
                </div>
                <div style={{ padding:12, background:t.bg, borderRadius:8 }}>
                  <Icon name="fa-signal" style={{ color:t.warning, fontSize:20, marginBottom:8 }} />
                  <div style={{ fontSize:11, color:t.textMuted }}>Signal Diagnostics</div>
                </div>
              </div>
            </Card>
          </div>
        ) : (
          <div>
            {activeTab === 'overview' && <OverviewTab deviceId={selectedDeviceId} />}
            {activeTab === 'pon-ports' && <PonPortsTab deviceId={selectedDeviceId} />}
            {activeTab === 'onus' && <OnusTab deviceId={selectedDeviceId} showToast={showToast} />}
            {activeTab === 'register' && <RegistrationTab deviceId={selectedDeviceId} device={selectedDevice} showToast={showToast} />}
            {activeTab === 'mappings' && <MappingsTab deviceId={selectedDeviceId} showToast={showToast} />}
            {activeTab === 'alarms' && <AlarmsTab deviceId={selectedDeviceId} />}
            {activeTab === 'diagnostics' && <DiagnosticsTab deviceId={selectedDeviceId} device={selectedDevice} />}
          </div>
        )}
      </div>

      {/* Status bar */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'6px 24px', background:t.bgCard, borderTop:`1px solid ${t.border}`, flexShrink:0, fontSize:11, color:t.textMuted }}>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <span>
            <Icon name="fa-server" style={{ marginRight:4 }} />
            {devices.length} device(s)
          </span>
          {selectedDevice && (
            <span>
              <span style={{ width:6, height:6, borderRadius:'50%', background:t.success, display:'inline-block', marginRight:4 }} />
              Connected to {selectedDevice.label}
            </span>
          )}
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:16 }}>
          <span>Netfactory OLT Manager v1.0</span>
          <span>API: {API}</span>
        </div>
      </div>

      {/* Device management modal */}
      {showDeviceModal && (
        <DeviceManagerModal onClose={() => setShowDeviceModal(false)} onDeviceChange={loadDevices} showToast={showToast} />
      )}

      {/* Toast */}
      {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
    </div>
  );
};


// ── Mount ────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<OLTApp />);
</script>

<!-- Boot script: Babel transpile with localStorage caching -->
<script>
(function() {
  var CACHE_KEY = 'j2olt_compiled_v1';
  var src = document.getElementById('jsx-source').textContent;
  function fastHash(s) { for(var h=5381,i=0;i<s.length;i++) h=((h<<5)+h)^s.charCodeAt(i); return (h>>>0).toString(36); }
  var hash = fastHash(src);
  try { var cached = localStorage.getItem(CACHE_KEY); if(cached) { var sep=cached.indexOf('|'); if(sep>0&&cached.substring(0,sep)===hash) { var s=document.createElement('script'); s.textContent=cached.substring(sep+1); document.body.appendChild(s); console.log('[OLT] Loaded from cache (' + hash + ')'); return; } } } catch(e){}
  console.log('[OLT] Cache miss — loading Babel...');
  var babel = document.createElement('script');
  babel.src = 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js';
  babel.onload = function() { try { var t0 = performance.now(); var result = Babel.transform(src, {presets:['react']}).code; console.log('[OLT] Transpiled in ' + Math.round(performance.now() - t0) + 'ms'); try{localStorage.setItem(CACHE_KEY, hash+'|'+result);}catch(e){console.warn('[OLT] Cache write failed:', e);} var s=document.createElement('script'); s.textContent=result; document.body.appendChild(s); }catch(e){console.error('[OLT] Transpile error:',e);} };
  document.head.appendChild(babel);
})();
</script>
</body>
