<!DOCTYPE html>
<html lang="en">
<head>
<script>
// ── Secure Fetch Interceptor ─────────────────────────────
(function(){
  const _fetch = window.fetch;
  window.fetch = function(url, opts) {
    opts = opts || {};
    const urlStr = typeof url === 'string' ? url : (url.url || '');
    if (urlStr.startsWith('/api') || urlStr.includes('/api/')) {
      opts.credentials = 'include';
      const method = (opts.method || 'GET').toUpperCase();
      if (['POST','PUT','DELETE','PATCH'].includes(method)) {
        opts.headers = opts.headers || {};
        if (!opts.headers['X-CSRF-Token'] && !opts.headers['x-csrf-token']) {
          const m = document.cookie.match(/j2_csrf=([^;]+)/);
          if (m) opts.headers['X-CSRF-Token'] = m[1];
        }
      }
    }
    return _fetch.call(this, url, opts);
  };
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIUS Status — Netfactory CRM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233b82f6'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='14' font-weight='800' font-family='sans-serif'>NF</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c1222; --bg-card: #131c31; --bg-alt: #1a2540; --bg-hover: #1e2d4a;
    --border: #1e2d4a; --border-light: #253552;
    --text: #e8ecf4; --text-sec: #8896b0; --text-muted: #5a6a84;
    --accent: #3b82f6; --accent-glow: rgba(59,130,246,0.15);
    --green: #22c55e; --green-bg: rgba(34,197,94,0.12);
    --yellow: #f59e0b; --yellow-bg: rgba(245,158,11,0.12);
    --red: #ef4444; --red-bg: rgba(239,68,68,0.12);
    --purple: #a855f7; --purple-bg: rgba(168,85,247,0.12);
    --cyan: #06b6d4; --cyan-bg: rgba(6,182,212,0.12);
    --orange: #f97316; --orange-bg: rgba(249,115,22,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 28px; background:var(--bg-card);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; backdrop-filter:blur(20px); }
  .topbar-left { display:flex; align-items:center; gap:14px; }
  .logo { width:36px; height:36px; border-radius:9px; background:linear-gradient(135deg,#a78bfa,#7c3aed);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; font-family:'JetBrains Mono',monospace; }
  .topbar h1 { font-size:17px; font-weight:700; color:var(--text); }
  .topbar h1 span { color:var(--text-muted); font-weight:400; font-size:14px; margin-left:8px; }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .btn-back { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:var(--bg-alt);
    color:var(--text-sec); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .2s; text-decoration:none; display:flex; align-items:center; gap:6px; }
  .btn-back:hover { background:var(--bg-hover); color:var(--text); border-color:var(--accent); }
  .btn-refresh { padding:8px 16px; border-radius:8px; border:none; background:linear-gradient(135deg,#a78bfa,#7c3aed);
    color:#fff; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .2s; display:flex; align-items:center; gap:6px; }
  .btn-refresh:hover { background:linear-gradient(135deg,#8b5cf6,#6d28d9); }
  .btn-refresh.loading { opacity:.6; pointer-events:none; }
  .live-dot { width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; display:inline-block; }
  @keyframes pulse { 0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(34,197,94,.4); } 50% { opacity:.7; box-shadow:0 0 0 6px rgba(34,197,94,0); } }
  .main { max-width:1360px; margin:0 auto; padding:24px; }
  .status-banner { display:flex; align-items:center; gap:12px; padding:14px 20px; border-radius:12px;
    margin-bottom:24px; font-size:14px; font-weight:500; }
  .status-banner.ok { background:var(--green-bg); border:1px solid rgba(34,197,94,.2); color:var(--green); }
  .status-banner.warn { background:var(--yellow-bg); border:1px solid rgba(245,158,11,.2); color:var(--yellow); }
  .status-banner.err { background:var(--red-bg); border:1px solid rgba(239,68,68,.2); color:var(--red); }
  .status-banner .ts { margin-left:auto; color:var(--text-muted); font-size:12px; font-family:'JetBrains Mono',monospace; }
  .section-title { font-size:13px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:1.5px;
    margin:28px 0 14px; display:flex; align-items:center; gap:10px; }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }
  .grid { display:grid; gap:16px; }
  .grid-4 { grid-template-columns:repeat(4,1fr); }
  .grid-3 { grid-template-columns:repeat(3,1fr); }
  .grid-2 { grid-template-columns:repeat(2,1fr); }
  @media(max-width:1100px) { .grid-4 { grid-template-columns:repeat(2,1fr); } }
  @media(max-width:768px) { .grid-4,.grid-3,.grid-2 { grid-template-columns:1fr; } }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:20px;
    transition:all .3s; position:relative; overflow:hidden; }
  .card:hover { border-color:var(--border-light); transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,.3); }
  .card-icon { width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    font-size:20px; margin-bottom:14px; }
  .card-label { font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px; }
  .card-value { font-size:28px; font-weight:700; font-family:'JetBrains Mono','DM Sans',monospace; color:var(--text); line-height:1.2; }
  .card-value.sm { font-size:20px; }
  .card-sub { font-size:12px; color:var(--text-sec); margin-top:6px; line-height:1.5; }
  .card-sub code { font-family:'JetBrains Mono',monospace; font-size:11px; background:var(--bg-alt); padding:2px 6px; border-radius:4px; }
  .prog-wrap { margin-top:12px; }
  .prog-bar { height:6px; border-radius:3px; background:var(--bg-alt); overflow:hidden; }
  .prog-fill { height:100%; border-radius:3px; transition:width 1s ease; }
  .prog-labels { display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--text-muted);
    font-family:'JetBrains Mono',monospace; }
  .table-wrap { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th { padding:12px 16px; text-align:left; font-size:11px; font-weight:700; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:.8px; background:var(--bg-alt); border-bottom:1px solid var(--border); }
  td { padding:12px 16px; font-size:13px; color:var(--text-sec); border-bottom:1px solid var(--border); }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:var(--bg-hover); }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:6px; font-size:11px; font-weight:600; }
  .badge-green { background:var(--green-bg); color:var(--green); }
  .badge-yellow { background:var(--yellow-bg); color:var(--yellow); }
  .badge-red { background:var(--red-bg); color:var(--red); }
  .badge-purple { background:var(--purple-bg); color:var(--purple); }
  .card, .table-wrap { opacity:0; animation:fadeUp .5s ease forwards; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .skeleton { background:linear-gradient(90deg,var(--bg-alt) 25%,var(--bg-hover) 50%,var(--bg-alt) 75%);
    background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px; }
  @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
  .skel-card { height:140px; }
  .refresh-timer { font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">📶</div>
    <h1>RADIUS Status <span>RADIUS + PostgreSQL Health Monitor</span></h1>
  </div>
  <div class="topbar-right">
    <span class="refresh-timer" id="timer"></span>
    <a href="/crm/index.html" class="btn-back">← Back to CRM</a>
    <button class="btn-refresh" id="refreshBtn" onclick="loadData()">
      <span class="live-dot"></span> Refresh
    </button>
  </div>
</div>

<div class="main" id="app">
  <div class="status-banner ok" id="banner">
    <span>⏳</span> Connecting to local RADIUS server...
  </div>
  <div class="grid grid-4" id="skeleton">
    <div class="skeleton skel-card"></div><div class="skeleton skel-card"></div>
    <div class="skeleton skel-card"></div><div class="skeleton skel-card"></div>
  </div>
  <div id="content" style="display:none"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let data = null;
let countdown = 30;
let timerInterval = null;

function fmt(bytes) {
  if (!bytes || bytes <= 0) return '0 B';
  const u = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(bytes)/Math.log(1024));
  return (bytes/Math.pow(1024,i)).toFixed(i>1?1:0)+' '+u[i];
}

function fmtMin(min) {
  if (!min || min <= 0) return '0m';
  const d = Math.floor(min/1440), h = Math.floor((min%1440)/60), m = min%60;
  if (d>0) return d+'d '+h+'h '+m+'m';
  if (h>0) return h+'h '+m+'m';
  return m+'m';
}

function progColor(pct) {
  if (pct >= 90) return 'var(--red)';
  if (pct >= 75) return 'var(--yellow)';
  return 'var(--green)';
}

function progressBar(pct, used, total) {
  return `<div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${progColor(pct)}"></div></div>
    <div class="prog-labels"><span>${used}</span><span>${pct}%</span><span>${total}</span></div>
  </div>`;
}

function statusBadge(status) {
  const s = status?.toLowerCase();
  if (s === 'online' || s === 'active') return `<span class="badge badge-green">● ${status}</span>`;
  if (s === 'stopping' || s === 'launching') return `<span class="badge badge-yellow">● ${status}</span>`;
  return `<span class="badge badge-red">● ${status}</span>`;
}

async function loadData() {
  const btn = $('refreshBtn');
  btn.classList.add('loading');
  btn.innerHTML = '<span class="live-dot"></span> Loading...';

  try {
    const token = localStorage.getItem('j2_admin_token') || '';
    const resp = await fetch('/api/admin/radius-status/status', {
      headers: token ? { 'Authorization': 'Bearer ' + token } : {}
    });
    if (!resp.ok) throw new Error('API returned ' + resp.status);
    data = await resp.json();

    if (!data.connected) throw new Error(data.error || 'RADIUS status unavailable');
    render();
    countdown = 30;
  } catch (err) {
    $('banner').className = 'status-banner err';
    $('banner').innerHTML = `<span>❌</span> ${err.message} <span class="ts">${new Date().toLocaleTimeString()}</span>`;
  } finally {
    btn.classList.remove('loading');
    btn.innerHTML = '<span class="live-dot"></span> Refresh';
  }
}

function render() {
  if (!data) return;
  const d = data;
  const s = d.services || {};
  const r = d.radius || {};

  const allOk = s.freeradius?.status === 'active' && s.mariadb?.status === 'active' && d.disk?.usePct < 90;
  $('banner').className = 'status-banner ' + (allOk ? 'ok' : 'warn');
  $('banner').innerHTML = `<span>${allOk ? '✅' : '⚠️'}</span> ${allOk ? 'RADIUS server operational — ' + (r.activeSessions || 0) + ' active sessions' : 'Attention needed — check details below'}
    <span class="ts">Updated: ${new Date(d.timestamp).toLocaleTimeString()}</span>`;

  $('skeleton').style.display = 'none';
  $('content').style.display = 'block';

  let delay = 0;
  const ad = () => `animation-delay:${(delay += 60)}ms`;

  $('content').innerHTML = `
    <!-- === RADIUS SERVICES === -->
    <div class="section-title">Services & Server</div>
    <div class="grid grid-4">
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:var(--purple-bg);color:var(--purple)">📶</div>
        <div class="card-label">RADIUS</div>
        <div class="card-value sm">${s.freeradius?.status === 'active' ? 'Running' : s.freeradius?.status || 'Unknown'}</div>
        <div class="card-sub">${s.freeradius?.version || 'N/A'}<br>${statusBadge(s.freeradius?.status)}</div>
      </div>
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:var(--cyan-bg);color:var(--cyan)">🗄️</div>
        <div class="card-label">PostgreSQL</div>
        <div class="card-value sm">${s.mariadb?.status === 'active' ? 'Running' : s.mariadb?.status || 'Unknown'}</div>
        <div class="card-sub">v${s.mariadb?.version || 'N/A'}<br>${s.mariadb?.connections || 0}/${s.mariadb?.maxConnections || 0} connections</div>
      </div>
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:var(--accent-glow);color:var(--accent)">🖥️</div>
        <div class="card-label">Hostname</div>
        <div class="card-value sm">${d.system?.hostname || '-'}</div>
        <div class="card-sub">${d.system?.os || ''}<br><code>${d.system?.kernel || ''}</code></div>
      </div>
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:var(--green-bg);color:var(--green)">⏱️</div>
        <div class="card-label">Uptime</div>
        <div class="card-value">${d.system?.uptime?.formatted || '-'}</div>
        <div class="card-sub">IP: <code>${d.network?.[0]?.ipv4 || '127.0.0.1'}</code></div>
      </div>

      <!-- Resource cards -->
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:${d.cpu?.usage > 80 ? 'var(--red-bg)' : 'var(--accent-glow)'};color:${d.cpu?.usage > 80 ? 'var(--red)' : 'var(--accent)'}">⚡</div>
        <div class="card-label">CPU Usage</div>
        <div class="card-value">${d.cpu?.usage?.toFixed(1) || 0}%</div>
        <div class="card-sub">${d.cpu?.model || 'Unknown'}<br>${d.cpu?.cores || 0} cores</div>
        ${progressBar(Math.round(d.cpu?.usage || 0), 
          `Load: ${d.cpu?.loadAvg?.['1m']?.toFixed(2) || 0}`, 
          `${d.cpu?.cores || 0} cores`)}
      </div>
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:${d.memory?.usePct > 85 ? 'var(--red-bg)' : 'var(--green-bg)'};color:${d.memory?.usePct > 85 ? 'var(--red)' : 'var(--green)'}">🧠</div>
        <div class="card-label">Memory</div>
        <div class="card-value">${d.memory?.usePct || 0}%</div>
        <div class="card-sub">Used: ${fmt(d.memory?.used)} / ${fmt(d.memory?.total)}<br>Available: ${fmt(d.memory?.available)}</div>
        ${progressBar(d.memory?.usePct || 0, fmt(d.memory?.used), fmt(d.memory?.total))}
      </div>
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:${d.disk?.usePct > 85 ? 'var(--red-bg)' : 'var(--orange-bg)'};color:${d.disk?.usePct > 85 ? 'var(--red)' : 'var(--orange)'}">💾</div>
        <div class="card-label">Disk</div>
        <div class="card-value">${d.disk?.usePct || 0}%</div>
        <div class="card-sub">Used: ${fmt(d.disk?.used)} / ${fmt(d.disk?.total)}<br>Available: ${fmt(d.disk?.available)}</div>
        ${progressBar(d.disk?.usePct || 0, fmt(d.disk?.used), fmt(d.disk?.total))}
      </div>
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:var(--purple-bg);color:var(--purple)">💿</div>
        <div class="card-label">RADIUS Database</div>
        <div class="card-value sm">${r.dbSizeMB || 0} MB</div>
        <div class="card-sub">${(r.radacctRows || 0).toLocaleString()} acct records<br>${(r.postauthRows || 0).toLocaleString()} auth log entries</div>
      </div>
    </div>

    <!-- === RADIUS METRICS === -->
    <div class="section-title">RADIUS Metrics</div>
    <div class="grid grid-4">
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:var(--green-bg);color:var(--green)">📡</div>
        <div class="card-label">Active Sessions</div>
        <div class="card-value">${(r.activeSessions || 0).toLocaleString()}</div>
        <div class="card-sub">${(r.sessionsToday || 0).toLocaleString()} sessions today</div>
      </div>
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:var(--accent-glow);color:var(--accent)">👤</div>
        <div class="card-label">Registered Users</div>
        <div class="card-value">${(r.totalUsers || 0).toLocaleString()}</div>
        <div class="card-sub">In radcheck table</div>
      </div>
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:var(--green-bg);color:var(--green)">✅</div>
        <div class="card-label">Auth Accepts (24h)</div>
        <div class="card-value">${(r.authAccepts24h || 0).toLocaleString()}</div>
        <div class="card-sub">${r.authAccepts24h + r.authRejects24h > 0 ? Math.round((r.authAccepts24h / (r.authAccepts24h + r.authRejects24h)) * 100) : 0}% success rate</div>
      </div>
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:${(r.authRejects24h || 0) > 10 ? 'var(--red-bg)' : 'var(--yellow-bg)'};color:${(r.authRejects24h || 0) > 10 ? 'var(--red)' : 'var(--yellow)'}">❌</div>
        <div class="card-label">Auth Rejects (24h)</div>
        <div class="card-value">${(r.authRejects24h || 0).toLocaleString()}</div>
        <div class="card-sub">${(r.authRejects24h || 0) > 10 ? '⚠️ Check for issues' : 'Normal range'}</div>
      </div>
    </div>

    <!-- === BANDWIDTH === -->
    <div class="section-title">Bandwidth Today</div>
    <div class="grid grid-2">
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:var(--cyan-bg);color:var(--cyan)">⬇️</div>
        <div class="card-label">Download (Input Octets)</div>
        <div class="card-value">${fmt(r.bandwidthInToday || 0)}</div>
        <div class="card-sub">Total inbound traffic today</div>
      </div>
      <div class="card" style="${ad()}">
        <div class="card-icon" style="background:var(--orange-bg);color:var(--orange)">⬆️</div>
        <div class="card-label">Upload (Output Octets)</div>
        <div class="card-value">${fmt(r.bandwidthOutToday || 0)}</div>
        <div class="card-sub">Total outbound traffic today</div>
      </div>
    </div>

    <!-- === NAS DEVICES === -->
    <div class="section-title">NAS Devices (${r.nasDevices || 0} registered)</div>
    <div class="table-wrap" style="${ad()}">
      <table>
        <thead><tr><th>NAS IP</th><th>Short Name</th><th>Type</th><th>Description</th></tr></thead>
        <tbody>
          ${r.nasList?.length ? r.nasList.map(n => `<tr>
            <td style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text)">${n.nasname}</td>
            <td style="font-weight:600;color:var(--text)">${n.shortname || '-'}</td>
            <td><span class="badge badge-purple">${n.type || 'other'}</span></td>
            <td>${n.description || '-'}</td>
          </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:20px">No NAS devices registered</td></tr>'}
        </tbody>
      </table>
    </div>

    <!-- === ACTIVE SESSIONS === -->
    ${r.topSessions?.length ? `
    <div class="section-title">Active Sessions (Top 10 by Duration)</div>
    <div class="table-wrap" style="${ad()}">
      <table>
        <thead><tr><th>Username</th><th>NAS IP</th><th>Framed IP</th><th>Duration</th><th>Started</th></tr></thead>
        <tbody>
          ${r.topSessions.map(s => `<tr>
            <td style="font-weight:600;color:var(--text)">${s.username}</td>
            <td style="font-family:'JetBrains Mono',monospace;font-size:12px">${s.nasipaddress || '-'}</td>
            <td style="font-family:'JetBrains Mono',monospace;font-size:12px">${s.framedipaddress || '-'}</td>
            <td style="font-family:'JetBrains Mono',monospace;font-size:12px;${s.duration_min > 1440 ? 'color:var(--yellow)' : ''}">${fmtMin(s.duration_min)}</td>
            <td style="font-size:12px;color:var(--text-muted)">${s.acctstarttime ? new Date(s.acctstarttime).toLocaleString() : '-'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>` : ''}

    <!-- === LOAD AVERAGES === -->
    <div class="section-title">Load Averages</div>
    <div class="grid grid-3">
      ${['1m','5m','15m'].map((period, i) => {
        const val = d.cpu?.loadAvg?.[period] || 0;
        const cores = d.cpu?.cores || 1;
        const pct = Math.min(Math.round((val/cores)*100), 100);
        const colors = [
          {bg:'var(--purple-bg)',fg:'var(--purple)'},
          {bg:'var(--cyan-bg)',fg:'var(--cyan)'},
          {bg:'var(--accent-glow)',fg:'var(--accent)'}
        ];
        return `<div class="card" style="${ad()}">
          <div class="card-icon" style="background:${colors[i].bg};color:${colors[i].fg}">📊</div>
          <div class="card-label">Load ${period}</div>
          <div class="card-value">${val.toFixed(2)}</div>
          ${progressBar(pct, val.toFixed(2), cores + ' cores')}
        </div>`;
      }).join('')}
    </div>
  `;
}

// Auto-refresh timer
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  countdown = 30;
  timerInterval = setInterval(() => {
    countdown--;
    $('timer').textContent = `Auto-refresh: ${countdown}s`;
    if (countdown <= 0) { loadData(); countdown = 30; }
  }, 1000);
}

loadData().then(startTimer);
</script>
</body>
