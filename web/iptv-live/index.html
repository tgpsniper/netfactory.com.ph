<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Netfactory — IPTV Live (Admin)</title>
<script src="hls.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#0a0e1a;--panel:#111726;--panel2:#0d1320;--border:#1e293b;--text:#e2e8f0;--muted:#64748b;--accent:#6366f1;--accent2:#8b5cf6;}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;}
  .app{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;}
  .brand h1{font-size:16px;font-weight:800;}
  .brand p{font-size:11px;color:var(--muted);}
  .hdr-right{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);}
  .btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn:hover{border-color:var(--accent);}
  .modes{display:flex;gap:6px;background:var(--panel2);padding:4px;border-radius:10px;border:1px solid var(--border);}
  .mode-btn{background:transparent;border:none;color:var(--muted);padding:7px 16px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .mode-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
  .main{display:flex;flex:1;min-height:0;}
  .sidebar{width:320px;flex-shrink:0;background:var(--panel2);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .search{padding:12px;border-bottom:1px solid var(--border);}
  .search input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;outline:none;}
  .cats{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--border);}
  .cat{font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--muted);cursor:pointer;}
  .cat.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .channels{flex:1;overflow-y:auto;padding:6px;}
  .ch{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;}
  .ch:hover{background:var(--panel);}
  .ch.active{background:rgba(99,102,241,.16);}
  .ch img{width:42px;height:30px;object-fit:contain;border-radius:5px;background:#000;flex-shrink:0;}
  .ch .ico-fallback{width:42px;height:30px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);flex-shrink:0;}
  .ch.dead{opacity:.45;}
  .ch .tag-dead{font-size:9px;font-weight:700;color:#f87171;border:1px solid rgba(248,113,113,.4);border-radius:4px;padding:1px 5px;margin-left:auto;flex-shrink:0;}
  .ch-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ch-cat{font-size:10px;color:var(--muted);}
  .stage{flex:1;display:flex;flex-direction:column;min-width:0;background:#000;}
  .video-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000;min-height:0;}
  video{width:100%;height:100%;background:#000;}
  .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:20px;}
  .placeholder .big{font-size:48px;opacity:.4;}
  .nowbar{padding:12px 20px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .nowbar .title{font-size:15px;font-weight:800;}
  .nowbar .sub{font-size:12px;color:var(--muted);}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#22c55e;}
  .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .err{color:#f87171;font-size:13px;}
  /* login overlay */
  .overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;}
  .login{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;width:340px;}
  .login h2{font-size:18px;font-weight:800;margin-bottom:4px;}
  .login p{font-size:12px;color:var(--muted);margin-bottom:20px;}
  .login label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:5px;margin-top:14px;}
  .login input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;outline:none;}
  .login button{width:100%;margin-top:20px;padding:11px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .login .msg{color:#f87171;font-size:12px;margin-top:12px;min-height:16px;text-align:center;}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;background:var(--bg);z-index:90;}
  @media(max-width:760px){.sidebar{width:100%;position:absolute;inset:0;z-index:50;}.sidebar.hidden{display:none;}}
</style>
</head>
<body>
<div class="loading" id="loading">Loading…</div>

<div class="overlay" id="loginOverlay" style="display:none;">
  <div class="login">
    <h2>IPTV Live</h2>
    <p>Admin sign-in required</p>
    <label>Username</label>
    <input id="liUser" autocomplete="username" />
    <label>Password</label>
    <input id="liPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" />
    <button onclick="doLogin()" id="liBtn">Sign In</button>
    <div class="msg" id="liMsg"></div>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <header>
    <div class="brand">
      <div class="logo">NF</div>
      <div><h1>IPTV Live</h1><p>Admin channel preview</p></div>
    </div>
    <div class="modes">
      <button id="modeLive" class="mode-btn active" onclick="switchMode('live')">📡 Live TV</button>
      <button id="modeMovies" class="mode-btn" onclick="switchMode('movies')">🎬 Movies</button>
      <button id="modeSeries" class="mode-btn" onclick="switchMode('series')">📺 Series</button>
    </div>
    <div class="hdr-right">
      <span id="chCount"></span>
      <button class="btn" onclick="logout()">Sign out</button>
    </div>
  </header>
  <div class="main">
    <div class="sidebar" id="sidebar">
      <div class="search"><input id="search" placeholder="Search channels…" oninput="renderChannels()" /></div>
      <div class="cats" id="cats"></div>
      <div class="channels" id="channels"></div>
    </div>
    <div class="stage">
      <div class="video-wrap">
        <video id="video" controls autoplay playsinline></video>
        <div class="placeholder" id="placeholder"><div class="big">📺</div><div>Select a channel to start watching</div></div>
      </div>
      <div class="nowbar">
        <div>
          <div class="title" id="nowTitle">—</div>
          <div class="sub" id="nowSub">No channel selected</div>
        </div>
        <div class="badge" id="liveBadge" style="display:none;"><span class="dot"></span> LIVE</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "/api";
let token = localStorage.getItem("j2_admin_token") || "";
let channels = [], categories = [], activeCat = "all", playback = null, hls = null, currentId = null;
let mode = "live", movies = [], movieCats = [], moviesLoaded = false;
let series = [], seriesCats = [], seriesLoaded = false;
let seriesView = "list", selectedSeries = null, seriesInfo = null;
let deadMedia = new Set(); // keys "movie:ID" / "series:ID" with no source file (0-byte on server)

function authHeaders(){ return { "Authorization": "Bearer " + token }; }

async function init(){
  if(!token){ showLogin(); return; }
  try{
    const me = await fetch(API+"/admin/me",{headers:authHeaders()});
    if(!me.ok) throw new Error("auth");
    await loadData();
  }catch(e){ showLogin(); }
}

function showLogin(){
  document.getElementById("loading").style.display="none";
  document.getElementById("app").style.display="none";
  document.getElementById("loginOverlay").style.display="flex";
  document.getElementById("liUser").focus();
}

async function doLogin(){
  const u = document.getElementById("liUser").value.trim();
  const p = document.getElementById("liPass").value;
  const msg = document.getElementById("liMsg"), btn = document.getElementById("liBtn");
  msg.textContent=""; btn.disabled=true; btn.textContent="Signing in…";
  try{
    const r = await fetch(API+"/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    const d = await r.json();
    if(!r.ok || !d.token){ throw new Error(d.error || "Invalid credentials"); }
    token = d.token; localStorage.setItem("j2_admin_token", token);
    document.getElementById("loginOverlay").style.display="none";
    document.getElementById("loading").style.display="flex";
    await loadData();
  }catch(e){ msg.textContent = e.message || "Login failed"; }
  btn.disabled=false; btn.textContent="Sign In";
}

function logout(){ localStorage.removeItem("j2_admin_token"); token=""; if(hls){hls.destroy();hls=null;} location.reload(); }

async function loadData(){
  try{
    const [liveR, pbR] = await Promise.all([
      fetch(API+"/admin/xconnect/streams/live",{headers:authHeaders()}),
      fetch(API+"/admin/xconnect/streams/playback",{headers:authHeaders()}),
    ]);
    if(liveR.status===401 || pbR.status===401){ logout(); return; }
    if(!liveR.ok) throw new Error("Failed to load channels");
    const live = await liveR.json();
    playback = await pbR.json();
    channels = live.channels || [];
    categories = live.categories || [];
    document.getElementById("loading").style.display="none";
    document.getElementById("app").style.display="flex";
    switchMode("live");
  }catch(e){
    document.getElementById("loading").textContent = e.message || "Failed to load";
  }
}

async function switchMode(m){
  mode = m; activeCat = "all"; currentId = null;
  if(m==="series"){ seriesView = "list"; selectedSeries = null; seriesInfo = null; }
  document.getElementById("search").value = "";
  ["live","movies","series"].forEach(x=>document.getElementById("mode"+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle("active", m===x));
  document.getElementById("search").placeholder = m==="live" ? "Search channels…" : m==="movies" ? "Search movies…" : "Search series…";
  const el = document.getElementById("channels");
  if(m==="movies" && !moviesLoaded){
    el.innerHTML = '<div style="padding:20px;color:var(--muted);font-size:13px;text-align:center;">Loading movies…</div>';
    try{
      const r = await fetch(API+"/admin/xconnect/streams/vod",{headers:authHeaders()});
      if(r.status===401){ logout(); return; }
      const d = await r.json();
      movies = d.movies||[]; movieCats = d.categories||[]; moviesLoaded = true;
    }catch(e){ el.innerHTML = '<div style="padding:20px;" class="err">Failed to load movies</div>'; return; }
  }
  if(m==="series" && !seriesLoaded){
    el.innerHTML = '<div style="padding:20px;color:var(--muted);font-size:13px;text-align:center;">Loading series…</div>';
    try{
      const r = await fetch(API+"/admin/xconnect/streams/series",{headers:authHeaders()});
      if(r.status===401){ logout(); return; }
      const d = await r.json();
      series = d.series||[]; seriesCats = d.categories||[]; seriesLoaded = true;
    }catch(e){ el.innerHTML = '<div style="padding:20px;" class="err">Failed to load series</div>'; return; }
  }
  const count = m==="live" ? channels.length+" channels" : m==="movies" ? movies.length+" movies" : series.length+" series";
  document.getElementById("chCount").textContent = count;
  renderCats(); renderCurrent();
}

function curCats(){ return mode==="live" ? categories : mode==="movies" ? movieCats : seriesCats; }
function curItems(){ return mode==="live" ? channels : movies; }
function renderCurrent(){ if(mode==="series") renderSeries(); else renderItems(); }

function renderCats(){
  const el = document.getElementById("cats");
  // Hide category chips while drilled into a series' episodes.
  if(mode==="series" && seriesView==="episodes"){ el.innerHTML=""; return; }
  const all = [{id:"all",name:"All"}].concat(curCats());
  el.innerHTML = all.map(c=>`<div class="cat ${activeCat===c.id?'active':''}" onclick="setCat('${esc(c.id)}')">${esc(c.name)}</div>`).join("");
}
function setCat(id){ activeCat=id; renderCats(); renderCurrent(); }
// kept for the search box's oninput handler
function renderChannels(){ renderCurrent(); }

// ---- Series rendering (list of series  ↔  drilled-in episodes) ----
function renderSeries(){
  const el = document.getElementById("channels");
  if(seriesView==="episodes" && seriesInfo){
    let h = '<div class="ch" onclick="backToSeries()" style="font-weight:700;color:var(--accent);"><div class="ico-fallback">←</div><div class="ch-name">Back to series</div></div>';
    h += '<div style="padding:10px;font-size:14px;font-weight:800;">'+esc(selectedSeries?selectedSeries.name:"")+'</div>';
    seriesInfo.seasons.forEach(se=>{
      h += '<div style="padding:6px 10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;">Season '+esc(se.season)+'</div>';
      se.episodes.forEach(ep=>{
        const dead = deadMedia.has("series:"+ep.id);
        h += '<div class="ch '+(currentId===ep.id?'active':'')+' '+(dead?'dead':'')+'" onclick="playEpisode('+ep.id+',\''+esc(ep.ext)+'\')">'
          + '<div class="ico-fallback">'+esc(String(ep.episodeNum||"•"))+'</div>'
          + '<div style="min-width:0;"><div class="ch-name">'+esc(ep.title||("Episode "+ep.episodeNum))+'</div></div>'
          + (dead?'<span class="tag-dead">UNAVAILABLE</span>':'')
          + '</div>';
      });
    });
    el.innerHTML = h;
    return;
  }
  // series list
  const q = (document.getElementById("search").value||"").toLowerCase();
  const list = series.filter(s => (activeCat==="all"||s.categoryId===activeCat) && (!q||s.name.toLowerCase().includes(q)));
  if(!list.length){ el.innerHTML='<div style="padding:20px;color:var(--muted);font-size:13px;text-align:center;">Nothing here</div>'; return; }
  el.innerHTML = list.map(s=>`
    <div class="ch" onclick="openSeries(${s.id})">
      ${s.icon ? `<img src="${esc(s.icon)}" onerror="this.outerHTML='<div class=\\'ico-fallback\\'>📺</div>'"/>` : `<div class="ico-fallback">📺</div>`}
      <div style="min-width:0;"><div class="ch-name">${esc(s.name)}</div><div class="ch-cat">${esc(s.categoryName||'')}</div></div>
      <span style="color:var(--muted);font-size:12px;flex-shrink:0;">›</span>
    </div>`).join("");
}

async function openSeries(id){
  selectedSeries = series.find(s=>s.id===id); if(!selectedSeries) return;
  seriesView = "episodes"; currentId = null;
  document.getElementById("channels").innerHTML = '<div style="padding:20px;color:var(--muted);font-size:13px;text-align:center;">Loading episodes…</div>';
  try{
    const r = await fetch(API+"/admin/xconnect/streams/series/"+id,{headers:authHeaders()});
    if(r.status===401){ logout(); return; }
    seriesInfo = await r.json();
  }catch(e){ document.getElementById("channels").innerHTML='<div style="padding:20px;" class="err">Failed to load episodes</div>'; return; }
  renderCats(); renderSeries();
}
function backToSeries(){ seriesView="list"; selectedSeries=null; seriesInfo=null; currentId=null; renderCats(); renderSeries(); }

function renderItems(){
  const q = (document.getElementById("search").value||"").toLowerCase();
  const list = curItems().filter(c =>
    (activeCat==="all" || c.categoryId===activeCat) &&
    (!q || c.name.toLowerCase().includes(q))
  );
  const el = document.getElementById("channels");
  if(!list.length){ el.innerHTML = '<div style="padding:20px;color:var(--muted);font-size:13px;text-align:center;">Nothing here</div>'; return; }
  const fb = mode==="live" ? "TV" : "🎬";
  const click = mode==="live" ? "play" : "playMovie";
  el.innerHTML = list.map(c=>{
    const dead = mode==="movies" && deadMedia.has("movie:"+c.id);
    return `
    <div class="ch ${currentId===c.id?'active':''} ${dead?'dead':''}" onclick="${click}(${c.id})">
      ${c.icon ? `<img src="${esc(c.icon)}" onerror="this.outerHTML='<div class=\\'ico-fallback\\'>${fb}</div>'"/>` : `<div class="ico-fallback">${fb}</div>`}
      <div style="min-width:0;"><div class="ch-name">${esc(c.name)}</div><div class="ch-cat">${esc(c.categoryName||'')}</div></div>
      ${dead ? '<span class="tag-dead">UNAVAILABLE</span>' : ''}
    </div>`;
  }).join("");
}

function play(id){
  const ch = channels.find(c=>c.id===id); if(!ch || !playback) return;
  currentId = id; renderChannels();
  document.getElementById("placeholder").style.display="none";
  document.getElementById("nowTitle").textContent = ch.name;
  document.getElementById("nowSub").textContent = ch.categoryName || "";
  document.getElementById("liveBadge").style.display="inline-flex";
  const url = location.origin + "/live/" + encodeURIComponent(playback.username) + "/" + encodeURIComponent(playback.password) + "/" + id + ".m3u8";
  const video = document.getElementById("video");
  if(hls){ hls.destroy(); hls=null; }
  video.onerror = null; video.removeAttribute("src"); video.load();
  if(window.Hls && Hls.isSupported()){
    hls = new Hls({ lowLatencyMode:true, maxBufferLength:20, manifestLoadingTimeOut:15000, fragLoadingTimeOut:20000 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=> video.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR, (evt,data)=>{
      if(data.fatal){
        if(data.type===Hls.ErrorTypes.NETWORK_ERROR){ hls.startLoad(); }
        else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){ hls.recoverMediaError(); }
        else { showStreamError(ch.name); }
      }
    });
  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = url; video.play().catch(()=>{});
    video.onerror = ()=> showStreamError(ch.name);
  } else {
    showStreamError(ch.name, "Your browser cannot play HLS.");
  }
}

function playMovie(id){
  const mv = movies.find(c=>c.id===id); if(!mv) return;
  playVod("movie", id, mv.ext, mv.name, mv.categoryName + (mv.rating ? " · ★ "+mv.rating : ""));
}
function playEpisode(id, ext){
  let title = "Episode";
  if(seriesInfo){ for(const se of seriesInfo.seasons){ const e=se.episodes.find(x=>x.id===id); if(e){ title = e.title || ("Episode "+e.episodeNum); break; } } }
  playVod("series", id, ext, title, selectedSeries ? selectedSeries.name : "");
}

// Shared VOD player (movies + series episodes). Direct-file playback (mp4) with
// a source probe to distinguish a missing/0-byte file from a codec problem.
async function playVod(kind, id, ext, title, sub){
  if(!playback) return;
  currentId = id; renderCurrent();
  document.getElementById("nowTitle").textContent = title;
  document.getElementById("nowSub").textContent = sub || "";
  document.getElementById("liveBadge").style.display="none";
  const x = (ext||"mp4").replace(/^\./,"");
  const path = kind==="series" ? "/series/" : "/movie/";
  const url = location.origin + path + encodeURIComponent(playback.username) + "/" + encodeURIComponent(playback.password) + "/" + id + "." + x;
  const video = document.getElementById("video");
  if(hls){ hls.destroy(); hls=null; }
  video.onerror = null; video.removeAttribute("src"); video.load();

  // One tiny range probe to tell "missing source file" apart from a real codec problem.
  showPlaceholder('<div class="big">⏳</div><div>Checking source…</div>');
  let avail = true;
  try{
    const r = await fetch(url, { headers: { "Range": "bytes=0-1" } });
    const cr = r.headers.get("content-range");
    const cl = parseInt(r.headers.get("content-length")||"0", 10);
    avail = (r.status===206 && !!cr) || (r.status===200 && cl>100000);
  }catch(e){ avail = true; /* network hiccup — let playback try anyway */ }

  if(!avail){
    deadMedia.add(kind+":"+id); renderCurrent();
    showStreamError(title, "The source file is unavailable on the server (0&nbsp;bytes). This title needs to be re-uploaded / re-added on the IPTV panel — it's not a player problem.");
    return;
  }

  document.getElementById("placeholder").style.display="none";
  video.src = url;
  video.play().catch(()=>{});
  video.onerror = ()=> showStreamError(title, "This title could not be played — the video format/codec may be unsupported by the browser.");
}

function showPlaceholder(html){
  const ph = document.getElementById("placeholder");
  ph.style.display="flex";
  ph.innerHTML = html;
}

function showStreamError(name, extra){
  const ph = document.getElementById("placeholder");
  ph.style.display="flex";
  ph.innerHTML = '<div class="big">⚠️</div><div class="err">Could not play “'+esc(name)+'”.<br>'+(extra||'The channel may be offline or at its connection limit.')+'</div>';
  document.getElementById("liveBadge").style.display="none";
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

init();
</script>
</body>
</html>
