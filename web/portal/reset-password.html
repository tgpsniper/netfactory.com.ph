<!DOCTYPE html>
<html lang="en">
<head>
<script>
// ── Secure Fetch Interceptor ─────────────────────────────
(function(){
  const _fetch = window.fetch;
  window.fetch = function(url, opts) {
    opts = opts || {};
    const urlStr = typeof url === 'string' ? url : (url.url || '');
    if (urlStr.startsWith('/api') || urlStr.includes('/api/')) {
      opts.credentials = 'include';
      const method = (opts.method || 'GET').toUpperCase();
      if (['POST','PUT','DELETE','PATCH'].includes(method)) {
        opts.headers = opts.headers || {};
        if (!opts.headers['X-CSRF-Token'] && !opts.headers['x-csrf-token']) {
          const m = document.cookie.match(/j2_csrf=([^;]+)/);
          if (m) opts.headers['X-CSRF-Token'] = m[1];
        }
      }
    }
    return _fetch.call(this, url, opts);
  };
})();
</script>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Reset Password — Netfactory</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;padding:20px;}
    .card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border-radius:24px;border:1px solid rgba(255,255,255,.1);padding:36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
    .logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;margin-bottom:16px;box-shadow:0 8px 32px rgba(37,99,235,.3);}
    h2{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px;}
    p{color:rgba(255,255,255,.4);font-size:13px;margin-bottom:24px;}
    label{font-size:12px;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:8px;display:block;}
    input{width:100%;padding:14px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;font-size:14px;font-family:inherit;outline:none;margin-bottom:18px;}
    input:focus{border-color:rgba(59,130,246,.5);}
    .pw-wrap{position:relative;margin-bottom:18px;}
    .pw-wrap input{margin-bottom:0;}
    .pw-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(255,255,255,.4);font-size:18px;user-select:none;}
    button{width:100%;padding:15px;border-radius:12px;border:none;font-size:15px;font-weight:700;font-family:inherit;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;cursor:pointer;box-shadow:0 4px 20px rgba(37,99,235,.3);transition:opacity .2s;}
    button:disabled{opacity:0.5;cursor:not-allowed;}
    .msg{border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;}
    .success{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;}
    .error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#f87171;}
    .back{color:#3b82f6;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;text-decoration:none;}
    .strength{height:4px;border-radius:2px;margin-top:6px;margin-bottom:6px;transition:all .3s;width:0;}
    .hint{font-size:11px;color:rgba(255,255,255,.3);margin-bottom:18px;}
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align:center;margin-bottom:24px;">
      <div class="logo">NF</div>
      <h2>Set New Password</h2>
      <p>Choose a strong password for your Netfactory account.</p>
    </div>
    <a href="/portal/" class="back">← Back to login</a>
    <div id="msg"></div>
    <div id="form">
      <label>New Password</label>
      <div class="pw-wrap">
        <input type="password" id="pw1" placeholder="Enter new password" oninput="checkStrength()"/>
        <span class="pw-eye" onclick="togglePw('pw1',this)">👁️</span>
      </div>
      <div class="strength" id="strengthBar"></div>
      <div class="hint" id="strengthHint"></div>
      <label>Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" id="pw2" placeholder="Confirm new password"/>
        <span class="pw-eye" onclick="togglePw('pw2',this)">👁️</span>
      </div>
      <button onclick="doReset()" id="btn">Reset Password</button>
    </div>
  </div>
  <script>
    const API='/api';
    const token=new URLSearchParams(location.search).get('token');
    if(!token){showMsg('Invalid or missing reset token. Please request a new password reset.','error');document.getElementById('form').style.display='none';}
    function togglePw(id,el){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';el.textContent=i.type==='password'?'👁️':'🙈';}
    function checkStrength(){
      const pw=document.getElementById('pw1').value;
      const bar=document.getElementById('strengthBar');
      const hint=document.getElementById('strengthHint');
      let score=0;
      if(pw.length>=8)score++;if(/[A-Z]/.test(pw))score++;if(/[0-9]/.test(pw))score++;if(/[^A-Za-z0-9]/.test(pw))score++;
      const colors=['#ef4444','#f97316','#eab308','#22c55e'];
      const labels=['Weak','Fair','Good','Strong'];
      bar.style.background=pw?colors[score-1]||'#ef4444':'transparent';
      bar.style.width=pw?(score*25)+'%':'0';
      hint.textContent=pw?labels[score-1]||'Weak':'';
    }
    function showMsg(text,type){document.getElementById('msg').innerHTML='<div class="msg '+type+'">'+text+'</div>';}
    async function doReset(){
      const pw1=document.getElementById('pw1').value;
      const pw2=document.getElementById('pw2').value;
      const btn=document.getElementById('btn');
      if(!pw1||!pw2){showMsg('Please fill in both fields.','error');return;}
      if(pw1.length<8){showMsg('Password must be at least 8 characters.','error');return;}
      if(pw1!==pw2){showMsg('Passwords do not match.','error');return;}
      btn.disabled=true;btn.textContent='Resetting...';
      try{
        const r=await fetch(API+'/portal/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,password:pw1})});
        const d=await r.json();
        if(!r.ok)throw new Error(d.error||'Reset failed. Token may have expired.');
        document.getElementById('form').style.display='none';
        showMsg('Password reset successfully! <a href="/portal/" style="color:#4ade80;font-weight:600;">Click here to log in</a>.','success');
      }catch(e){showMsg(e.message,'error');btn.disabled=false;btn.textContent='Reset Password';}
    }
  </script>
</body>
</html>
