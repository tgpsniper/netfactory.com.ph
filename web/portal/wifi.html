<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  const _fetch = window.fetch;
  window.fetch = function(url, opts){
    opts = opts || {};
    const urlStr = typeof url === 'string' ? url : (url.url || '');
    if (urlStr.startsWith('/api') || urlStr.includes('/api/')) {
      opts.credentials = 'include';
      const method = (opts.method||'GET').toUpperCase();
      if (['POST','PUT','DELETE','PATCH'].includes(method)) {
        opts.headers = opts.headers || {};
        if (!opts.headers['X-CSRF-Token'] && !opts.headers['x-csrf-token']) {
          const m = document.cookie.match(/j2_csrf=([^;]+)/);
          if (m) opts.headers['X-CSRF-Token'] = m[1];
        }
      }
    }
    return _fetch.call(this, url, opts);
  };
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My WiFi — Netfactory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233b82f6'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='14' font-weight='800' font-family='sans-serif'>NF</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
  :root{--accent:#3b82f6;--text:#1e293b;--text-muted:#64748b;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--green:#16a34a;--red:#dc2626;--yellow:#d97706}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
  .wrap{max-width:560px;margin:20px auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.02)}
  .card h1{font-size:20px;margin-bottom:6px}
  .card h2{font-size:14px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
  .muted{color:var(--text-muted);font-size:13px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px;font-size:14px;margin-top:10px}
  .kv dt{color:var(--text-muted)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
  .btn{padding:10px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#2563eb}
  .btn-danger{background:var(--red);color:#fff}
  .btn-danger:hover{background:#b91c1c}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .banner{padding:12px 16px;border-radius:10px;margin-bottom:14px;font-size:14px;display:flex;align-items:center;gap:10px}
  .banner.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
  .banner.err{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
  .banner.warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
  .status{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600}
  .status.online{background:#dcfce7;color:var(--green)}
  .status.offline{background:#fee2e2;color:var(--red)}
  .cooldown{font-size:13px;color:var(--yellow);margin-top:4px}
  a.back{color:var(--accent);text-decoration:none;font-size:14px;margin-bottom:16px;display:inline-block}
  a.back:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="/portal/"><i class="fas fa-arrow-left"></i> Back to dashboard</a>

  <div id="banner" class="banner warn" style="display:none"></div>

  <div class="card" id="device-card">
    <h2><i class="fas fa-wifi"></i> My Router</h2>
    <div class="kv">
      <dt>Status</dt><dd id="d-status">&mdash;</dd>
      <dt>Model</dt><dd id="d-model">&mdash;</dd>
      <dt>Current SSID</dt><dd id="d-ssid">&mdash;</dd>
      <dt>Firmware</dt><dd id="d-fw">&mdash;</dd>
      <dt>Last seen</dt><dd id="d-seen">&mdash;</dd>
    </div>
    <div class="cooldown" id="d-cooldown" style="display:none"></div>
  </div>

  <div class="card" id="form-card">
    <h2><i class="fas fa-pen-to-square"></i> Change WiFi</h2>
    <div class="muted" style="margin-bottom:14px">Changes apply within 1-2 minutes. Your connected devices may briefly disconnect.</div>
    <div class="field">
      <label>New WiFi Name (SSID)</label>
      <input type="text" id="in-ssid" maxlength="32" placeholder="Leave blank to keep current">
    </div>
    <div class="field">
      <label>New WiFi Password</label>
      <input type="password" id="in-pass" minlength="8" maxlength="63" placeholder="8-63 characters">
    </div>
    <button class="btn btn-primary" id="btn-save" onclick="saveWifi()">
      <i class="fas fa-check"></i> Apply change
    </button>
  </div>

  <div class="card">
    <h2><i class="fas fa-power-off"></i> Trouble?</h2>
    <div class="muted" style="margin-bottom:14px">If your internet feels slow or unresponsive, restarting the router often fixes it. Takes about 30 seconds.</div>
    <button class="btn btn-danger" id="btn-reboot" onclick="rebootRouter()">
      <i class="fas fa-rotate-right"></i> Restart my router
    </button>
  </div>
</div>

<script>
const API = '/api/portal/tr069';

function banner(msg, kind){
  const b = document.getElementById('banner');
  if (!msg){ b.style.display='none'; return; }
  b.className = 'banner '+kind;
  b.innerHTML = '<i class="fas fa-'+(kind==='err'?'circle-exclamation':kind==='ok'?'circle-check':'triangle-exclamation')+'"></i> '+msg;
  b.style.display = 'flex';
}

function ago(iso){
  if (!iso) return 'never';
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s<60) return s+' s ago';
  if (s<3600) return Math.floor(s/60)+' m ago';
  if (s<86400) return Math.floor(s/3600)+' h ago';
  return Math.floor(s/86400)+' d ago';
}

async function loadDevice(){
  try {
    const r = await fetch(API+'/device');
    if (r.status === 401){ banner('Please log in again.','err'); setTimeout(()=>location.href='/portal/',1500); return; }
    const j = await r.json();
    if (!r.ok) throw new Error(j.error||r.statusText);
    if (!j.linked){
      banner('Your router is not yet registered for self-service. Please contact support.','warn');
      document.getElementById('form-card').style.display='none';
      document.getElementById('btn-reboot').disabled = true;
      return;
    }
    const d = j.device;
    document.getElementById('d-status').innerHTML = d.online
      ? '<span class="status online"><i class="fas fa-circle" style="font-size:7px"></i> Online</span>'
      : '<span class="status offline"><i class="fas fa-circle" style="font-size:7px"></i> Offline</span>';
    document.getElementById('d-model').textContent = d.product_class || '—';
    document.getElementById('d-ssid').textContent = d.wifi_ssid || '(not reported yet)';
    document.getElementById('d-fw').textContent = d.software_version || '—';
    document.getElementById('d-seen').textContent = ago(d.last_inform);

    const cd = d.cooldown_remaining_sec;
    if (cd > 0){
      document.getElementById('d-cooldown').style.display='block';
      document.getElementById('d-cooldown').innerHTML = '<i class="fas fa-clock"></i> Next change allowed in '+cd+' s';
      document.getElementById('btn-save').disabled = true;
    } else {
      document.getElementById('d-cooldown').style.display='none';
      document.getElementById('btn-save').disabled = false;
    }

    if (!d.online){
      banner('Your router is offline. Changes will be queued and applied when it comes back online.','warn');
    } else {
      banner('','');
    }
  } catch(e){
    banner('Failed to load device: '+e.message,'err');
  }
}

async function saveWifi(){
  const ssid = document.getElementById('in-ssid').value.trim();
  const password = document.getElementById('in-pass').value;
  if (!ssid && !password){ banner('Enter a new SSID or password.','err'); return; }
  if (password && (password.length < 8 || password.length > 63)){ banner('Password must be 8-63 characters.','err'); return; }
  if (!confirm('Apply WiFi change? Connected devices will need to reconnect with the new credentials.')) return;
  const btn = document.getElementById('btn-save'); btn.disabled = true;
  try {
    const r = await fetch(API+'/wifi', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ssid: ssid||undefined, password: password||undefined }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error||r.statusText);
    banner(j.message, 'ok');
    document.getElementById('in-ssid').value='';
    document.getElementById('in-pass').value='';
    loadDevice();
  } catch(e){
    banner('Failed: '+e.message,'err');
    btn.disabled = false;
  }
}

async function rebootRouter(){
  if (!confirm('Restart your router now? You will lose internet for about 30 seconds.')) return;
  const btn = document.getElementById('btn-reboot'); btn.disabled = true;
  try {
    const r = await fetch(API+'/reboot', { method:'POST' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error||r.statusText);
    banner(j.message,'ok');
    setTimeout(()=>{ btn.disabled = false; }, 60000);
  } catch(e){
    banner('Failed: '+e.message,'err');
    btn.disabled = false;
  }
}

loadDevice();
setInterval(loadDevice, 30000);
</script>
</body>
</html>
