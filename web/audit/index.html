<!DOCTYPE html>

<script>
// ── Secure Fetch Interceptor ─────────────────────────────
(function(){
  const _fetch = window.fetch;
  window.fetch = function(url, opts) {
    opts = opts || {};
    const urlStr = typeof url === 'string' ? url : (url.url || '');
    if (urlStr.startsWith('/api') || urlStr.includes('/api/')) {
      opts.credentials = 'include';
      const method = (opts.method || 'GET').toUpperCase();
      if (['POST','PUT','DELETE','PATCH'].includes(method)) {
        opts.headers = opts.headers || {};
        if (!opts.headers['X-CSRF-Token'] && !opts.headers['x-csrf-token']) {
          const m = document.cookie.match(/j2_csrf=([^;]+)/);
          if (m) opts.headers['X-CSRF-Token'] = m[1];
        }
      }
    }
    return _fetch.call(this, url, opts);
  };
})();
// ── Auth Guard ──────────────────────────────────────────────
(function(){
  const t = localStorage.getItem('j2_admin_token');
  if (!t) { window.location.href = '/crm/?redirect=audit'; return; }
  try {
    const p = JSON.parse(atob(t.split('.')[1]));
    if (p.role !== 'superadmin' && p.role !== 'admin') {
      const ap = JSON.parse(localStorage.getItem('j2_allowed_pages') || '[]');
      if (!ap.includes('audit')) { window.location.href = '/crm/'; }
    }
  } catch(e) { window.location.href = '/crm/?redirect=audit'; }
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#0f172a;overflow:hidden;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#94a3b8;}

.app{display:flex;height:100vh;}

/* ── Sidebar ── */
.sidebar{width:250px;background:#0f172a;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-logo{padding:18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo .icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;font-family:'Space Grotesk',sans-serif;flex-shrink:0;}
.sidebar-logo .text h2{font-size:14px;font-weight:700;color:#fff;font-family:'Space Grotesk',sans-serif;}
.sidebar-logo .text span{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.5px;}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;margin-bottom:3px;cursor:pointer;transition:all .2s;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none;}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.8);}
.nav-item.active{background:rgba(16,185,129,.15);color:#10b981;font-weight:600;}
.nav-item .ni{width:20px;text-align:center;font-size:15px;}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);}
.sidebar-footer .user-info{display:flex;align-items:center;gap:10px;}
.sidebar-footer .avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}
.sidebar-footer .name{font-size:12px;font-weight:600;color:#fff;}
.sidebar-footer .role{font-size:10px;color:rgba(255,255,255,.4);}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar h1{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#0f172a;}
.topbar .live{display:flex;align-items:center;gap:6px;font-size:12px;color:#10b981;font-weight:600;}
.topbar .live .dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.content{flex:1;overflow-y:auto;padding:24px 28px;}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:#fff;border-radius:14px;padding:18px 20px;border:1px solid #e2e8f0;transition:all .2s;}
.stat-card:hover{border-color:#10b981;box-shadow:0 4px 12px rgba(16,185,129,.08);}
.stat-label{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.stat-value{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#0f172a;line-height:1;}
.stat-sub{font-size:11px;color:#64748b;margin-top:4px;}

/* ── Filters ── */
.filters-bar{background:#fff;border-radius:14px;padding:16px 20px;border:1px solid #e2e8f0;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.filter-group{display:flex;flex-direction:column;gap:3px;}
.filter-group label{font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px;}
.filter-group select,.filter-group input{height:34px;border:1px solid #e2e8f0;border-radius:8px;padding:0 10px;font-size:12px;font-family:inherit;background:#f8fafc;color:#0f172a;outline:none;transition:border .2s;}
.filter-group select:focus,.filter-group input:focus{border-color:#10b981;background:#fff;}
.filter-group input[type="text"]{width:220px;}
.filter-group input[type="date"]{width:140px;}
.filter-group select{min-width:120px;}
.filter-actions{display:flex;gap:8px;margin-left:auto;align-items:flex-end;}
.btn{height:34px;padding:0 16px;border:none;border-radius:8px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap;}
.btn-primary{background:#10b981;color:#fff;}.btn-primary:hover{background:#059669;}
.btn-secondary{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;}.btn-secondary:hover{background:#e2e8f0;}
.btn-danger{background:#fee2e2;color:#dc2626;}.btn-danger:hover{background:#fecaca;}
.btn-sm{height:28px;padding:0 10px;font-size:11px;}

/* ── Table ── */
.table-wrap{background:#fff;border-radius:14px;border:1px solid #e2e8f0;overflow:hidden;}
.table-header{padding:14px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;}
.table-header h3{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:#0f172a;}
.table-header .count{font-size:12px;color:#94a3b8;font-weight:500;}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;padding:10px 16px;font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px;background:#f8fafc;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:1;}
tbody td{padding:12px 16px;font-size:12.5px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
tbody tr{transition:background .15s;cursor:pointer;}
tbody tr:hover{background:#f8fafc;}
tbody tr:last-child td{border-bottom:none;}
.table-scroll{max-height:calc(100vh - 380px);overflow-y:auto;}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.2px;}
.badge-portal{background:#dbeafe;color:#2563eb;}
.badge-crm{background:#fce7f3;color:#db2777;}
.badge-login{background:#d1fae5;color:#059669;}
.badge-failed{background:#fee2e2;color:#dc2626;}
.badge-create{background:#dbeafe;color:#2563eb;}
.badge-update{background:#fef3c7;color:#d97706;}
.badge-delete{background:#fee2e2;color:#dc2626;}
.badge-payment{background:#d1fae5;color:#059669;}
.badge-initiated{background:#fef3c7;color:#d97706;}
.badge-settings{background:#e0e7ff;color:#4f46e5;}
.badge-password{background:#fce7f3;color:#db2777;}
.badge-ticket{background:#fef3c7;color:#d97706;}

.mono{font-family:'Space Grotesk',monospace;font-size:11px;font-weight:500;}
.text-muted{color:#94a3b8;}
.ip-cell{font-family:'Space Grotesk',monospace;font-size:11px;color:#64748b;}

/* ── Pagination ── */
.pagination{padding:14px 20px;border-top:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;}
.pagination .info{font-size:12px;color:#94a3b8;}
.page-btns{display:flex;gap:4px;}
.page-btn{width:32px;height:32px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#475569;cursor:pointer;transition:all .15s;}
.page-btn:hover{background:#f1f5f9;}
.page-btn.active{background:#10b981;color:#fff;border-color:#10b981;}
.page-btn:disabled{opacity:.4;cursor:default;}

/* ── Detail Panel ── */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}
.detail-overlay.open{opacity:1;pointer-events:auto;}
.detail-panel{position:fixed;top:0;right:0;bottom:0;width:480px;background:#fff;z-index:101;transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.68,0,1);box-shadow:-4px 0 24px rgba(0,0,0,.1);display:flex;flex-direction:column;}
.detail-panel.open{transform:translateX(0);}
.detail-header{padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;}
.detail-header h3{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;}
.detail-close{width:32px;height:32px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .15s;}
.detail-close:hover{background:#fee2e2;border-color:#fecaca;color:#dc2626;}
.detail-body{flex:1;overflow-y:auto;padding:24px;}
.detail-field{margin-bottom:16px;}
.detail-field .label{font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
.detail-field .value{font-size:13px;color:#0f172a;font-weight:500;}
.detail-json{background:#0f172a;border-radius:10px;padding:16px;color:#a5f3fc;font-family:'Space Grotesk',monospace;font-size:12px;line-height:1.8;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}

/* ── Toast ── */
.toast-container{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;color:#fff;animation:slideInRight .3s ease;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:360px;}
.toast-success{background:#059669;}
.toast-error{background:#dc2626;}
.toast-info{background:#2563eb;}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ── Loading ── */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:#94a3b8;font-size:13px;gap:10px;}
.spinner{width:20px;height:20px;border:2px solid #e2e8f0;border-top-color:#10b981;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Empty ── */
.empty{text-align:center;padding:60px 20px;color:#94a3b8;}
.empty .icon{font-size:40px;margin-bottom:12px;}
.empty h3{font-size:15px;font-weight:600;color:#64748b;margin-bottom:4px;}
.empty p{font-size:12px;}

/* ── Responsive ── */
@media(max-width:768px){
  .sidebar{display:none;}
  .filters-bar{flex-direction:column;}
  .filter-group input[type="text"]{width:100%;}
  .detail-panel{width:100%;}
}
</style>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">

      <a class="nav-item" data-page="dashboard"><span class="ni"><i class="fas fa-chart-bar"></i></span> Dashboard</a>

        <div class="avatar" id="avatarInitial">A</div>
        <div>
          <div class="name" id="footerName">Admin</div>
          <div class="role" id="footerRole">CRM User</div>
        </div>
      </div>
    </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h1><i class="fas fa-shield-halved"></i> Audit Trail</h1>
      <div style="display:flex;align-items:center;gap:12px;">

      </div>

      <div class="loading"><div class="spinner"></div> Loading...</div>
    </div>
  </div>
</div>

<!-- Detail Panel -->
<div class="detail-overlay" id="detailOverlay"></div>
<div class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <h3>Log Detail</h3>
    <div class="detail-close" id="detailClose">✕</div>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="/js/audit-ip.js"></script>
<script>
// ── Config ──
const API = '/api';
const TOKEN_KEY = 'j2_admin_token';
const token = localStorage.getItem(TOKEN_KEY);
if (!token) { window.location.href = '/crm/?redirect=audit'; }

let currentPage = 'logs';
let filters = { source: '', action: '', search: '', date_from: '', date_to: '', ip: '', page: 1, limit: 25 };
let stats = {};
let actions = [];
let selectedLog = null;
let autoRefreshId = null;

// ── API Helper ──
async function apiFetch(url, opts = {}) {
  try {
    const res = await fetch(url, {
      ...opts,
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) }
    });
    if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); window.location.href = '/crm/?redirect=audit'; return null; }
    if (res.headers.get('content-type')?.includes('text/csv')) return res;
    return await res.json();
  } catch (e) { console.error('API error:', e); toast('API request failed', 'error'); return null; }
}

// ── Toast ──
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 4000);
}

// ── Sidebar Nav ──
document.getElementById('sidebarNav').addEventListener('click', (e) => {
  const item = e.target.closest('.nav-item[data-page]');
  if (!item) return;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  item.classList.add('active');
  currentPage = item.dataset.page;
  render();
});

// ── Detail Panel ──
document.getElementById('detailOverlay').addEventListener('click', closeDetail);
document.getElementById('detailClose').addEventListener('click', closeDetail);
function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
  selectedLog = null;
}
function openDetail(log) {
  selectedLog = log;
  const body = document.getElementById('detailBody');
  const ts = new Date(log.created_at);
  body.innerHTML = `
    <div class="detail-field"><div class="label">Log ID</div><div class="value mono">#${log.id}</div></div>
    <div class="detail-field"><div class="label">Timestamp</div><div class="value">${ts.toLocaleDateString('en-PH', { weekday:'short', year:'numeric', month:'short', day:'numeric' })} ${ts.toLocaleTimeString('en-PH')}</div></div>
    <div class="detail-field"><div class="label">Source</div><div class="value">${sourceBadge(log.log_source)}</div></div>
    <div class="detail-field"><div class="label">Action</div><div class="value">${actionBadge(log.action)}</div></div>
    <div class="detail-field"><div class="label">User</div><div class="value">${log.username || 'SYSTEM'} ${log.user_id ? '<span class="text-muted">(ID: ' + log.user_id + ')</span>' : ''}</div></div>
    <div class="detail-field"><div class="label">Public IP</div><div class="value mono">${log.public_ip || '—'}</div></div>
    <div class="detail-field"><div class="label">Local IP</div><div class="value mono">${log.local_ip || '—'}</div></div>
    <div class="detail-field"><div class="label">User Agent</div><div class="value" style="font-size:11px;word-break:break-all;">${log.user_agent || '—'}</div></div>
    <div class="detail-field"><div class="label">Details (JSON)</div><div class="detail-json">${JSON.stringify(log.details, null, 2)}</div></div>
  `;
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
}

// ── Badges ──
function sourceBadge(src) {
  return src === 'portal' ? '<span class="badge badge-portal">PORTAL</span>' : '<span class="badge badge-crm">CRM</span>';
}
// PAYMENT_MADE was written when a customer pressed Pay and a checkout was created,
// never when money arrived — the name says the opposite of what the row means, and
// staff chased payments that did not exist because of it. The code now writes
// PAYMENT_INITIATED there and PAYMENT_RECEIVED from the webhook that sees the money.
// The stored rows are left alone: an audit trail is not rewritten after the fact.
// Every PAYMENT_MADE row ever written means "checkout opened", so it is displayed
// that way, in amber rather than the green that reads as cash in hand.
const ACTION_LABELS = {
  'PAYMENT_MADE': 'PAYMENT INITIATED',
};
function actionLabel(action) {
  return ACTION_LABELS[action] || action;
}
function actionBadge(action) {
  const map = {
    'LOGIN': 'badge-login', 'LOGOUT': 'badge-login',
    'LOGIN_FAILED': 'badge-failed',
    'SUBSCRIBER_CREATE': 'badge-create', 'INVOICE_CREATE': 'badge-create', 'TICKET_CREATE': 'badge-create',
    'SUBSCRIBER_UPDATE': 'badge-update', 'TICKET_UPDATE': 'badge-update', 'ACCOUNT_UPDATE': 'badge-update', 'PLAN_CHANGE': 'badge-update',
    'PAYMENT_ACCEPT': 'badge-payment', 'PAYMENT_RECEIVED': 'badge-payment',
    'PAYMENT_INITIATED': 'badge-initiated', 'PAYMENT_MADE': 'badge-initiated',
    'PASSWORD_CHANGE': 'badge-password', 'PASSWORD_RESET': 'badge-password',
    'SETTINGS_CHANGE': 'badge-settings', 'STAFF_MANAGE': 'badge-settings',
  };
  return `<span class="badge ${map[action] || 'badge-default'}">${actionLabel(action)}</span>`;
}

// ── Relative Time ──
function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr)) / 1000;
  if (diff < 60) return Math.floor(diff) + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

// ── Render Router ──
async function render() {
  stopAutoRefresh();
  const el = document.getElementById('pageContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';
  if (currentPage === 'logs') await renderLogs();
  else if (currentPage === 'dashboard') await renderDashboard();
  else if (currentPage === 'timeline') await renderTimeline();
}

// ══════════════════════════════════════════
// LOGS PAGE
// ══════════════════════════════════════════
async function renderLogs() {
  const el = document.getElementById('pageContent');

  // Load actions list for filter dropdown
  if (actions.length === 0) {
    const res = await apiFetch(API + '/audit/actions');
    if (res?.data) actions = res.data;
  }

  const qs = new URLSearchParams();
  if (filters.source) qs.set('source', filters.source);
  if (filters.action) qs.set('action', filters.action);
  if (filters.search) qs.set('search', filters.search);
  if (filters.date_from) qs.set('date_from', filters.date_from);
  if (filters.date_to) qs.set('date_to', filters.date_to);
  if (filters.ip) qs.set('ip', filters.ip);
  qs.set('page', filters.page);
  qs.set('limit', filters.limit);
  qs.set('sort', 'created_at');
  qs.set('order', 'desc');

  const res = await apiFetch(API + '/audit/logs?' + qs.toString());
  if (!res) return;

  const { data: logs, pagination } = res;

  el.innerHTML = `
    <div class="filters-bar">
      <div class="filter-group">
        <label>Search</label>
        <input type="text" id="fSearch" placeholder="User, action, IP, details..." value="${filters.search}">
      </div>
      <div class="filter-group">
        <label>Source</label>
        <select id="fSource">
          <option value="">All Sources</option>
          <option value="portal" ${filters.source==='portal'?'selected':''}>Portal</option>
          <option value="crm" ${filters.source==='crm'?'selected':''}>CRM</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Action</label>
        <select id="fAction">
          <option value="">All Actions</option>
          ${actions.map(a => `<option value="${a.action}" ${filters.action===a.action?'selected':''}>${actionLabel(a.action)} (${a.count})</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <label>From</label>
        <input type="date" id="fFrom" value="${filters.date_from}">
      </div>
      <div class="filter-group">
        <label>To</label>
        <input type="date" id="fTo" value="${filters.date_to}">
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" id="btnFilter"><i class="fas fa-search"></i> Filter</button>
        <button class="btn btn-secondary" id="btnReset">↻ Reset</button>
        <button class="btn btn-secondary" id="btnExport"><i class="fas fa-download"></i> CSV</button>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-header">
        <h3>Audit Logs</h3>
        <span class="count">${pagination.total.toLocaleString()} records</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Source</th>
              <th>User</th>
              <th>Action</th>
              <th>Details</th>
              <th>IP</th>
            </tr>
          </thead>
          <tbody id="logsBody">
            ${logs.length === 0 ? '<tr><td colspan="6"><div class="empty"><div class="icon"><i class="fas fa-list"></i></div><h3>No logs found</h3><p>Try adjusting your filters</p></div></td></tr>' : ''}
            ${logs.map(log => {
              const ts = new Date(log.created_at);
              const details = log.details ? (typeof log.details === 'object' ? Object.entries(log.details).map(([k,v]) => `${k}: ${v}`).join(', ') : String(log.details)) : '';
              return `<tr data-id="${log.id}">
                <td>
                  <div style="font-size:12px;font-weight:600;color:#0f172a;">${ts.toLocaleDateString('en-PH', {month:'short',day:'numeric'})}</div>
                  <div style="font-size:11px;color:#94a3b8;">${ts.toLocaleTimeString('en-PH')} · ${timeAgo(log.created_at)}</div>
                </td>
                <td>${sourceBadge(log.log_source)}</td>
                <td>
                  <div style="font-size:12px;font-weight:600;">${log.username || 'SYSTEM'}</div>
                  ${log.user_id ? '<div style="font-size:10px;color:#94a3b8;">ID: ' + log.user_id + '</div>' : ''}
                </td>
                <td>${actionBadge(log.action)}</td>
                <td><div style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#64748b;">${details || '—'}</div></td>
                <td class="ip-cell">${log.public_ip || '—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      ${pagination.totalPages > 1 ? `
      <div class="pagination">
        <div class="info">Page ${pagination.page} of ${pagination.totalPages} · Showing ${logs.length} of ${pagination.total.toLocaleString()}</div>
        <div class="page-btns">
          <button class="page-btn" ${pagination.page<=1?'disabled':''} data-p="${pagination.page-1}">‹</button>
          ${generatePageButtons(pagination.page, pagination.totalPages)}
          <button class="page-btn" ${pagination.page>=pagination.totalPages?'disabled':''} data-p="${pagination.page+1}">›</button>
        </div>
      </div>` : ''}
    </div>
  `;

  // Event bindings
  document.getElementById('btnFilter').addEventListener('click', applyFilters);
  document.getElementById('btnReset').addEventListener('click', resetFilters);
  document.getElementById('btnExport').addEventListener('click', exportCSV);
  document.getElementById('fSearch').addEventListener('keyup', (e) => { if (e.key === 'Enter') applyFilters(); });

  // Row click → detail
  document.getElementById('logsBody').addEventListener('click', (e) => {
    const row = e.target.closest('tr[data-id]');
    if (!row) return;
    const log = logs.find(l => l.id === parseInt(row.dataset.id));
    if (log) openDetail(log);
  });

  // Pagination
  document.querySelectorAll('.page-btn[data-p]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = parseInt(btn.dataset.p);
      if (p >= 1) { filters.page = p; renderLogs(); }
    });
  });

  // Auto-refresh every 30s
  startAutoRefresh();
}

function generatePageButtons(current, total) {
  let pages = [];
  let start = Math.max(1, current - 2);
  let end = Math.min(total, current + 2);
  for (let i = start; i <= end; i++) {
    pages.push(`<button class="page-btn ${i===current?'active':''}" data-p="${i}">${i}</button>`);
  }
  return pages.join('');
}

function applyFilters() {
  filters.search = document.getElementById('fSearch').value.trim();
  filters.source = document.getElementById('fSource').value;
  filters.action = document.getElementById('fAction').value;
  filters.date_from = document.getElementById('fFrom').value;
  filters.date_to = document.getElementById('fTo').value;
  filters.page = 1;
  renderLogs();
}

function resetFilters() {
  filters = { source: '', action: '', search: '', date_from: '', date_to: '', ip: '', page: 1, limit: 25 };
  renderLogs();
}

async function exportCSV() {
  const qs = new URLSearchParams();
  if (filters.source) qs.set('source', filters.source);
  if (filters.action) qs.set('action', filters.action);
  if (filters.search) qs.set('search', filters.search);
  if (filters.date_from) qs.set('date_from', filters.date_from);
  if (filters.date_to) qs.set('date_to', filters.date_to);
  toast('Generating CSV export...', 'info');
  try {
    const res = await fetch(API + '/audit/export?' + qs.toString(), {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('Export failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'audit_logs_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click(); URL.revokeObjectURL(url);
    toast('CSV exported successfully', 'success');
  } catch (e) { toast('Export failed: ' + e.message, 'error'); }
}

function startAutoRefresh() { autoRefreshId = setInterval(() => { if (currentPage === 'logs') renderLogs(); }, 30000); }
function stopAutoRefresh() { if (autoRefreshId) { clearInterval(autoRefreshId); autoRefreshId = null; } }

// ══════════════════════════════════════════
// DASHBOARD PAGE
// ══════════════════════════════════════════
async function renderDashboard() {
  const el = document.getElementById('pageContent');
  const res = await apiFetch(API + '/audit/stats');
  if (!res?.data) return;
  stats = res.data;

  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Today's Events</div>
        <div class="stat-value">${stats.today.total}</div>
        <div class="stat-sub">Portal: ${stats.today.portal} · CRM: ${stats.today.crm}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Logins Today</div>
        <div class="stat-value">${stats.today.logins}</div>
        <div class="stat-sub">Successful authentications</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Failed Logins (24h)</div>
        <div class="stat-value" style="color:${stats.today.failed_logins_24h > 10 ? '#dc2626' : '#0f172a'}">${stats.today.failed_logins_24h}</div>
        <div class="stat-sub">${stats.today.failed_logins_24h > 10 ? '<i class="fas fa-triangle-exclamation"></i> High — review immediately' : 'Normal range'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Portal Events</div>
        <div class="stat-value">${stats.today.portal}</div>
        <div class="stat-sub">Subscriber activity</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">CRM Events</div>
        <div class="stat-value">${stats.today.crm}</div>
        <div class="stat-sub">Staff activity</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="table-wrap">
        <div class="table-header"><h3>Recent Actions</h3></div>
        <table>
          <thead><tr><th>Action</th><th>Count</th></tr></thead>
          <tbody>
            ${stats.recent_actions.map(a => `<tr><td>${actionBadge(a.action)}</td><td style="font-weight:600;">${a.count}</td></tr>`).join('')}
            ${stats.recent_actions.length === 0 ? '<tr><td colspan="2" class="text-muted" style="text-align:center;padding:20px;">No activity today</td></tr>' : ''}
          </tbody>
        </table>
      </div>
      <div class="table-wrap">
        <div class="table-header"><h3>Top Users Today</h3></div>
        <table>
          <thead><tr><th>User</th><th>Source</th><th>Events</th></tr></thead>
          <tbody>
            ${stats.top_users.map(u => `<tr><td style="font-weight:600;">${u.username}</td><td>${sourceBadge(u.log_source)}</td><td style="font-weight:600;">${u.count}</td></tr>`).join('')}
            ${stats.top_users.length === 0 ? '<tr><td colspan="3" class="text-muted" style="text-align:center;padding:20px;">No activity today</td></tr>' : ''}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// ══════════════════════════════════════════
// USER TIMELINE PAGE
// ══════════════════════════════════════════
async function renderTimeline() {
  const el = document.getElementById('pageContent');

  el.innerHTML = `
    <div class="filters-bar">
      <div class="filter-group">
        <label>User ID</label>
        <input type="text" id="tlUserId" placeholder="Enter User ID" style="width:140px;">
      </div>
      <div class="filter-group">
        <label>Days</label>
        <select id="tlDays">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" id="btnTimeline"><i class="fas fa-search"></i> Load Timeline</button>
      </div>
    </div>
    <div id="timelineResult">
      <div class="empty"><div class="icon"><i class="fas fa-clock"></i></div><h3>Enter a User ID to view their activity timeline</h3><p>Shows all actions by a specific user</p></div>
    </div>
  `;

  document.getElementById('btnTimeline').addEventListener('click', loadTimeline);
  document.getElementById('tlUserId').addEventListener('keyup', (e) => { if (e.key === 'Enter') loadTimeline(); });
}

async function loadTimeline() {
  const userId = document.getElementById('tlUserId').value.trim();
  const days = document.getElementById('tlDays').value;
  if (!userId) { toast('Enter a User ID', 'error'); return; }

  const container = document.getElementById('timelineResult');
  container.innerHTML = '<div class="loading"><div class="spinner"></div> Loading timeline...</div>';

  const res = await apiFetch(API + '/audit/user-timeline/' + userId + '?days=' + days);
  if (!res?.data || res.data.length === 0) {
    container.innerHTML = '<div class="empty"><div class="icon"><i class="fas fa-inbox"></i></div><h3>No activity found</h3><p>No logs for this user in the selected period</p></div>';
    return;
  }

  // Group by date
  const grouped = {};
  res.data.forEach(log => {
    const d = new Date(log.created_at).toLocaleDateString('en-PH', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
    if (!grouped[d]) grouped[d] = [];
    grouped[d].push(log);
  });

  container.innerHTML = `
    <div class="table-wrap">
      <div class="table-header"><h3>Activity Timeline</h3><span class="count">${res.data.length} events</span></div>
      <div style="padding:20px;max-height:calc(100vh - 320px);overflow-y:auto;">
        ${Object.entries(grouped).map(([date, logs]) => `
          <div style="margin-bottom:20px;">
            <div style="font-size:12px;font-weight:700;color:#10b981;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #f1f5f9;">${date}</div>
            ${logs.map(log => {
              const ts = new Date(log.created_at).toLocaleTimeString('en-PH');
              const details = log.details ? (typeof log.details === 'object' ? Object.entries(log.details).map(([k,v]) => `${k}: ${v}`).join(', ') : '') : '';
              return `<div style="display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid #f8fafc;">
                <div style="font-family:'Space Grotesk',monospace;font-size:11px;color:#94a3b8;min-width:70px;padding-top:2px;">${ts}</div>
                <div>${sourceBadge(log.log_source)}</div>
                <div style="flex:1;">
                  <div>${actionBadge(log.action)}</div>
                  ${details ? `<div style="font-size:11px;color:#64748b;margin-top:3px;">${details}</div>` : ''}
                </div>
                <div class="ip-cell">${log.public_ip || ''}</div>
              </div>`;
            }).join('')}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ── Init ──
(async function init() {
  // Set user info in sidebar
  try {
    const me = await apiFetch(API + '/admin/me');
    if (me) {
      document.getElementById('footerName').textContent = me.fullName || me.full_name || 'Admin';
      document.getElementById('footerRole').textContent = me.role || 'CRM User';
      document.getElementById('avatarInitial').textContent = (me.fullName || me.full_name || 'A')[0].toUpperCase();
    }
  } catch (e) {}
  render();
})();
</script>
